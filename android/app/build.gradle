plugins {
    id 'com.android.application'
}

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.cortexdevelopments.rootweave'
    compileSdk 36

    defaultConfig {
        applicationId "com.cortexdevelopments.rootweave"
        minSdk 21
        targetSdk 36
        versionCode 5
        versionName "1.0.4"
        resValue "string", "appName", "Rootweave"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation('com.google.androidbrowserhelper:androidbrowserhelper:2.6.1') {
        exclude group: 'androidx.browser', module: 'browser'
    }
    // 2.6.1 calls CustomTabsIntent.Builder#setLaunchHandlerClientMode (browser 1.9.0+).
    // Pinning 1.8.0 crashes on launch with NoSuchMethodError.
    implementation 'androidx.browser:browser:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
