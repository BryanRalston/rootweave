function updateWildlife(dt, bio){
  // desired counts scale with biodiversity & water quality (capped, lightweight)
  const wq = state.waterQuality;
  const wTiles = waterTileIdx();
  const pondTiles = [];
  const lushTiles = [];
  state.grid.forEach((t,i)=>{
    if(t.terrain==='pond' || t.terrain==='wetland') pondTiles.push(i);
    if(t.terrain==='soil' && t.health>70) lushTiles.push(i);
  });
  const targets = flowerTargets();
  const wants = {
    bee:       bio>=30 ? Math.min(6, 2+(((bio-30)/10)|0)) : 0,
    butterfly: bio>=45 ? Math.min(5, 1+(((bio-45)/10)|0)) : 0,
    duck:      (wq>=70 && wTiles.length) ? (wq>=88?3:2) : 0,
    heron:     (wq>=85 && wTiles.length) ? 1 : 0,
    dragonfly: (pondTiles.length && bio>=25) ? Math.min(3, 1+(bio/30|0)) : 0,
    frog:      (pondTiles.length && bio>=38) ? Math.min(2, pondTiles.length) : 0,
    rabbit:    (lushTiles.length>=8 && bio>=50) ? 2 : lushTiles.length>=4&&bio>=50 ? 1 : 0,
  };
  const anchorFor = (kind)=>{
    let list = targets;
    if(kind==='duck' || kind==='heron') list = wTiles.length?wTiles:targets;
    else if(kind==='dragonfly' || kind==='frog') list = pondTiles.length?pondTiles:targets;
    else if(kind==='rabbit') list = lushTiles.length?lushTiles:targets;
    return tileWorld(list[(Math.random()*list.length)|0]);
  };
  // Motion kits: ground (hop) vs air (flap) vs water (paddle)
  const WILD_KIT = {
    bee:       {sp:38, fly:true,  flapHz:18, air:true,  ground:false},
    butterfly: {sp:20, fly:true,  flapHz:8,  air:true,  ground:false, drift:true},
    dragonfly: {sp:50, fly:true,  flapHz:22, air:true,  ground:false, dart:true},
    duck:      {sp:10, fly:false, flapHz:0,  air:false, ground:false, water:true},
    heron:     {sp:6,  fly:false, flapHz:0,  air:false, ground:true,  water:true, tall:true},
    frog:      {sp:11, fly:false, flapHz:0,  air:false, ground:true,  hop:true},
    rabbit:    {sp:18, fly:false, flapHz:0,  air:false, ground:true,  hop:true},
  };
  Object.entries(wants).forEach(([kind, want])=>{
    const have = countKind(kind);
    if(have<want && Math.random()<dt*0.5){
      const p = anchorFor(kind);
      const kit = WILD_KIT[kind] || WILD_KIT.bee;
      const groundY = (kind==='duck'||kind==='frog'||kind==='rabbit'||kind==='heron');
      wildlife.push({
        kind,
        x: p.x+(Math.random()-0.5)*26,
        y: p.y - (groundY ? 3+Math.random()*4 : 12+Math.random()*10),
        tx: p.x, ty: p.y - (groundY ? 4 : 12),
        sp: kit.sp * (0.85+Math.random()*0.3),
        ph: Math.random()*6.28,
        flap: Math.random(),
        facing: Math.random()<0.5 ? 1 : -1,
        moving: false,
        hopPhase: 0,
        retarget: 0.2+Math.random(),
        restT: 0,
      });
    }
    if(have>want) dropKind(kind);
  });
  for(let i=wildlife.length-1;i>=0;i--){
    if(wildlife[i].flock){
      wildlife[i].life = (wildlife[i].life||0) - dt;
      if(wildlife[i].life<=0){ wildlife.splice(i,1); }
    }
  }
  for(let i=birds.length-1;i>=0;i--){
    if(birds[i].flock){
      birds[i].life = (birds[i].life||0) - dt;
      if(birds[i].life<=0){ birds.splice(i,1); }
    }
  }
  wildlife.forEach(w=>{
    const kit = WILD_KIT[w.kind] || WILD_KIT.bee;
    if(w.facing==null) w.facing = 1;
    if(w.flap==null) w.flap = 0;
    if(w.hopPhase==null) w.hopPhase = 0;
    if(w.restT==null) w.restT = 0;

    w.retarget -= dt;
    if(w.restT > 0){
      w.restT -= dt;
      w.moving = false;
      // still flap lightly while perched/floating
      if(kit.fly) w.flap = (w.flap + dt * kit.flapHz * 0.35) % 1;
      w.ph += dt * 2;
      return;
    }

    if(w.retarget<=0){
      const p = anchorFor(w.kind);
      if(w.kind==='duck' || w.kind==='heron'){
        w.tx = p.x+(Math.random()-0.5)*28;
        w.ty = p.y-2-Math.random()*5;
        w.retarget = 3+Math.random()*4;
        if(Math.random()<0.35) w.restT = 1.2+Math.random()*2; // stand/float pause
      }else if(w.kind==='frog'){
        w.tx = p.x+(Math.random()-0.5)*20;
        w.ty = p.y-2;
        w.retarget = 1.8+Math.random()*2.5;
        if(Math.random()<0.4) w.restT = 0.8+Math.random()*1.5;
      }else if(w.kind==='rabbit'){
        w.tx = p.x+(Math.random()-0.5)*34;
        w.ty = p.y-3;
        w.retarget = 1.5+Math.random()*2.5;
        if(Math.random()<0.3) w.restT = 0.6+Math.random()*1.2;
      }else if(w.kind==='dragonfly'){
        w.tx = p.x+(Math.random()-0.5)*40;
        w.ty = p.y-10-Math.random()*18;
        w.retarget = 0.8+Math.random()*1.4;
      }else if(w.kind==='butterfly'){
        w.tx = p.x+(Math.random()-0.5)*42;
        w.ty = p.y-10-Math.random()*22;
        w.retarget = 2+Math.random()*3;
      }else{ // bee
        w.tx = p.x+(Math.random()-0.5)*36;
        w.ty = p.y-10-Math.random()*18;
        w.retarget = 1.8+Math.random()*2.5;
        if(Math.random()<0.2) w.restT = 0.4+Math.random()*0.8; // flower pause
      }
    }

    const dx = w.tx-w.x, dy = w.ty-w.y, d = Math.hypot(dx,dy);
    if(d > 2.5){
      w.moving = true;
      if(Math.abs(dx) > 0.5) w.facing = dx >= 0 ? 1 : -1;
      // hoppers: advance in bursts
      if(kit.hop){
        w.hopPhase = (w.hopPhase + dt * 2.4) % 1;
        const burst = Math.max(0, Math.sin(w.hopPhase * Math.PI)); // 0→1→0
        const spd = w.sp * (0.35 + burst * 1.4);
        w.x += dx/d * spd * dt;
        w.y += dy/d * spd * dt;
      }else{
        w.x += dx/d * w.sp * dt;
        w.y += dy/d * w.sp * dt;
        // butterfly drift
        if(kit.drift){
          w.x += Math.sin(w.ph * 0.7) * 8 * dt;
          w.y += Math.cos(w.ph * 0.5) * 5 * dt;
        }
        // dragonfly slight zig
        if(kit.dart && Math.random()<dt*2){
          w.x += (Math.random()-0.5)*6;
          w.y += (Math.random()-0.5)*4;
        }
      }
    }else{
      w.moving = false;
    }

    // wing flap phase (flyers always; birds handled separately)
    if(kit.fly){
      const flapMul = w.moving ? 1 : 0.4;
      w.flap = (w.flap + dt * kit.flapHz * flapMul) % 1;
    }
    w.ph += dt * (kit.fly ? 5 : 3);
  });

  // birds: screen-space fliers with wing flap + bank
  const wantBirds = bio>=60 ? Math.min(4, 1+(((bio-60)/14)|0)) : 0;
  const residentBirds = ()=> birds.filter(b=>!b.flock).length;
  while(residentBirds()<wantBirds){
    birds.push({
      x: -40-Math.random()*200,
      y: 0.06+Math.random()*0.16,
      sp: 28+Math.random()*22,
      ph: Math.random()*6.28,
      flap: Math.random(),
      facing: 1,
      bobAmp: 2+Math.random()*2,
    });
  }
  while(residentBirds()>wantBirds){
    const j = birds.findIndex(b=>!b.flock);
    if(j<0) break;
    birds.splice(j,1);
  }
  birds.forEach(b=>{
    b.x += b.sp*dt;
    b.flap = ((b.flap||0) + dt * 10) % 1;
    b.ph += dt * 3;
    // gentle altitude undulation (not wild bob)
    if(b.x > viewW+50){
      b.x = -50-Math.random()*150;
      b.y = 0.06+Math.random()*0.16;
      b.sp = 28+Math.random()*22;
    }
  });
}

const WILD_ART = {

const WILD_PACK_OK = {

/** Wing / hop / walk frame keys for wildlife multi-frame packs. */
function wildWalkCount(k){
  let n = 0;
  while(SPRITES[k+'_w'+n]) n++;
  return n;
}
function wildFrameKey(w){
  const k = w.kind;
  const wn = wildWalkCount(k);
  if(wn >= 4){
    const ph = (w.flap != null ? w.flap : w.ph || 0);
    return k+'_w'+(Math.floor(((ph%1)+1)%1 * wn) % wn);
  }
  if(!WILD_PACK_OK[k]) return k; // base still — no costume-flip packs
  if(k==='bee' && SPRITES['bee_wing_up'] && SPRITES['bee_wing_down']){
    return ((w.flap||0) < 0.5) ? 'bee_wing_up' : 'bee_wing_down';
  }
  if(k==='butterfly' && SPRITES['butterfly_wing_open'] && SPRITES['butterfly_wing_closed']){
    return ((w.flap||0) < 0.5) ? 'butterfly_wing_open' : 'butterfly_wing_closed';
  }
  if(k==='dragonfly' && SPRITES['dragonfly_wing_up'] && SPRITES['dragonfly_wing_down']){
    return ((w.flap||0) < 0.5) ? 'dragonfly_wing_up' : 'dragonfly_wing_down';
  }
  if((k==='rabbit' || k==='frog') && SPRITES[k+'_hop1'] && SPRITES[k+'_hop2']){
    if(!w.moving && SPRITES[k+'_idle']) return k+'_idle';
    return ((w.hopPhase||0) < 0.45) ? k+'_hop1' : k+'_hop2';
  }
  if((k==='duck' || k==='heron') && SPRITES[k+'_walk1'] && SPRITES[k+'_walk2']){
    if(!w.moving && SPRITES[k+'_idle']) return k+'_idle';
    return (Math.sin((w.ph||0)*2.2) >= 0) ? k+'_walk1' : k+'_walk2';
  }
  if(k==='fish' && SPRITES['fish_swim1'] && SPRITES['fish_swim2']){
    return (Math.sin((w.ph||0)*3) >= 0) ? 'fish_swim1' : 'fish_swim2';
  }
  if(k==='ladybug' && SPRITES['ladybug_walk1'] && SPRITES['ladybug_walk2']){
    if(!w.moving && SPRITES['ladybug_idle']) return 'ladybug_idle';
    return (Math.sin((w.ph||0)*2.5) >= 0) ? 'ladybug_walk1' : 'ladybug_walk2';
  }
  return k;
}
function drawWildCritter(w, time){
  const art = WILD_ART[w.kind];
  if(!art) return;
  const kit = {
    bee:true, butterfly:true, dragonfly:true,
  }[w.kind] ? 'fly' : (w.kind==='frog'||w.kind==='rabbit') ? 'hop' : (w.kind==='duck') ? 'water' : 'ground';

  const face = (w.facing|0) >= 0 ? 1 : -1;
  const frameKey = wildFrameKey(w);
  const w0 = art.w;
  const h0 = spriteH(frameKey, w0, spriteH(w.kind, w0, w0*0.9));
  const img = SPRITES[frameKey] || SPRITES[w.kind];
  const hasWingFrames = frameKey !== w.kind && (frameKey.indexOf('wing')>=0 || frameKey.indexOf('walk')>=0 || frameKey.indexOf('hop')>=0 || frameKey.indexOf('swim')>=0);

  // Vertical motion by kind
  let yOff = 0;
  let sx = 1, sy = 1, lean = 0;
  if(kit==='hop'){
    const hop = Math.sin((w.hopPhase||0) * Math.PI);
    yOff = w.moving ? -hop * (w.kind==='rabbit' ? 7 : 5.5) : 0;
    sx = 1 + (w.moving ? hop * 0.08 : 0);
    sy = 1 - (w.moving ? hop * 0.1 : 0);
    if(!w.moving && w.restT > 0){ lean = 0.04; yOff = 0.5; }
  }else if(kit==='water'){
    yOff = Math.sin((w.ph||0)*0.7) * 1.0;
    if(w.kind==='heron' && !w.moving) lean = 0.05;
  }else if(kit==='fly'){
    if(hasWingFrames){
      // real wing frames — light bob only
      yOff = Math.sin((w.ph||0)*0.9) * (w.kind==='bee' ? 1.0 : 1.6);
      lean = w.moving ? face * 0.04 : 0;
    }else{
      const flap = Math.sin((w.flap||0) * Math.PI * 2);
      sx = 1 + Math.abs(flap) * 0.06;
      sy = 1 - Math.abs(flap) * (w.kind==='bee' ? 0.14 : w.kind==='dragonfly' ? 0.1 : 0.18);
      yOff = Math.sin((w.ph||0)*0.9) * (w.kind==='bee' ? 1.2 : w.kind==='dragonfly' ? 0.8 : 2.0);
      lean = w.moving ? face * 0.06 : 0;
    }
  }else{
    yOff = Math.sin((w.ph||0)*0.4) * 0.4;
  }

  if(kit==='hop' || kit==='water' || kit==='ground'){
    const shadowY = w.y + 2;
    const lift = kit==='hop' ? Math.abs(yOff) : 0;
    ctx.fillStyle = 'rgba(30,20,8,.2)';
    ctx.beginPath();
    ctx.ellipse(w.x, shadowY, w0*0.28 * (1 - lift*0.04), w0*0.1, 0, 0, 6.29);
    ctx.fill();
  }

  ctx.save();
  ctx.translate(w.x, w.y + yOff);
  ctx.scale(face * sx, sy);
  ctx.rotate(lean);
  if(img){
    ctx.drawImage(img, -w0/2, -h0*0.55, w0, h0);
  }else{
    ctx.font = `${w0-1}px "Segoe UI Emoji","Apple Color Emoji",sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(art.em, 0, 0);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }
  ctx.restore();
}
function drawWildlifeWorld(time){
  // AA — skip / thin critters when herds + large boards stress the frame
  if(!wildlife || !wildlife.length) return;
  if((GRID|0) >= 12 && agents.length > 32) return;
  const maxW = agents.length > 24 ? 8 : (agents.length > 16 ? 14 : wildlife.length);
  // back-to-front by y so nearer critters draw on top
  const list = wildlife.slice().sort((a,b)=> a.y - b.y);
  const start = Math.max(0, list.length - maxW);
  for(let i=start;i<list.length;i++) drawWildCritter(list[i], time);
}
function drawBirdsScreen(time){
  // AA — fewer screen birds on valley with busy herds
  if((GRID|0) >= 12 && agents.length > 30) return;
  birds.forEach(b=>{
    const flapPh = b.flap||0;
    const flap = Math.sin(flapPh * Math.PI * 2);
    const by = viewH * b.y + Math.sin(time*1.2 + b.ph) * (b.bobAmp||2.5);
    const bw = 20;
    // real wing frames when available
    const frameKey = (WILD_PACK_OK.bird && SPRITES['bird_wing_up'] && SPRITES['bird_wing_down'])
      ? (flapPh < 0.5 ? 'bird_wing_up' : 'bird_wing_down')
      : 'bird';
    const bh = spriteH(frameKey, bw, 16);
    const img = SPRITES[frameKey] || SPRITES['bird'];
    const hasFrames = frameKey !== 'bird';
    ctx.save();
    ctx.translate(b.x, by);
    if(hasFrames){
      ctx.rotate(flap * 0.05);
    }else{
      ctx.scale(1 + Math.abs(flap)*0.05, 1 - Math.abs(flap)*0.16);
      ctx.rotate(flap * 0.08);
    }
    if(img){
      ctx.drawImage(img, -bw/2, -bh*0.45, bw, bh);
    }else{
      ctx.font = '15px "Segoe UI Emoji","Apple Color Emoji",sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🐦', 0, 0);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
    }
    ctx.restore();
  });
}
// Valley first-minute beacon: pulse living Homestead Vale tiles + arrow on barn
function drawValeBeacon(time){
  if(!state || homesteadMode || !isValleyLevel(state.lv)) return;
  if((state.regionIdx|0) > 0) return;
  if(state.valeBeaconT == null) state.valeBeaconT = 14;
  if(state.valeBeaconT <= 0) return;
  const fade = Math.min(1, state.valeBeaconT / 3.5);
  const pulse = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(time * 3.4));
  state.grid.forEach((tile)=>{
    if(tile.region !== 'vale') return;
    if(tile.terrain !== 'soil' && tile.terrain !== 'barn' && tile.terrain !== 'coop') return;
    const o = tileOrigin(tile);
    ctx.save();
    ctx.globalAlpha = 0.22 * pulse * fade;
    ctx.fillStyle = '#c8f0a0';
    diamondPath(o.x, o.y); ctx.fill();
    ctx.globalAlpha = 0.55 * pulse * fade;
    ctx.strokeStyle = '#ffe89a';
    ctx.lineWidth = 2.6;
    diamondPath(o.x, o.y); ctx.stroke();
    ctx.restore();
  });
  const bi = idx(1, 1);
  if(inGrid(1, 1) && state.grid[bi]){
    const o = tileOrigin(state.grid[bi]);
    const bob = Math.sin(time * 2.6) * 5;
    ctx.globalAlpha = 0.95 * fade;
    drawEmoji('👇', o.x, o.y - 30 + bob, 20);
    ctx.globalAlpha = 0.9 * fade;
    ctx.font = 'bold 11px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff8e0';
    ctx.strokeStyle = 'rgba(40,30,10,.55)';
    ctx.lineWidth = 3;
    const label = 'Start here';
    ctx.strokeText(label, o.x, o.y - 48 + bob);
    ctx.fillText(label, o.x, o.y - 48 + bob);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }
}

// ------------------------------------------------- ambient life & atmosphere
let deadAnchors = [], lushAnchors = [], anchorT = 99;
function refreshAnchors(){
  deadAnchors = []; lushAnchors = [];
  state.grid.forEach((t,i)=>{
    if(t.terrain==='dead' || t.terrain==='riverbed'){ if(sr(i*3)>0.5) deadAnchors.push(tileWorld(i)); }
    else if(t.terrain==='soil' && t.health>70){ if(sr(i*5)>0.35) lushAnchors.push(tileWorld(i)); }
    else if((t.terrain==='trees' || t.terrain==='wetland') && sr(i*7)>0.4) lushAnchors.push(tileWorld(i));
  });
}
function drawAmbient(time){
  const td = todInfo();
  // M3 — skip drifting dust/particles under reduced motion
  if(document.body.classList.contains('reduce-motion')) return;
  // O2 — fewer ambient loops on large grids
  const big = (GRID|0) >= 12;
  // dust motes drifting over the dead ground
  if(deadAnchors.length && state.season!==3 && td.night<0.5){
    ctx.fillStyle = 'rgb(214,190,140)';
    const n = Math.min(big ? 14 : 26, deadAnchors.length*2);
    for(let k=0;k<n;k++){
      const a = deadAnchors[k % deadAnchors.length];
      const ph = fract(time*0.07*(0.6+sr(k*3)) + sr(k*7));
      const x = a.x - 30 + ph*70 + Math.sin(time*0.9+k)*6;
      const y = a.y - 4 - Math.sin(ph*Math.PI)*14 - sr(k*5)*8;
      ctx.globalAlpha = Math.sin(ph*Math.PI)*(0.3+sr(k)*0.25)*(1-td.night);
      ctx.beginPath(); ctx.arc(x, y, 1+sr(k*11)*1.3, 0, 6.29); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  // pollen & petals sparkling over thriving land
  if(lushAnchors.length && state.season!==3 && td.night<0.4){
    const n = Math.min(big ? 10 : 20, lushAnchors.length*2);
    for(let k=0;k<n;k++){
      const a = lushAnchors[k % lushAnchors.length];
      const ph = fract(time*0.05*(0.5+sr(k*13)) + sr(k*17));
      const x = a.x + Math.sin(time*0.6+k*2)*18;
      const y = a.y - 6 - ph*26;
      ctx.globalAlpha = Math.sin(ph*Math.PI)*0.55*(1-td.night*2);
      ctx.fillStyle = k%3===0 ? '#ffd9e8' : '#fff7c8';
      ctx.beginPath(); ctx.arc(x, y, 1.1+sr(k*19), 0, 6.29); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  // fireflies rise at night over the living land
  if(lushAnchors.length && td.night>0.45 && state.season!==3){
    const n = Math.min(16, lushAnchors.length*2);
    for(let k=0;k<n;k++){
      const a = lushAnchors[k % lushAnchors.length];
      const x = a.x + Math.sin(time*0.5+k*2.3)*22 + Math.sin(time*1.3+k)*6;
      const y = a.y - 10 - Math.sin(time*0.4+k*1.7)*8;
      const gl = 0.4+0.6*Math.abs(Math.sin(time*1.8+k*2.9));
      ctx.globalAlpha = (td.night-0.45)/0.55 * gl;
      ctx.fillStyle = '#fff2a0';
      ctx.shadowColor = '#ffe36e'; ctx.shadowBlur = 6;
      ctx.beginPath(); ctx.arc(x, y, 1.5, 0, 6.29); ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;
  }
}

// ---------------------------------------------------------------- render
// cull tiles outside the viewport (the 14x14 world can be zoomed way in)
function tileVisible(t){
  const z = cam.zoom;
  const sx = (t.c-t.r)*TW2*z + cam.x;
  const sy = (t.c+t.r)*TH2*z + cam.y;
  return sx > -120*z && sx < viewW+120*z && sy > -140*z && sy < viewH+90*z;
}
function dioramaPathQuad(q){
  ctx.beginPath();
  ctx.moveTo(q[0].x,q[0].y); ctx.lineTo(q[1].x,q[1].y);
  ctx.lineTo(q[2].x,q[2].y); ctx.lineTo(q[3].x,q[3].y);
  ctx.closePath();
}
/** Per-cell ground material under crops — soil improvement you can see. */
function drawDioramaCellGround(t, time){
  if(!t) return;
  const h = t.health|0;
  const base = pt(t, 0.5, 0.55);
  const L = dioramaLayout();
  const cellW = Math.hypot(L.plot[1].x-L.plot[0].x, L.plot[1].y-L.plot[0].y)/(GRID||6);
  const seed = (t.c*17 + t.r*31) | 0;
  // Jitter so the plot doesn't look like a sticker sheet
  const jx = (sr(seed)-0.5)*cellW*0.12;
  const jy = (sr(seed+3)-0.5)*cellW*0.08;
  const x = base.x + jx, y = base.y + jy;

  let spr = null, scale = 0.75;
  if(t.terrain==='dead' || (t.terrain==='soil' && h < 38)){
    // Crust still visible on bad cells even as farm averages improve
    spr = 'dio_crust';
    scale = 0.55 + (1 - Math.min(1, h/38))*0.25;
  }else if(t.terrain==='soil' && h < 62){
    spr = 'dio_soil'; // dark tilled recovery
    scale = 0.6 + (h-38)/24*0.25;
  }else if(t.terrain==='soil' && h >= 62){
    spr = 'dio_grass'; // living ground
    scale = 0.65 + Math.min(0.35, (h-62)/40*0.35);
  }
  if(!spr || !SPRITES[spr]) return;
  // Don't double-cover if a full crop already owns the cell visually
  if(t.crop && t.crop.growth > 0.55 && spr==='dio_grass') scale *= 0.55;
  const sw = Math.max(22, Math.min(100, cellW * scale));
  const sh = spriteH(spr, sw, sw*0.7);
  ctx.save();
  ctx.globalAlpha = t.terrain==='dead' ? 0.75 : 0.9;
  drawSprite(spr, x, y+2, sw, sh, null);
  ctx.restore();
}
function drawDioramaCellWash(t){
  // Kept as tiny dead-cell darkening only (props do the real story)
  if(t.terrain!=='dead') return;
  const q = dioramaCellQuad(t.c, t.r);
  dioramaPathQuad(q);
  ctx.fillStyle = 'rgba(40,35,30,0.10)';
  ctx.fill();
}
function drawDioramaHighlight(i, color){
  if(i<0 || !state) return;
  const t = state.grid[i]; if(!t) return;
  const q = dioramaCellQuad(t.c, t.r);
  dioramaPathQuad(q);
  // Soft golden “living edge” like mockup D — not a hard HUD box
  ctx.save();
  ctx.shadowColor = 'rgba(255,210,80,0.75)';
  ctx.shadowBlur = 14;
  ctx.strokeStyle = color || 'rgba(255,220,120,0.95)';
  ctx.lineWidth = 2.2;
  ctx.globalAlpha = 0.95;
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 0.08;
  ctx.fillStyle = color || '#ffe08a';
  ctx.fill();
  ctx.restore();
}
/** ¾ photoreal plot stage — sim grid mapped onto plate (Home Patch prototype). */
function renderDiorama(time){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const L = dioramaLayout();

  // Fallback fill only if plate not loaded (matches plate warm dirt, not cartoon sky)
  ctx.fillStyle = '#3a2c1c';
  ctx.fillRect(0,0,viewW,viewH);

  if(L.img){
    // ONE solid plate only — cohesive world. Healing is props on the work zone, not plate morphs.
    ctx.drawImage(L.img, L.px, L.py, L.pw, L.ph);
  }else{
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.font = '600 15px system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Loading section…', viewW/2, viewH/2);
  }

  // Soft UI vignette — keep chrome readable without a fake sky letterbox
  const vig = ctx.createLinearGradient(0, 0, 0, viewH);
  vig.addColorStop(0, 'rgba(20,14,8,0.42)');
  vig.addColorStop(0.12, 'rgba(20,14,8,0)');
  vig.addColorStop(0.78, 'rgba(20,14,8,0)');
  vig.addColorStop(1, 'rgba(20,14,8,0.50)');
  ctx.fillStyle = vig;
  ctx.fillRect(0,0,viewW,viewH);
  const vigX = ctx.createLinearGradient(0, 0, viewW, 0);
  vigX.addColorStop(0, 'rgba(20,14,8,0.28)');
  vigX.addColorStop(0.08, 'rgba(20,14,8,0)');
  vigX.addColorStop(0.92, 'rgba(20,14,8,0)');
  vigX.addColorStop(1, 'rgba(20,14,8,0.28)');
  ctx.fillStyle = vigX;
  ctx.fillRect(0,0,viewW,viewH);

  // No full HUD grid (mockup D). Soft dots only while placing a non-select tool.
  if(tool && tool!=='select'){
    ctx.save();
    ctx.fillStyle = 'rgba(255,245,200,0.35)';
    for(let r=0;r<GRID;r++) for(let c=0;c<GRID;c++){
      const p = dioramaCellCenter(c,r);
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, 6.29); ctx.fill();
    }
    ctx.restore();
  }

  // Per-cell dead darkening (subtle)
  for(let r=0;r<GRID;r++) for(let c=0;c<GRID;c++){
    drawDioramaCellWash(state.grid[idx(c,r)]);
  }
  // Per-cell ground materials (crust → tilled soil → grass) — soil improving in place
  for(let r=0;r<GRID;r++) for(let c=0;c<GRID;c++){
    drawDioramaCellGround(state.grid[idx(c,r)], time);
  }
  // Data overlay wash if enabled (Soil Health etc.)
  if(overlay!=='none'){
    for(let r=0;r<GRID;r++) for(let c=0;c<GRID;c++){
      const t = state.grid[idx(c,r)];
      const col = overlayColor(t);
      if(!col) continue;
      dioramaPathQuad(dioramaCellQuad(c,r));
      ctx.globalAlpha = overlay==='health' ? 0.28 : 0.32;
      ctx.fillStyle = col;
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  if(hovered>=0 && hovered!==selected){
    let hCol = tool==='select' ? '#ffffff' : '#ffe270';
    if(homesteadMode && tool!=='select' && tool!=='bulldoze'){
      const block = typeof hsPlaceBlocked==='function' ? hsPlaceBlocked(hovered) : null;
      hCol = block ? '#e06666' : '#7ed07a';
    }
    drawDioramaHighlight(hovered, hCol);
  }
  if(selected>=0) drawDioramaHighlight(selected, '#ffd45e');

  // Crops / compost / buildings on top of ground props
  for(let r=0;r<GRID;r++) for(let c=0;c<GRID;c++){
    const i = idx(c,r);
    drawTileObjects(state.grid[i], i, time);
  }
  drawParts(worldParts);

  // TOD wash — keep mild so we don't fight the plate's golden hour
  const td = todInfo();
  if(td.warm>0){ ctx.fillStyle = `rgba(255,150,60,${(td.warm*0.06).toFixed(3)})`; ctx.fillRect(0,0,viewW,viewH); }
  if(td.night>0){ ctx.fillStyle = `rgba(13,20,52,${(td.night*0.22).toFixed(3)})`; ctx.fillRect(0,0,viewW,viewH); }
  // Skip cartoon weather/birds over photoreal plate (style clash)
  drawParts(screenParts);
  if(typeof drawEarthBreath==='function') drawEarthBreath();
  if(state.paused || modalOpen || journeyOpen){
    ctx.fillStyle = 'rgba(20,16,8,.14)';
    ctx.fillRect(0,0,viewW,viewH);
  }
}

function render(time){
  if(useDiorama()){
    renderDiorama(time);
    return;
  }
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawSky(time);
  drawHorizon(time);
  // world pass
  ctx.setTransform(DPR*cam.zoom, 0, 0, DPR*cam.zoom, DPR*cam.x, DPR*cam.y);
  // Soft ambient contact under the whole board (iso quality polish)
  if(state && GRID>0){
    const mid = tileOrigin({c:(GRID-1)/2, r:(GRID-1)/2});
    const rx = GRID*TW2*0.92, ry = GRID*TH2*0.55 + TDEPTH;
    ctx.save();
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = '#1a1008';
    ctx.beginPath();
    ctx.ellipse(mid.x, mid.y + GRID*TH2*0.55 + TDEPTH*0.6, rx, ry*0.42, 0, 0, 6.29);
    ctx.fill();
    ctx.restore();
  }
  // Continuous volume under the board (hides jagged tile skirts)
  drawBoardBorder();
  for(let r=0;r<GRID;r++) for(let c=0;c<GRID;c++){
    const t = state.grid[idx(c,r)];
    if(tileVisible(t)) withRevivePop(t, idx(c,r), ()=>drawGround(t, time), true);
  }
  // Rim stroke again on top of grass so border reads clean
  drawBoardRimTop();
  // L3 — yard place ghost: green ok / red blocked before commit
  if(hovered>=0 && hovered!==selected){
    let hCol = tool==='select' ? '#ffffff' : '#ffe270';
    if(homesteadMode && tool!=='select' && tool!=='bulldoze'){
      const block = typeof hsPlaceBlocked==='function' ? hsPlaceBlocked(hovered) : null;
      hCol = block ? '#e06666' : '#7ed07a';
    }
    drawHighlight(hovered, time, hCol);
  }
  if(selected>=0) drawHighlight(selected, time, '#ffd45e');
  for(let r=0;r<GRID;r++) for(let c=0;c<GRID;c++){
    const t = state.grid[idx(c,r)];
    if(tileVisible(t)) withRevivePop(t, idx(c,r), ()=>drawTileObjects(t, idx(c,r), time));
  }
  drawWildlifeWorld(time);
  // AA — ambient glitter cheaper on large crowded boards
  if(!((GRID|0) >= 12 && agents.length > 36)) drawAmbient(time);
  drawValeBeacon(time);
  drawParts(worldParts);
  // screen pass
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // time-of-day lighting wash (dusk glow, night blue)
  const td = todInfo();
  if(td.warm>0){ ctx.fillStyle = `rgba(255,150,60,${(td.warm*0.10).toFixed(3)})`; ctx.fillRect(0,0,viewW,viewH); }
  if(td.night>0){ ctx.fillStyle = `rgba(13,20,52,${(td.night*0.32).toFixed(3)})`; ctx.fillRect(0,0,viewW,viewH); }
  drawBirdsScreen(time);
  // AA — skip weather particles when valley herd is maxed (keep sky wash above)
  if(!((GRID|0) >= 12 && agents.length > 40)) drawWeather(time);
  drawParts(screenParts);
  if(typeof drawEarthBreath==='function') drawEarthBreath();
  if(state.paused || modalOpen || journeyOpen){
    ctx.fillStyle = 'rgba(20,16,8,.14)';
    ctx.fillRect(0,0,viewW,viewH);
  }
}

// ---------------------------------------------------------------- main loop
let hudT = 0;
function frame(now){
  const dt = Math.min(0.1, (now-lastT)/1000 || 0.016);
  lastT = now;
  try{
    if(!state || !state.grid){
      requestAnimationFrame(frame);
      return;
    }
    farmCache = farmStats();
    const simDt = (state.paused || modalOpen || journeyOpen || homesteadMode) ? 0 : dt*(state.speed||1);
    if(simDt>0) simStep(simDt);
    // wakeDeadTile / applyTool dirty farmCache mid-tick — never read a null cache
    if(!farmCache) farmCache = farmStats();

const pointers = new Map();

function clearLongPress(){

function tryPaint(p){

function onPointerDown(e){

      zoom0: cam.zoom,
      mx:(pts[0].x+pts[1].x)/2, my:(pts[0].y+pts[1].y)/2,
      camX:cam.x, camY:cam.y,
    };
    return;
  }

    // AZ — touch/pen: defer pan until move so long-press inspect can win; mouse pans immediately

    if(touchy) downInfo.pendingPan = true;

    const sx = p.x, sy = p.y;

    longPressTimer = setTimeout(()=>{
      longPressTimer = null;
      if(!downInfo || downInfo.moved || downInfo.button===1 || downInfo.button===2) return;
      if(pointers.size > 1) return; // pinch wins
      const i = screenToTile(sx, sy);
      if(i<0) return;
      downInfo.longPress = true;
      downInfo.pendingPan = false;
      paintSet = null;

}
function onPointerMove(e){

  if(pinchState && pointers.size>=2){
    clearLongPress();
    if(camp && camp.tipsShown) camp.tipsShown.zoom_discovered = true;
    const pts = [...pointers.values()];
    const d = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y) || 1;
    const mx = (pts[0].x+pts[1].x)/2, my = (pts[0].y+pts[1].y)/2;
    const wx = (pinchState.mx - pinchState.camX)/pinchState.zoom0;
    const wy = (pinchState.my - pinchState.camY)/pinchState.zoom0;
    cam.zoom = pinchState.zoom0 * d/pinchState.d0;
    cam.zoom = Math.max(fitZoom*0.55, Math.min(CAM_ZOOM_MAX, cam.zoom));
    cam.x = mx - wx*cam.zoom;
    cam.y = my - wy*cam.zoom;

      downInfo.pendingPan = false;
    }

    cam.y = panState.camY + (p.y-panState.y);

function onPointerUp(e){

  if(pointers.size===1){
    // one finger remains: resume panning from it
    startPan([...pointers.values()][0]);
    downInfo = null; paintSet = null;
    return;
  }
  // AX2 — right-click release = inspect (desktop power user)
  if(downInfo && !downInfo.moved && (downInfo.button===2 || downInfo.inspect)){
    const i = screenToTile(p.x, p.y);
    if(i>=0) inspectTile(i);
    panState = null; paintSet = null; downInfo = null;
    return;
  }
  // Long-press already inspected — don't also place/paint
  if(downInfo && downInfo.longPress){
    panState = null; paintSet = null; downInfo = null;
    return;
  }
  const clicked = downInfo && !downInfo.moved && downInfo.button!==1 && downInfo.button!==2;
  if(clicked){
    const i = screenToTile(p.x, p.y);
    if(tool==='select'){
      if(i>=0) applyTool(i);
      else { selected = -1; closeInfo(); }
    }else if(i>=0 && !toolPaints(tool) && (toolDef(tool) || isYardTool(tool))){
      applyTool(i);
    }
  }

}
function onWheel(e){
  e.preventDefault();

  if(camp && camp.tipsShown) camp.tipsShown.zoom_discovered = true;

  cam.y = p.y - wy*cam.zoom;

}

function haptic(kind){

/** AD — single visible toast; overflow queues so cold-boot tips don't clobber each other. */
let toastQueue = [];
let toastBusyUntil = 0;
/** BL — global coach pacing: at most one *once-tip* every 4s (action toasts unrestricted). */
let lastOnceCoachT = 0;
const ONCE_COACH_GAP_MS = 4000;
function toast(msg, opts){
  opts = opts || {};
  // BB — never empty / whitespace-only shells (also reject pure emoji-less blanks)
  if(msg == null) return;
  msg = String(msg).replace(/\s+/g, ' ').trim();
  if(!msg) return;
  // once-per-save: check early, but only *reserve* when we commit to show/queue (not under modal)
  const onceKey = opts.once ? String(opts.once) : '';
  if(onceKey){
    if(!camp.tipsShown) camp.tipsShown = {};
    if(camp.tipsShown[onceKey] && !opts._fromQueue) return;
    // BR — veterans who skipped coaching: silence soft discover tips, keep systems literacy
    if(camp.tipsShown.skip_coaching && !opts.force && !opts._fromQueue && !opts._coachBypass){
      // CD — complete soft-discover silence map (systems literacy keys stay out)
      const VET_SILENCE = {
        first_paint_play:1, inspect_paint_nudge:1, inspect_rc_tip:1, keys_help:1,
        palette_scroll_hint:1, sound_muted_boot:1, map_pin_story_toast:1,
        zoom_discover:1, pan_discover:1, speed_nudge:1, hs_enter_once:1, hs_bank0_free:1,
        sound_first_on:1, pause_space:1, season_first_juice:1,
        overlay_coach:1, overlay_menu_once:1,
        journey_leave_mid:1, keys_r_fence:1, keys_r_place:1,
        plot_goals_all:1, freeplay_first:1, journey_after_home:1,
        dual_prestige:1, scrapbook_story_pill:1, dg_section_first:1,
        scrapbook_first_entry:1, farmstand:1,
        wildlife_bees:1, wildlife_flies:1, wildlife_birds:1,
        vale_beacon:1, valley_shop_adv:1, export_save_lit:1,
        cot_leave_once:1,
        // kept out (systems): bank_first_clear, first_badge_lit, dg_first_claim, winter_first, first_* place, dust_*
      };
      if(VET_SILENCE[onceKey]){
        camp.tipsShown[onceKey] = true; // consume without showing
        return;
      }
    }
  }
  // throttle identical / near-identical messages (~1.5s) — paint-drag & error spam
  const now = performance.now();
  const throttleMs = opts.throttleMs != null ? opts.throttleMs : 1500;
  const norm = msg.slice(0, 80);
  if(!opts._fromQueue && (msg===lastToastMsg || norm===lastToastNorm) && now-lastToastT<throttleMs) return;
  // don't stack under modals — player can't act on the tip anyway (force = share fail etc.)
  // once-key not reserved yet → can retry after modal closes
  if(!opts.force && (modalOpen || document.getElementById('modalWrap').classList.contains('show'))) return;
  const box = document.getElementById('toasts');
  if(!box) return;
  // BL/BN — pace *once-coach* tips only (max 1 / 4s). Action toasts (no opts.once) skip this entirely.
  if(onceKey && !opts.force && !opts._coachBypass){
    const since = now - (lastOnceCoachT|0);
    if(lastOnceCoachT && since < ONCE_COACH_GAP_MS){
      if(!camp.tipsShown[onceKey] && toastQueue.length < 4){
        camp.tipsShown[onceKey] = true; // reserve so we don't stack duplicates
        const wait = ONCE_COACH_GAP_MS - since + 60;
        setTimeout(()=>{
          toast(msg, { throttleMs: opts.throttleMs, once: onceKey, _fromQueue:true, _coachBypass:true });
        }, wait);
      }
      return;
    }
  }
  // AD — only queue soft once-tips so action toasts (errors/feedback) still replace immediately
  if(!opts.force && !opts._fromQueue && onceKey && now < toastBusyUntil){
    if(!camp.tipsShown[onceKey] && toastQueue.length < 4){
      camp.tipsShown[onceKey] = true; // reserve while queued
      toastQueue.push({msg, opts:{ throttleMs: opts.throttleMs, once: onceKey, _fromQueue:true, _coachBypass:true }});
    }
    return;
  }
  if(onceKey){
    camp.tipsShown[onceKey] = true;
    lastOnceCoachT = now;
  }
  lastToastMsg = msg; lastToastNorm = norm; lastToastT = now;
  while(box.firstChild) box.removeChild(box.firstChild);
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  box.appendChild(el);
  const hold = document.body.classList.contains('reduce-motion') ? 3600 : 3200;
  toastBusyUntil = now + hold + 120;
  setTimeout(()=>{
    if(el.parentNode) el.parentNode.removeChild(el);
    // drain queued once-tips after current leaves
    if(toastQueue.length){
      const next = toastQueue.shift();
      toast(next.msg, next.opts || {});
    }
  }, hold);
}

function toolLabelShort(td){

  if(!cleaned || !/[^\s]/.test(cleaned)) return '';

  }
  return short;
}

/** BD — edge-fade + once tip when tool bar overflows on narrow screens. */
function updatePaletteScrollHint(){
  try{
    const pal = document.getElementById('palette');
    if(!pal) return;
    const overflow = pal.scrollWidth > pal.clientWidth + 10;
    pal.classList.toggle('pal-scrollable', overflow);
    if(overflow && window.innerWidth <= 720){
      // only once per save; after palette rebuilds
      if(!camp.tipsShown) camp.tipsShown = {};
      if(!camp.tipsShown.palette_scroll_hint){
        // delay so it doesn't fight cold-boot mute/keys tips
        setTimeout(()=>{
          if(!camp.tipsShown.palette_scroll_hint){
            toast('👉 Swipe the tool bar for more tools', {once:'palette_scroll_hint', throttleMs:5000});
          }
        }, 2200);
      }
    }
    const syncEnd = ()=>{
      const max = Math.max(0, pal.scrollWidth - pal.clientWidth);
      const atEnd = max <= 2 || pal.scrollLeft >= max - 3;
      pal.classList.toggle('pal-at-end', atEnd);
      // also hide once they've scrolled at all (discovered the affordance)
      if(pal.scrollLeft > 10) pal.classList.add('pal-scrolled');
    };
    syncEnd();
    if(!pal._scrollBound){
      pal._scrollBound = true;
      pal.addEventListener('scroll', syncEnd, {passive:true});
    }
  }catch(e){}
}

/** H1 — pattern marks on health overlay tiles (dual-code with color). */
function drawHealthPatternMark(o, t){
  if(!isLandT(t) && t.terrain!=='dead') return;
  const h = t.terrain==='dead' ? 0 : (t.health|0);
  const cx = o.x, cy = o.y + TH2;
  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.strokeStyle = 'rgba(20,12,6,.75)';
  ctx.fillStyle = 'rgba(20,12,6,.55)';
  ctx.lineWidth = 1.2;
  if(t.terrain==='dead' || h < 25){
    // dots — dead/poor
    for(let k=0;k<3;k++){
      ctx.beginPath();
      ctx.arc(cx + (k-1)*5, cy + (k%2)*3 - 1, 1.4, 0, 6.29);
      ctx.fill();
    }
  }else if(h < 45){
    // slash — thin/poor
    ctx.beginPath();
    ctx.moveTo(cx-6, cy+4); ctx.lineTo(cx+6, cy-4);
    ctx.stroke();
  }else if(h >= 70){
    // plus — great
    ctx.beginPath();
    ctx.moveTo(cx-5, cy); ctx.lineTo(cx+5, cy);
    ctx.moveTo(cx, cy-5); ctx.lineTo(cx, cy+5);
    ctx.stroke();
  }
  // 45–70: no mark (color only = OK band)
  ctx.restore();
}

// ------------------------------------- tutorial (per campaign level, event-driven)
function setTut(step){
  state.tutStep = step;
  const el = document.getElementById('tut');
  const T = LV().tut || [];
  // G2 — "I've farmed before" / first-plot clear: skip full coaching wall
  if(camp && camp.tipsShown && camp.tipsShown.skip_coaching && !state.tutDone){
    state.tutDone = true;
    el.classList.remove('show','slim');
    syncOverlay();
    syncTutOpenClass();
    save();
    return;
  }
  if(state.tutDone || step>=T.length){
    el.classList.remove('show','slim');
    state.tutDone = true;
    save();
    syncOverlay();
    syncTutOpenClass();
    return;
  }
  // Skip event-steps whose condition is already satisfied (player acted early)
  while(step < T.length && tutStepAlreadyDone(T[step])){
    step++;
    state.tutStep = step;
  }
  if(step>=T.length){
    el.classList.remove('show','slim');
    state.tutDone = true;
    save();
    syncOverlay();
    syncTutOpenClass();
    return;
  }
  const t = T[step];
  if(t && t.on && tutStepAlreadyDone(t)){
    setTut(step+1);
    return;
  }
  if(t && t.on==='revive' && (typeof countRevived==='function' ? countRevived() : 0)>0){
    setTut(step+1);
    return;
  }
  if(t && t.on==='plant_crop' && (typeof countSistersPlanted==='function' ? countSistersPlanted() : 0)>=3){
    setTut(step+1);
    return;
  }
  const slim = step > 0 || (!state.paused && state.day > 1);
  el.classList.toggle('slim', slim);
  // Slim coach copy when sim is already running on a "wait for revive" step
  let html = t.html;
  if(slim && t.on==='revive' && !state.paused){
    html = '▶️ Days are running — watch dead tiles for <b>🌅 REVIVED!</b> Then plant 🌽 <b>3 Sisters</b> on brown soil.';
  }else if(slim && t.on==='feed_dead'){
    html = '🪣 Keep painting <b>Compost</b> on gray tiles.';
  }
  el.innerHTML = `<span class="skip" id="tutSkip">skip</span>${html}`
    + (t.btn && !slim ? `<button class="tnext" id="tutNext">${t.btn}</button>` : '')
    + (slim && t.on ? `<button class="tnext" id="tutNext">Got it</button>` : '');
  el.classList.add('show');
  syncOverlay();
  syncTutOpenClass();
  if(t && t.on==='feed_dead'){
    pickCampaignTool('compost');
    markCoach('compost');
  }else if(t && t.on==='revive'){
    markCoach('pause');
  }else if(t && t.on==='plant_crop'){
    pickCampaignTool('sisters');
    markCoach('sisters');
  }else{
    clearCoachMarks();
  }
  document.getElementById('tutSkip').onclick = ()=>{
    state.tutDone = true;
    el.classList.remove('show','slim');
    syncOverlay();
    syncTutOpenClass();
    save();
  };
  const nx = document.getElementById('tutNext');
  if(nx) nx.onclick = ()=>setTut(step+1);
  save();
}
// True when an {on:...} step no longer needs to wait (player already did it)
function tutStepAlreadyDone(step){
  if(!step || !step.on || !state) return false;
  const st = state.stats || {};
  const rev = typeof countRevived==='function' ? countRevived() : (st.revived|0);
  const sis = typeof countSistersPlanted==='function' ? countSistersPlanted() : (st.sistersPlanted|0);
  switch(step.on){
    case 'feed_dead': return (st.coverPlanted|0)>0 || (st.composts|0)>0 || rev>0;
    case 'revive': return rev>0;
    case 'plant_crop': return sis>=1 || sis>=3 || ((st.planted|0)>0 && rev>0);
    case 'graze_cattle': return (st.cattle|0)>0;
    case 'graze_goat': return (st.grazes|0)>0;
    case 'synergy': return (st.synergy|0)>0;
    case 'buffer': return (st.buffers|0)>0;
    default: return false;
  }
}

  if(!state || homesteadMode || state.levelDone || state.paused) return false;
  const L = typeof LV==='function' ? LV() : null;
  if(!L || L.id!=='field') return false;
  if(state._fieldHealthMercy) return false;

  const syn = state.stats.synergy|0;
  const cover = state.stats.coverPlanted|0;
  if(rev < 6 || syn < 2 || cover < 4) return false;
  const have = typeof countHealthyTiles==='function' ? countHealthyTiles(55) : 0;
  if(have >= 8) return false;

  if(!almost.length) return false;
  almost.sort((a,b)=>(b.health||0)-(a.health||0));
  SOIL_ATTRS.forEach(k=>{ almost[0].soil[k] = Math.max(almost[0].soil[k]||0, 56); });
  if(typeof recalc==='function') recalc(almost[0]);

  if(!state || state.tutDone || homesteadMode) return;
  const T = LV().tut || [];
  if(!T.length) return;
  let step = state.tutStep|0;
  let moved = false;
  // Skip completed event-steps
  while(step < T.length && tutStepAlreadyDone(T[step])){ step++; moved = true; }
  // Skip button-only intros once the world is moving
  const simGoing = !state.paused || state.day>1 || state.speed>1;
  while(simGoing && step < T.length && T[step] && !T[step].on){ step++; moved = true; }
  if(moved){ setTut(step); return; }
  const cur = T[step];
  const el = document.getElementById('tut');
  if(cur && cur.on && tutStepAlreadyDone(cur)){
    setTut(step+1);
    return;
  }
  // Refresh slim coach if still waiting on revive while unpaused
  if(cur && cur.on==='revive' && el && el.classList.contains('show') && !state.paused){
    if((typeof countRevived==='function' ? countRevived() : 0)>0){ setTut(step+1); return; }
    setTut(step); // re-render slim variant
  }
}
// steps that wait for a real action ({on:'revive'} etc.) advance through here
function tutEvent(name){
  if(!state || state.tutDone) return;
  const T = LV().tut || [];
  // Player acted without dismissing intro buttons — skip button-only steps first (RW-001)
  let step = state.tutStep|0;
  let skipped = false;
  while(step < T.length && T[step] && !T[step].on){
    step++;
    skipped = true;
  }
  if(skipped) setTut(step);
  const cur = T[state.tutStep];
  if(cur && cur.on===name) setTut(state.tutStep+1);
  else if(cur && cur.on && tutStepAlreadyDone(cur)) setTut(state.tutStep+1);
  else if(typeof tutSyncSim==='function') tutSyncSim();
}

// ---------------------------------------------------------------- save/load
// v8 bundle: { v:8, camp:{…, bank, homestead}, state:<plot or omitted when only camp> }
// v6/v7 camp fields migrate; missing homestead is created empty.
function save(){
  let ok = false;
  let err = null;
  try{
    if(homesteadMode) serializeHomesteadFromState();
    if(typeof rememberLaneClock==='function') rememberLaneClock();
    camp.sound = soundOn;
    if(state && !state.homesteadView) state.sound = soundOn;
    // Never persist homestead view as the active plot
    const plotToSave = homesteadMode ? plotStateBackup : (state && state.homesteadView ? null : state);
    const payload = {v:8, camp:camp};
    if(plotToSave) payload.state = plotToSave;
    localStorage.setItem(SAVE_KEY, JSON.stringify(payload));
    ok = true;
  }catch(e){ err = e; }
  if(ok){
    hideStorageBanner();
    pulseSaved();
  }else{
    // AX2 — offline / quota / private-mode write failure (don't fake "Saved")
    const quota = err && (err.name==='QuotaExceededError' || err.code===22 || err.code===1014);
    showStorageBanner(quota
      ? '⚠️ Storage full — progress may not save. Export a save from About.'
      : '⚠️ Can\'t save offline right now — progress may not stick. Try Export in About.');
  }
}
/** B4 — quiet "Saved" trust pulse (throttled so autosave doesn't flash constantly).
 *  Throttle lives on window so CDP/tests can reset it. */
function pulseSaved(force){
  try{
    const now = performance.now();
    const last = (window.__rwSavedPulseT)|0;
    if(!force && last && (now - last < 4000)) return;
    window.__rwSavedPulseT = now;
    let el = document.getElementById('savedPulse');
    if(!el){
      el = document.createElement('div');
      el.id = 'savedPulse';
      el.setAttribute('aria-live', 'polite');
      document.body.appendChild(el);
    }
    el.textContent = 'Saved';
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(()=>{ if(el) el.classList.remove('show'); }, 1200);
  }catch(e){}
}
/** AX2/AZ — soft banner when localStorage write fails (dismissible). */
function showStorageBanner(msg){
  try{
    let el = document.getElementById('offlineBanner');
    if(!el){
      el = document.createElement('div');
      el.id = 'offlineBanner';
      el.setAttribute('role', 'status');
      el.setAttribute('aria-live', 'assertive');
      document.body.appendChild(el);
    }
    const text = msg || '⚠️ Can\'t save right now.';
    el.innerHTML = `<span class="ob-msg"></span><button type="button" class="ob-x" aria-label="Dismiss">×</button>`;
    const msgEl = el.querySelector('.ob-msg');
    if(msgEl) msgEl.textContent = text;
    const x = el.querySelector('.ob-x');
    if(x) x.onclick = (ev)=>{ ev.preventDefault(); hideStorageBanner(); };
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(()=>{ if(el) el.classList.remove('show'); }, 8000);
  }catch(e){}
}
function hideStorageBanner(){
  try{
    const el = document.getElementById('offlineBanner');
    if(el){
      el.classList.remove('show');
      clearTimeout(el._t);
    }
  }catch(e){}
}
function loadBundle(){

function loadCamp(d){
  camp = defaultCamp();
  if(!d || !d.camp || typeof d.camp!=='object') return;
  const c = d.camp;
  // Migrate old 5-level done[]: index 4 was Valley → now index 9
  if(Array.isArray(c.done) && c.done.length===5 && LEVELS.length>5){
    camp.done = LEVELS.map(()=>false);
    camp.stars = LEVELS.map(()=>0);
    for(let i=0;i<4;i++){ camp.done[i]=!!c.done[i]; camp.stars[i]=Math.max(0, Math.min(3, (+(c.stars&&c.stars[i])||0)|0)); }
    if(c.done[4]){ camp.done[9]=true; camp.stars[9]=Math.max(0, Math.min(3, (+(c.stars&&c.stars[4])||0)|0)); }
  } else {
    if(Array.isArray(c.done)) camp.done = LEVELS.map((_,i)=>!!c.done[i]);
    if(Array.isArray(c.stars)) camp.stars = LEVELS.map((_,i)=>Math.max(0, Math.min(3, (+c.stars[i]||0)|0)));
  }
  camp.done.forEach((dn,i)=>{ if(dn && i+1<LEVELS.length) camp.unlocked = Math.max(camp.unlocked, i+1); });
  camp.unlocked = campaignUnlockFloor();
  camp.cur = (typeof c.cur==='number' && !isNaN(c.cur)) ? Math.max(0, Math.min(LEVELS.length-1, c.cur|0)) : 0;
  camp.bank = Math.max(0, (+c.bank||0)|0);
  camp.grantedPacks = (c.grantedPacks && typeof c.grantedPacks==='object') ? Object.assign({}, c.grantedPacks) : {};
  camp.pendingShopCoins = Math.max(0, (+c.pendingShopCoins||0)|0);
  camp.tipsShown = (c.tipsShown && typeof c.tipsShown==='object') ? Object.assign({}, c.tipsShown) : {};
  camp.featureUnlocks = (c.featureUnlocks && typeof c.featureUnlocks==='object') ? Object.assign({}, c.featureUnlocks) : {};
  camp.fieldNotes = (c.fieldNotes && typeof c.fieldNotes==='object') ? Object.assign({}, c.fieldNotes) : {};
  camp.herd = (c.herd && typeof c.herd==='object') ? c.herd : camp.herd;
  camp.herdV = (c.herdV|0);
  ensureHerd(camp);
  if(typeof migrateHerdHeads==='function') migrateHerdHeads();
  camp.crate = [];
  if(Array.isArray(c.crate)){
    camp.crate = c.crate.filter(x=>x && typeof x==='object').map(x=>({
      type: String(x.type||'wheat'),
      em: x.em || '🌾',

      coins: Math.max(1, (+x.coins||0)|0),
      at: Math.max(0, (+x.at||0)|0),
    }));
    let piled = 0;
    while(camp.crate.length > CRATE_HARD){
      camp.crate.shift();
      piled++;
    }
    camp.compostStock = Math.max(0, (+c.compostStock||0)|0) + piled;
  }else{
    camp.compostStock = Math.max(0, (+c.compostStock||0)|0);
  }
  if(c.laneClock && typeof c.laneClock==='object'){
    camp.laneClock = {
      season: ((c.laneClock.season|0)%4+4)%4,
      day: Math.max(1, c.laneClock.day|0),
      year: Math.max(1, c.laneClock.year|0),
    };
  }
  if(c.designGoals && typeof c.designGoals==='object') camp.designGoals = c.designGoals;
  // valley parcels (Pack 0) — merge save then migrate from done/stars
  camp.parcels = {};
  ensureParcelState(camp);
  if(c.parcels && typeof c.parcels==='object'){
    Object.keys(c.parcels).forEach(id=>{
      const src = c.parcels[id];
      if(!src || typeof src!=='object') return;
      if(!camp.parcels[id]) camp.parcels[id] = {cleared:false, restorePct:0, bestStars:0, bought:false};
      camp.parcels[id].cleared = !!src.cleared;
      camp.parcels[id].restorePct = Math.max(0, Math.min(100, (+src.restorePct||0)|0));
      camp.parcels[id].bestStars = Math.max(0, Math.min(3, (+src.bestStars||0)|0));
      camp.parcels[id].bought = !!src.bought || !!camp.parcels[id].bought;
    });
  }
  syncParcelClearFromCamp();
  if(Array.isArray(c.scrapbook)) camp.scrapbook = c.scrapbook.slice(0, 40);
  else camp.scrapbook = [];
  camp.kitsOwned = (c.kitsOwned && typeof c.kitsOwned==='object') ? Object.assign({}, c.kitsOwned) : {};
  // homestead migrate
  const h = c.homestead && typeof c.homestead==='object' ? c.homestead : null;
  camp.homestead = defaultHomestead();
  if(h){
    camp.homestead.unlocked = !!h.unlocked || !!camp.done[0];
    camp.homestead.houseTier = Math.max(0, Math.min(HS_HOUSE.length-1, (+h.houseTier||0)|0));
    camp.homestead.gridSize = [8,10,12].indexOf(+h.gridSize)>=0 ? (+h.gridSize|0) : 8;
    camp.homestead.expansions = Array.isArray(h.expansions) ? h.expansions.filter(x=>typeof x==='string') : [];
    camp.homestead.improvements = Array.isArray(h.improvements)
      ? h.improvements.filter(x=>typeof x==='string' && HS_IMPROVEMENTS.some(I=>I.id===x))
      : [];
    if(Array.isArray(h.tiles) && h.tiles.length===camp.homestead.gridSize*camp.homestead.gridSize){
      camp.homestead.tiles = h.tiles;
    }
    // interior multi-room migrate
    const inn = h.interior && typeof h.interior==='object' ? h.interior : null;
    camp.homestead.interior = defaultInterior();
    if(inn){
      camp.homestead.interior.ownedItems = Array.isArray(inn.ownedItems) ? inn.ownedItems.slice() : ['wp-cream','fl-wood'];
      if(!camp.homestead.interior.ownedItems.includes('wp-cream')) camp.homestead.interior.ownedItems.push('wp-cream');
      if(!camp.homestead.interior.ownedItems.includes('fl-wood')) camp.homestead.interior.ownedItems.push('fl-wood');
      camp.homestead.interior.currentRoom = (inn.currentRoom && typeof inn.currentRoom==='string') ? inn.currentRoom : 'living';
      if(inn.rooms && typeof inn.rooms==='object'){
        COT_ROOMS.forEach(R=>{
          const src = inn.rooms[R.id];
          if(!src) return;
          const dest = camp.homestead.interior.rooms[R.id] || emptyRoomState(R.id);
          dest.wallpaper = src.wallpaper || R.defaultWp;
          dest.flooring = src.flooring || R.defaultFl;
          dest.placedItems = Array.isArray(src.placedItems) ? src.placedItems.filter(p=>p && p.id && typeof p.x==='number') : [];
          camp.homestead.interior.rooms[R.id] = dest;
        });
      } else {
        // legacy flat interior → living room
        camp.homestead.interior.rooms.living = {
          wallpaper: inn.wallpaper || 'wp-cream',
          flooring: inn.flooring || 'fl-wood',
          placedItems: Array.isArray(inn.placedItems) ? inn.placedItems.filter(p=>p && p.id && typeof p.x==='number') : [],
        };
      }
    }
    ensureInterior();
  }else if(camp.done[0]){
    camp.homestead.unlocked = true;
  }
  if(camp.homestead.unlocked) ensureHomesteadTiles();
  if(!camp.homestead.interior) camp.homestead.interior = defaultInterior();
}
function loadLevelState(d){
  try{
    if(!d || !d.state || typeof d.state!=='object') return false;
    const st = d.state;
    if(st.homesteadView) return false; // never resume a homestead snapshot as a campaign plot
    const lv = (typeof st.lv==='number' && st.lv>=0 && st.lv<LEVELS.length) ? st.lv|0 : -1;
    if(lv<0) return false;
    const resumeP = typeof valleyParcelByLvIndex==='function' ? valleyParcelByLvIndex(lv) : null;
    if(resumeP){
      if(typeof parcelIsUnlocked==='function' && !parcelIsUnlocked(resumeP, camp)) return false;
    }else if(lv>camp.unlocked) return false;
    if(!Array.isArray(st.grid) || st.grid.length!==LEVELS[lv].grid*LEVELS[lv].grid) return false;
    const fresh = newGame(lv);              // also sets GRID for this level
    state = Object.assign(fresh, st);
    state.v = 6; state.lv = lv; state.gridSize = GRID;
    state.stats = Object.assign({}, DEFAULT_STATS, st.stats||{});
    // defensive: every field added after launch must never crash an older save
    if(typeof state.waterQuality!=='number' || isNaN(state.waterQuality)) state.waterQuality = LEVELS[lv].river?30:55;
    state.waterQuality = clamp(state.waterQuality);
    if(typeof state.tod!=='number' || isNaN(state.tod)) state.tod = 0.3;
    state.tod = ((state.tod%1)+1)%1;
    if(typeof state.regionIdx!=='number' || isNaN(state.regionIdx) || state.regionIdx<0) state.regionIdx = 0;
    state.regionIdx = Math.min(REGIONS.length, state.regionIdx|0);
    if(!Array.isArray(state.tasks)) state.tasks = [];
    state.tasks = state.tasks.filter(x=>x && taskDef(x.id));
    if(!state.tasksDone || typeof state.tasksDone!=='object') state.tasksDone = {};
    if(!state.unlocks || typeof state.unlocks!=='object') state.unlocks = {};
    ['washRestored','riparianTip','incomeTip','deadTip','deadTip2','levelDone','introSeen','paused','won','tutDone']
      .forEach(k=>{ if(typeof state[k]!=='boolean') state[k] = false; });
    state.tutStep = Math.max(0, Math.min((LEVELS[lv].tut||[]).length, (state.tutStep|0)||0));
    if(typeof state.speed!=='number' || !(state.speed>=1 && state.speed<=3)) state.speed = 1;
    const VALID_TERRAIN = new Set(['soil','dead','water','pond','trees','barn','coop','house','nstand','riverbed'].concat(BUILDINGS));
    state.grid = st.grid.map((sg,i)=>{
      const t = Object.assign(newTile(i%GRID, (i/GRID)|0), sg);
      t.region = regionOf(t.c, t.r);
      if(!VALID_TERRAIN.has(t.terrain)) t.terrain = 'soil';
      if(t.crop && !CROPS[t.crop.type]) t.crop = null;
      if(t.graze && t.graze.kind!=='team' && !GRAZE[t.graze.kind]) t.graze = null;
      if(t.graze) hydrateGraze(t.graze);
      SOIL_ATTRS.forEach(k=>{ if(typeof t.soil[k]!=='number' || isNaN(t.soil[k])) t.soil[k] = 10; });
      recalc(t);
      return t;
    });
    if(typeof sweepWakeDeadTiles==='function') sweepWakeDeadTiles();
    // respawn animals
    agents = [];
    inferHerdFromGrid();
    state.grid.forEach((t,i)=>{
      if(t.terrain==='stable') spawnAnimals(i, 'horse', 1);
      if(t.graze) spawnGrazeAgents(i, t.graze);
    });
    // Prefer camp preference; else explicit true only (false = quiet cold / opt-in)
    if(typeof camp.sound === 'boolean') soundOn = camp.sound;
    else soundOn = state.sound === true;
    camp.cur = lv;
    return true;
  }catch(e){ return false; }
}

// ------------------------------------------- journey (level select) & level flow
function levelHasProgress(){
  if(!state || state.homesteadView || homesteadMode) return false;
  const st = state.stats || {};
  if((state.day|0) > 1 || (state.seasonCount|0) > 0) return true;
  if((st.planted|0)>0 || (st.composts|0)>0 || (st.revived|0)>0 || (st.grazes|0)>0) return true;
  if((st.sistersPlanted|0)>0 || (st.coverPlanted|0)>0 || (st.buildings|0)>0 || (st.synergy|0)>0) return true;
  // Grid evidence: player put something on a tile this visit
  if(state.grid && state.grid.some(t=>t.crop || t.graze || (t.compost|0)>0 || t.revivedOnce)) return true;
  return false;
}
/** Contiguous teaching floor: done[0]→1, done[0..1]→2. Side plots (school=8) never jump this. */
function campaignUnlockFloor(){
  if(!camp || !camp.done) return 0;
  let floor = 0;
  for(let i=0;i<LEVELS.length;i++){
    if(camp.done[i]) floor = i+1;
    else break;
  }
  return Math.min(LEVELS.length-1, floor);
}
function syncUnlockedFromParcels(){
  ensureParcelState(camp);
  camp.unlocked = campaignUnlockFloor();
}
function landPrestigeScore(){
  ensureParcelState(camp);
  let n = 0;
  VALLEY_PARCELS.forEach(P=>{
    if(P.kind!=='plot') return;
    const st = camp.parcels[P.id];
    if(st && st.cleared) n += 20 + (st.bestStars|0)*5;
    else if(st && (st.restorePct|0)>0) n += Math.floor((st.restorePct|0)/10);
  });
  return Math.min(100, n);
}
function homePrestigeScore(){
  const hs = camp.homestead || defaultHomestead();
  let n = (hs.houseTier|0)*12;
  n += (hs.improvements||[]).length * 4;
  n += (hs.expansions||[]).length * 3;
  const inn = hs.interior;
  if(inn && inn.rooms){
    Object.keys(inn.rooms).forEach(rid=>{
      const rm = inn.rooms[rid];
      if(!rm) return;
      n += Math.min(8, (rm.conditionTier|0)*2);
      n += Math.min(10, ((rm.placedItems||[]).length));
      if(rm.wallpaper && rm.wallpaper!=='wp-cream') n += 2;
      if(rm.flooring && rm.flooring!=='fl-wood') n += 2;
    });
  }
  n += Math.min(15, Math.floor((camp.bank|0)/40));
  return Math.min(100, n);
}
/** CB/CD — track Land/Home ★; set flag when they rise (toast via runJourneySoftTips). */
function updatePrestigeBaseline(){
  if(!camp) return false;
  if(!camp.tipsShown) camp.tipsShown = {};
  const land = landPrestigeScore();
  const home = homePrestigeScore();
  const baselined = camp._prestigeBaselined;
  const prevL = camp._seenLandStar|0;
  const prevH = camp._seenHomeStar|0;
  camp._seenLandStar = land;
  camp._seenHomeStar = home;
  if(!baselined){
    camp._prestigeBaselined = true;
    camp._prestigeRose = false;
    return false;
  }
  const rose = (land > prevL || home > prevH);
  if(rose) camp._prestigeRose = true;
  return rose;
}
/** CD — at most one soft Journey tip per map open (reduces tip fatigue). */
function offerJourneySoftTip(onceKey, msg, delayMs){
  if(!camp) return false;
  if(!camp.tipsShown) camp.tipsShown = {};
  if(camp.tipsShown[onceKey]) return false;
  if(camp._jSoftThisOpen) return false;
  camp._jSoftThisOpen = true;
  setTimeout(()=>{
    if(!journeyOpen) return;
    toast(msg, {once:onceKey, throttleMs:4000});
  }, delayMs != null ? delayMs : 500);
  return true;
}
/** CD/CF — priority queue of Journey soft tips; only the first eligible fires this open.
 *  Order: action resume → endgame freeplay → home unlock → map literacy → prestige → story → design. */
function runJourneySoftTips(){
  if(!camp) return;
  if(!camp.tipsShown) camp.tipsShown = {};
  updatePrestigeBaseline();
  const scrapN = (camp.scrapbook && camp.scrapbook.length) || 0;
  // 1) Mid-progress leave (highest — player just left a plot)
  if(state && !state.levelDone && !homesteadMode && typeof levelHasProgress==='function' && levelHasProgress()){
    if(offerJourneySoftTip('journey_leave_mid', '▶ Progress autosaved — tap Continue on the map to resume this plot anytime.', 450)) return;
  }
  // 2) Full clear freeplay
  if(typeof campaignAllPlotsCleared==='function' && campaignAllPlotsCleared()){
    if(offerJourneySoftTip('freeplay_first', '🏆 Valley freeplay — revisit any plot or sandbox Homestead. Share your score anytime.', 550)) return;
  }
  // 3) First home unlock celebrate
  if(camp.homestead && camp.homestead.unlocked && camp.done && camp.done[0] && !camp.tipsShown.journey_after_home){
    if(offerJourneySoftTip('journey_after_home', '🏡 Homestead unlocked — and new map parcels may open. Visit home or keep healing the valley!', 550)){
      setTimeout(()=>{
        if(journeyOpen && camp.tipsShown.journey_after_home && !document.body.classList.contains('reduce-motion') && typeof confetti==='function') confetti(28);
      }, 750);
      return;
    }
  }
  // 3b) Surrounding land deal — after Home Patch, never the first-session lead
  if(typeof homePatchCleared==='function' && homePatchCleared() &&
     VALLEY_PARCELS.some(P=>P.buyable && !parcelIsBought(P) && parcelDeedOffered(P))){
    if(offerJourneySoftTip('land_deed_first', 'A fogged neighbor with a coin price is a land deal — surplus from play or the coin shop. Home Patch stays free.', 600)) return;
  }
  // 4) Map pins before design goals (cold-start map literacy)
  if(!camp.tipsShown.map_pin_hover && !camp.tipsShown.map_pin_story_toast){
    if(offerJourneySoftTip('map_pin_story_toast', '🌾 Tap a field to walk it. Fogged land opens as you heal neighbors.', 550)) return;
  }
  // 5) Prestige rise
  if(camp._prestigeRose && !camp.tipsShown.dual_prestige){
    if(offerJourneySoftTip('dual_prestige', '🌍 Land ★ grows as you restore parcels · 🏡 Home ★ with house, rooms & yard.', 520)){
      camp._prestigeRose = false;
      return;
    }
  }
  // 6) Story pill
  if(scrapN > 0 && !camp.tipsShown.scrapbook_story_pill){
    if(offerJourneySoftTip('scrapbook_story_pill', '📔 Story pill tracks memories — tap it to open your scrapbook.', 600)) return;
  }
  // 7) Design goals last (optional long-term bank goals)
  if(!camp.tipsShown.dg_section_first){
    offerJourneySoftTip('dg_section_first', '🎯 Design goals (below) pay bank coins for rooms, yard & parcels — claim when ready.', 650);
  }
}
function maybeGuestVisit(){
  const home = homePrestigeScore();

  if(camp.tipsShown.guest_neighbor) return;
  if(home >= 55 && !camp.tipsShown.guest_naturalist){

    scrapbookAdd('guest', 'Naturalist visit', 'Home prestige ' + home);

  }
}
function scrapbookAdd(kind, title, note){
  if(!camp.scrapbook) camp.scrapbook = [];
  // Dedupe identical badge titles so checkBadges spam doesn't fill the book

    fillWidthStrip(wx, creekPts, (i,t)=> creekHalf(i,t)+8, 'rgba(62,50,28,0.22)');

      fillWidthStrip(ctx, pts, (i,t)=> (half+1.5)*fade(t), 'rgba(88,64,38,0.72)');
      fillWidthStrip(ctx, pts, (i,t)=> half*0.72*fade(t), 'rgba(112,84,50,0.4)');
      const left = offsetPath(pts, half*0.28);
      const right = offsetPath(pts, -half*0.28);
      fillWidthStrip(ctx, left, (i,t)=> 1.15*fade(t), 'rgba(62,44,24,0.38)');
      fillWidthStrip(ctx, right, (i,t)=> 1.15*fade(t), 'rgba(62,44,24,0.38)');
    }
    dirtLane(ATLAS_GEO.lane, 7.6);
    dirtLane(ATLAS_GEO.paddockSpur, 4.2);

  if(!usedSkin){
    const yard = atlasToView(4.4, 28.5);

    ctx.beginPath(); ctx.ellipse(yard.x+18, yard.y+12, 92, 28, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(86,108,58,0.22)';

    const compost = atlasToView(5.5, 27.5);
    ctx.fillStyle = 'rgba(86,58,28,0.9)';

    const hp = atlasToView(4.35, 28.7);

  }

  const fog = document.createElement('canvas');
  fog.width = V.w; fog.height = V.h;
  const fg = fog.getContext('2d');
  VALLEY_PARCELS.forEach(P=>{
    if(P.kind==='hub') return;
    if(parcelMapState(P, camp)!=='locked') return;
    const q = parcelViewQuad(P);
    if(!q) return;
    fg.fillStyle = '#fff';

    q.slice(1).forEach(p=> fg.lineTo(p.x, p.y));

  // Soft-punch the painted lane so locked-parcel fog does not break the thread.
  fg.globalCompositeOperation = 'destination-out';
  for(let r=0;r<ATLAS_H;r++) for(let c=0;c<ATLAS_W;c++){
    const A = atlasGet(c,r);
    if(!A || A.feature!=='path') continue;
    const p = atlasToView(c+0.5, r+0.5);
    fg.beginPath();
    fg.arc(p.x, p.y, 9, 0, Math.PI*2);

  }
  fg.globalCompositeOperation = 'source-over';
  ctx.save();
  ctx.filter = 'blur(16px)';
  ctx.globalAlpha = 0.2;
  ctx.drawImage(fog, 0, 0);
  ctx.restore();
  return !!(usedSkin || hills);
  } catch (err) {
    console.warn('[Rootweave] valley paint', err);
    return false;
  }
}
/** Overlay herd on the journey map — seated on painted parcels, never drawn into VALLEY_ATLAS_SKIN. */
const HERD_MAP_HOME = {
  cattle: ['back_paddock','west_folds','north_folds'],
  sheep:  ['back_paddock','west_folds','north_folds','hay_field'],
  chicken:['homestead','home_garden'],
  pig:    ['hay_field','orchard_slope','orchard_block'],
  goat:   ['west_folds','back_paddock','dust_flats'],
  duckT:  ['marsh_finger','wet_meadow'],
};
/** Atlas cells on the painted trough / yard / hay so sprites sit on land, not on labels. */
const HERD_MAP_SEATS = {
  cattle: [[14,36],[12,38],[16,34],[10,42],[12,22],[8,44],[18,18]],
  sheep:  [[12,36],[16,38],[10,20],[8,44],[76,22],[74,24]],
  chicken:[[14,55],[10,58],[12,56],[8,57],[11,54]],
  pig:    [[76,22],[74,24],[58,26],[60,14]],
  goat:   [[12,42],[8,44],[16,36],[56,44]],
  duckT:  [[22,6],[8,8],[24,8],[6,6]],
};
const MAP_HERD_W = {cow:24, chicken:13, sheep:22, goat:17, pig:18, duckT:14};
let _mapHerd = {cv:null, agents:[], raf:0, last:0};
function herdMapVisibleN(kind){
  const n = (camp && camp.herd && (camp.herd[kind]|0)) || 0;
  if(n<=0) return 0;
  return Math.max(1, Math.min(3, n));
}
function parcelShowsHerd(P, c){
  if(!P) return false;
  c = c || camp;
  // Homestead / Home Patch are never fogged — still no herd chrome before Home is cleared.
  if(!(c && c.done && c.done[0])) return false;
  return parcelMapState(P, c) !== 'locked';
}
function atlasInParcel(c, r, P){
  const b = parcelAtlasBox(P);
  if(!b) return false;
  return c>=b.c && c<b.c+b.w && r>=b.r && r<b.r+b.h;
}
function lerpViewPt(a, b, t){ return {x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t}; }
function parcelSeat(P, u, v){
  const q = parcelViewQuad(P);
  if(!q) return parcelViewCenter(P);
  return lerpViewPt(lerpViewPt(q[0], q[1], u), lerpViewPt(q[3], q[2], u), v);
}
function mapHerdHash(s){
  let h = 2166136261;
  s = String(s);
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h>>>0)/4294967296;
}
function mapHerdHomes(kind){
  return (HERD_MAP_HOME[kind]||[]).map(id=>valleyParcel(id)).filter(P=>parcelShowsHerd(P));
}
function buildMapHerdAgents(){
  if(!camp) return [];
  if(typeof ensureHerd==='function') ensureHerd(camp);
  const agents = [];
  Object.keys(HERD_MAP_HOME).forEach(kind=>{
    const n = herdMapVisibleN(kind);
    if(!n) return;
    const homes = mapHerdHomes(kind);
    if(!homes.length) return;
    const ak = (typeof GRAZE_TOOLS!=='undefined' && GRAZE_TOOLS[kind]) || kind;
    const seats = HERD_MAP_SEATS[kind] || [];
    const used = [];
    for(let i=0;i<n;i++){
      const P = homes[i % homes.length];
      let u, v;
      let pref = null, prefSi = -1;
      for(let si=0;si<seats.length;si++){
        if(used.indexOf(si)>=0) continue;
        if(!atlasInParcel(seats[si][0], seats[si][1], P)) continue;
        pref = seats[si]; prefSi = si; break;
      }
      if(pref){
        used.push(prefSi);
        const b = parcelAtlasBox(P);
        u = (pref[0] + 0.5 - b.c) / b.w;
        v = (pref[1] + 0.5 - b.r) / b.h;
      }else{
        const h = mapHerdHash(kind+P.id+i);
        u = 0.28 + ((i*0.23 + h*0.31) % 0.46);
        v = 0.40 + ((i*0.19 + h*0.37) % 0.36);
      }
      u = clampUV(u, 0.18, 0.82);
      v = clampUV(v, 0.22, 0.82);
      const jitter = mapHerdHash(kind+'j'+i+P.id);
      agents.push({
        herdKind: kind,
        kind: ak,
        parcelId: P.id,
        u, v, tu:u, tv:v,
        facing: jitter<0.5 ? 1 : -1,
        walkPhase: jitter,
        moving: false,
        idleT: jitter*1.4,
        grazeT: 0,
        peckT: 0,
        phase: jitter*6.28,
        speed: 0.011 + jitter*0.007,
      });
    }
  });
  return agents;
}
function mapHerdPoint(ag){
  const P = valleyParcel(ag.parcelId);
  return parcelSeat(P, ag.u, ag.v);
}
function drawMapHerdAt(hctx, ag, p, time){
  const frameKey = (typeof agentFrameKey==='function') ? agentFrameKey(ag) : ag.kind;
  const img = (typeof SPRITES!=='undefined' && (SPRITES[frameKey] || SPRITES[ag.kind])) || null;
  if(!img || !img.naturalWidth) return;
  const w = MAP_HERD_W[ag.kind] || 16;
  const h = w * img.height / img.width;
  const face = ag.facing>=0 ? 1 : -1;
  const bob = (!ag.moving && !prefersQuietMotion()) ? Math.sin(time*0.7 + (ag.phase||0))*0.45 : 0;
  hctx.save();
  hctx.fillStyle = 'rgba(22,14,8,.30)';
  hctx.beginPath();
  hctx.ellipse(p.x, p.y+0.7, w*0.36, Math.max(2.2, w*0.12), 0, 0, 6.29);
  hctx.fill();
  hctx.translate(p.x, p.y);
  hctx.scale(face, 1);
  hctx.drawImage(img, -w/2, -h + bob, w, h);
  hctx.restore();
}
function mapPilePoint(){
  if(typeof leftoverCompostStock!=='function' || leftoverCompostStock()<=0) return null;
  if(typeof homePatchCleared==='function' && !homePatchCleared()) return null;
  const P = (typeof valleyParcel==='function') ? valleyParcel('homestead') : null;
  if(!P) return null;
  const b = (typeof parcelAtlasBox==='function') ? parcelAtlasBox(P) : null;
  if(!b) return null;
  // Atlas compost yard (8,55) sits by the barn (14,55) next to the garden — overlay only.
  const u = clampUV((8 + 0.55 - b.c) / b.w, 0.18, 0.82);
  const v = clampUV((55 + 0.45 - b.r) / b.h, 0.22, 0.82);
  return parcelSeat(P, u, v);
}
function drawMapPileMark(hctx){
  const p = mapPilePoint();
  if(!p || !hctx) return;
  const tier = leftoverPileTier();
  const s = 3.2 + tier * 1.1;

  hctx.fillStyle = '#8a6a40';

}
function mapPileOverlayOn(){

/** Atlas cell for the map stand: house (10,56), lane-side path if the homestead box holds it. */
function mapStandAtlasCell(){
  if(!mapStandOverlayOn()) return null;
  const P = (typeof valleyParcel==='function') ? valleyParcel('homestead') : null;
  if(!P) return null;
  const b = (typeof parcelAtlasBox==='function') ? parcelAtlasBox(P) : null;
  if(!b) return null;
  const inBox = (c,r)=> c>=b.c && c<b.c+b.w && r>=b.r && r<b.r+b.h;

  const prefs = [[11,56],[12,56],[11,55],[10,57],[12,55],[9,56],[11,57]];
  for(let i=0;i<prefs.length;i++){
    const c = prefs[i][0], r = prefs[i][1];
    if(!inBox(c,r)) continue;
    const A = typeof atlasGet==='function' ? atlasGet(c,r) : null;
    if(A && A.landmark==='house') continue;
    if(A && A.feature==='path') return {c, r};
  }
  for(let i=0;i<prefs.length;i++){
    const c = prefs[i][0], r = prefs[i][1];
    if(inBox(c,r)) return {c, r};
  }
  return null;
}
function mapStandPoint(){

  const P = (typeof valleyParcel==='function') ? valleyParcel('homestead') : null;
  const b = (typeof parcelAtlasBox==='function') ? parcelAtlasBox(P) : null;
  if(!P || !b) return null;
  const u = clampUV((cell.c + 0.55 - b.c) / b.w, 0.18, 0.82);
  const v = clampUV((cell.r + 0.45 - b.r) / b.h, 0.22, 0.82);

}

function mapHerdAtlasCell(ag, u, v){
  const P = typeof valleyParcel==='function' ? valleyParcel(ag && ag.parcelId) : null;
  const b = typeof parcelAtlasBox==='function' ? parcelAtlasBox(P) : null;
  if(!b) return null;
  const uu = u==null ? ag.u : u, vv = v==null ? ag.v : v;
  return {c: b.c + uu*b.w, r: b.r + vv*b.h};
}
function mapHerdCellBlocked(ag, u, v){
  const p = mapHerdAtlasCell(ag, u, v);
  if(!p) return false;
  return atlasIsHedgeWood(atlasGet(p.c|0, p.r|0));
}
function mapHerdOnPath(ag, u, v){
  const p = mapHerdAtlasCell(ag, u, v);
  if(!p) return false;
  const A = atlasGet(p.c|0, p.r|0);
  return !!(A && A.feature==='path');
}
/** Nearby atlas path seat in this parcel — walk the lane, not through beds. */
function mapHerdLaneTarget(ag){
  const P = typeof valleyParcel==='function' ? valleyParcel(ag && ag.parcelId) : null;
  const b = typeof parcelAtlasBox==='function' ? parcelAtlasBox(P) : null;
  if(!b || !ag) return null;
  const here = mapHerdAtlasCell(ag);
  let best = null, bestD = 1e9;
  for(let r=b.r;r<b.r+b.h;r++) for(let c=b.c;c<b.c+b.w;c++){
    const A = atlasGet(c, r);
    if(!A || A.feature!=='path') continue;
    const u = clampUV((c+0.5-b.c)/b.w, 0.18, 0.82);
    const v = clampUV((r+0.5-b.r)/b.h, 0.22, 0.82);
    if(mapHerdCellBlocked(ag, u, v)) continue;
    const d = here ? Math.hypot((c+0.5)-here.c, (r+0.5)-here.r) : 0;
    if(d<0.35) continue;
    if(d<bestD){ bestD = d; best = {u, v}; }
  }
  return best;
}
function tickMapHerdAgents(agents, dt){
  if(!agents || !agents.length || prefersQuietMotion()) return;
  agents.forEach(a=>{
    const du = a.tu - a.u, dv = a.tv - a.v;
    const d = Math.hypot(du, dv);
    if(d < 0.012){
      a.moving = false;
      a.idleT = (a.idleT||0) + dt;
      if(a.idleT > 1.8 + ((a.phase||0)%1)*2.2){
        const lane = (typeof mapHerdLaneTarget==='function' && Math.random()<0.68) ? mapHerdLaneTarget(a) : null;
        if(lane && !mapHerdCellBlocked(a, lane.u, lane.v)){
          a.tu = lane.u; a.tv = lane.v; a.idleT = 0;
        }else{
          const ang = (a.phase||0) + a.idleT;
          const rad = 0.05 + (a.walkPhase||0)*0.04;
          const tu = clampUV(a.u + Math.cos(ang)*rad, 0.18, 0.82);
          const tv = clampUV(a.v + Math.sin(ang)*rad*0.65, 0.22, 0.82);
          if(mapHerdCellBlocked(a, tu, tv)){
            a.idleT = 0;
          }else{
            a.tu = tu; a.tv = tv; a.idleT = 0;
          }
        }
      }
    }else{
      if(mapHerdCellBlocked(a, a.tu, a.tv)){
        a.tu = a.u; a.tv = a.v; a.moving = false; return;
      }
      a.moving = true;
      if(Math.abs(du) > 0.002) a.facing = du>=0 ? 1 : -1;
      let step = (a.speed||0.012) * dt;
      if(mapHerdCellBlocked(a, a.u, a.v)) step *= 0.35;
      else if(typeof mapHerdOnPath==='function' && mapHerdOnPath(a, a.u, a.v)) step *= 1.35;
      a.u += (du/d)*step;
      a.v += (dv/d)*step;
      const mot = (typeof AGENT_MOTION!=='undefined' && AGENT_MOTION[a.kind]) || {walkHz:0.7};
      a.walkPhase = ((a.walkPhase||0) + dt * mot.walkHz * 0.5) % 1;
    }
  });
}
function stopMapHerd(){
  if(_mapHerd.raf){ cancelAnimationFrame(_mapHerd.raf); _mapHerd.raf = 0; }
  _mapHerd.cv = null;
  _mapHerd.agents = [];
  _mapHerd.last = 0;
}
function startMapHerd(cv, agents){
  stopMapHerd();
  const pileOn = typeof mapPileOverlayOn==='function' ? mapPileOverlayOn() : false;
  const standOn = typeof mapStandOverlayOn==='function' ? mapStandOverlayOn() : false;
  if(!cv || ((!agents || !agents.length) && !pileOn && !standOn)) return;
  _mapHerd.cv = cv;
  _mapHerd.agents = agents || [];
  _mapHerd.last = 0;
  paintMapHerd(cv, _mapHerd.agents);
  const loop = (now)=>{
    if(!_mapHerd.cv || !_mapHerd.cv.isConnected){ _mapHerd.raf = 0; return; }
    const dt = _mapHerd.last ? Math.min(0.05, (now-_mapHerd.last)/1000) : 0.016;
    _mapHerd.last = now;
    tickMapHerdAgents(_mapHerd.agents, dt);
    paintMapHerd(_mapHerd.cv, _mapHerd.agents);
    _mapHerd.raf = requestAnimationFrame(loop);
  };
  _mapHerd.raf = requestAnimationFrame(loop);
}

        :`<span style="color:#b8a888;font-size:11px;font-weight:700">🪙${G.reward}</span>`}
    </div>`;
  });
  wrap.innerHTML = html;
  wrap.querySelectorAll('[data-dgclaim]').forEach(btn=>{
    btn.addEventListener('click', ()=>{

      const G = designGoalDefs().find(x=>x.id===id);

      if(!G || dg2.claimed[id] || !G.check()) return;
      dg2.claimed[id] = true;
      camp.bank = (camp.bank|0) + G.reward;
      // BP — first design-goal claim gets a bigger celebration + system literacy
      if(!camp.tipsShown) camp.tipsShown = {};
      if(!camp.tipsShown.dg_first_claim){
        camp.tipsShown.dg_first_claim = true;
        // CE — claim also discovers design-section literacy
        camp.tipsShown.dg_section_first = true;
        toast(`🎯 ${G.name} claimed! Design goals pay bank coins for rooms, goods, and parcels. +🪙${G.reward}`, {once:'dg_first_claim', throttleMs:3500});

        toast(`🎯 ${G.name} — +🪙${G.reward} to the bank!`);
        if(!document.body.classList.contains('reduce-motion') && typeof confetti==='function') confetti(24);
      }
      SND.badge(); save();
      scrapbookAdd('goal', G.name, '+'+G.reward+' coins');
      buildJourney();
    });
  });

}

function journeyPick(lv){
