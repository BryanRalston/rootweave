/** L3 — why a yard piece can't land here (null = ok). Used for red hover ghost. */
function hsPlaceBlocked(i){
  if(!homesteadMode || i < 0) return null;
  if(tool==='select' || tool==='bulldoze') return null;
  const t = state.grid[i];
  if(!t) return 'bad';
  const D = HS_CATALOG.find(x=>x.id===tool);
  if(!D) return null;
  if(t.terrain==='house' || t.terrain==='barn' || t.terrain==='nstand' || t.terrain==='coop') return 'house';
  // free re-orient counts as valid
  if(D.fence && hasFence(t)) return null;
  if(D.deco && t.deco===D.id && yardToolOrientable(D.id)) return null;
  if((camp.bank|0) < D.cost) return 'bank';
  if(D.path){
    if(t.terrain!=='soil' && t.terrain!=='dead') return 'occ';
    if(t.deco || hasFence(t) || t.feature==='path' || (typeof isSwaleT==='function' && isSwaleT(t))) return 'occ';
    return null;
  }
  if(D.fence){
    if(t.terrain!=='soil' && t.terrain!=='dead') return 'occ';
    if(t.deco || t.feature==='path' || (typeof isSwaleT==='function' && isSwaleT(t))) return 'occ';
    return null;
  }
  if(D.terrain || D.deco){
    if(t.terrain!=='soil' && t.terrain!=='dead') return 'occ';
    if(D.deco && t.deco && t.deco!==D.id) return 'occ';
    if(typeof isSwaleT==='function' && isSwaleT(t)) return 'occ';
    if(D.terrain && (t.deco || hasFence(t) || t.feature==='path')) return 'occ';
  }
  return null;
}
function applyHomesteadTool(i){
  const t = state.grid[i];
  if(!t) return false;
  if(tool==='select'){
    selected = i;
    ringAt(i, '#ffe89a'); SND.pop();
    if(t.terrain==='nstand'){
      if(neighborStandUnlocked()) openNeighborStand();
      else { openInfo(); toast('🧺 The neighbor stand opens after Home Patch.'); }
      return true;
    }
    if(typeof isLeftoverPileTile==='function' && isLeftoverPileTile(t) && leftoverCompostStock()>0){
      inspectLeftoverPile();
      return true;
    }
    if(t.terrain==='barn' && leftoverCompostStock()>0){
      inspectLeftoverPile();
      return true;
    }
    openInfo();
    if(t.terrain==='house'){
      toast('🏡 Catalog → Expand kits & Yard Build. Rooms are optional (Peek Inside).');
    }else     if(t.terrain==='barn'){
      toast('🏠 The barn — leftover compost sits in the yard beside it.');
    }else if(t.terrain==='coop'){
      toast('🐔 The coop — hens scratch the grass beside it.');
    }
    return true;
  }
  if(tool==='bulldoze'){
    if(t.terrain==='nstand'){ toast('Leave the neighbor stand — it\'s the table by the house.'); return false; }
    if(t.terrain==='house' || t.terrain==='barn' || t.terrain==='coop'){ toast('That\'s your home! Upgrade it from 🛒 catalog.'); return false; }
    // free clear in homestead
    if(t.terrain!=='soil' || t.deco || hasFence(t)){
      t.terrain = 'soil'; t.deco = null; t.feature = null; t.fence = false; t.decoRot = 0; t.crop = null;
      SOIL_ATTRS.forEach(k=>t.soil[k]=Math.max(t.soil[k], 60));
      recalc(t);
      floater(i, '🚜 cleared', '#e8dcc0'); SND.place();
      serializeHomesteadFromState(); save(); updateHUD();
      return true;
    }
    return false;
  }
  const D = HS_CATALOG.find(x=>x.id===tool);
  if(!D){ toast('Open 🛒 Catalog → Yard Build to pick a piece.'); return false; }
  if(!hsItemUnlocked(D)){ toast('🔒 Unlock that kit under Catalog → Expand.'); SND.uhoh(); return false; }
  if(t.terrain==='house' || t.terrain==='barn' || t.terrain==='nstand' || t.terrain==='coop'){ toast('Leave the house footprint — build the yard around it.'); return false; }
  // Free re-orient before bank check
  if(D.fence && hasFence(t)){
    t.fence = fenceFacing(t) === 0 ? 2 : 1;
    floater(i, '↻ fence '+yardOrientLabel(fenceFacing(t)), '#e8dcc0');
    SND.pop(); serializeHomesteadFromState(); save(); updateHUD();
    return true;
  }
  if(D.deco && t.deco===D.id && yardToolOrientable(D.id)){
    t.decoRot = (decoFacing(t) + 1) & 1;
    floater(i, '↻ '+D.name+' '+yardOrientLabel(t.decoRot), '#ffd9e8');
    SND.pop(); serializeHomesteadFromState(); save(); updateHUD();
    return true;
  }
  if((camp.bank|0) < D.cost){ toast(`Bank needs 🪙${D.cost}.`); SND.uhoh(); return false; }
  // I2 — clear occupancy rules before spend
  if(D.path){
    if(t.terrain!=='soil' && t.terrain!=='dead'){ toast('Path needs open grass — clear that tile first (🚜).'); SND.uhoh(); ringAt(i,'#e06666'); return false; }
    if(t.deco || hasFence(t) || (t.feature==='path')){
      if(t.feature==='path'){ toast('Already a path — paint empty grass.'); SND.uhoh(); return false; }
      toast('Tile occupied by '+tileBlockerName(t)+' — 🚜 Clear, then place path.'); SND.uhoh(); ringAt(i,'#e06666'); return false;
    }
  }else if(D.terrain || D.deco){
    if(t.terrain!=='soil' && t.terrain!=='dead'){ toastNeedClear(t); SND.uhoh(); ringAt(i,'#e06666'); return false; }
    if(D.deco && t.deco && t.deco!==D.id){ toast(tileBlockerName(t)+' is here — 🚜 Clear first.'); SND.uhoh(); ringAt(i,'#e06666'); return false; }
    if(D.terrain && (t.deco || hasFence(t) || t.feature==='path')){
      toast('Clear '+tileBlockerName(t)+' first (🚜), then place '+D.name+'.'); SND.uhoh(); ringAt(i,'#e06666'); return false;
    }
  }
  if(D.fence){
    camp.bank -= D.cost;
    t.fence = (yardPlaceRot & 1) + 1; // 1 or 2
    floater(i, D.em+' fence '+yardOrientLabel(fenceFacing(t)), '#e8dcc0'); SND.place();
    hsPlaceQuietToast(D.em+' fence');
  }else if(D.path){
    camp.bank -= D.cost;
    t.feature = 'path'; t.deco = null; t.crop = null;
    floater(i, '🪨 path!', '#d8c8a0'); SND.place();
    hsPlaceQuietToast('🪨 path');
  }else if(D.terrain){
    camp.bank -= D.cost;
    t.terrain = D.id; t.deco = null; t.feature = null; t.crop = null;
    floater(i, D.em+' placed!', '#c8f0a0'); SND.place();
    hsPlaceQuietToast(D.em+' '+D.name);
  }else if(D.deco){
    camp.bank -= D.cost;
    t.deco = D.id; t.crop = null;
    if(yardToolOrientable(D.id)) t.decoRot = yardPlaceRot & 1;
    else t.decoRot = 0;
    // Floater always; toast only first place this homestead visit (A2)
    floater(i, D.em+(yardToolOrientable(D.id)?' '+yardOrientLabel(t.decoRot):''), '#ffd9e8');
    SND.place();
    hsPlaceQuietToast(D.em+' '+D.name);
  }else return false;
  state.coins = camp.bank; // keep HUD in sync while viewing
  serializeHomesteadFromState();
  save(); updateHUD();
  return true;
}

function cotItem(id){ return COT_ITEMS.find(x=>x.id===id); }
function cotRoomDef(id){ return COT_ROOMS.find(r=>r.id===id) || COT_ROOMS[0]; }
/** Placement scale class multiplier (XL/L/M/S/XS/WALL via item.fit). */
function cotItemFitMul(item){
  if(!item) return 1;
  if(item.kind==='wall') return (typeof item.fit==='number' ? item.fit : 0.72);
  const f = item.fit;
  if(typeof f==='number') return f;
  return 1;
}
function cotIsTall(item){
  if(!item) return false;
  if(item.tall) return true;
  return /clock|wardrobe|floormirror|floorlamp|piano|shelf|fern|plantstand|firetools/i.test(item.id||'');
}
/** Room-relative size with depth perspective (lower on screen = larger).
 *  Returns primary dimension: height for tall floor pieces, width for wall art / wide goods. */
function cotPlaceSize(item, p, roomW){
  const roomH = Math.max(280, Math.round((roomW || 900) * 0.55));
  const depth = 0.52 + 0.55 * Math.max(0.05, Math.min(0.95, (p && p.y) || 0.7));
  const mul = cotItemFitMul(item);
  if(item && item.kind==='wall'){
    // Wall hangings — modest; horseshoe small, quilt larger
    return Math.round(Math.max(48, Math.min(160, roomW * 0.1 * mul)));
  }
  if(item && cotIsTall(item)){
    // Tall floor pieces scale by HEIGHT so grandfather clocks fill ~45–55% of room height
    let h = Math.round(roomH * 0.48 * mul * depth);
    if(item.id==='cot-clock') h = Math.round(roomH * 0.58 * depth);
    if(item.id==='cot-floormirror') h = Math.round(roomH * 0.52 * depth);
    if(item.id==='cot-floorlamp') h = Math.round(roomH * 0.48 * depth);
    return Math.max(90, Math.min(320, h));
  }
  // General floor goods — width-ish box size
  const base = Math.max(64, Math.min(200, roomW * 0.13));
  let sz = Math.round(base * depth * mul);
  if(item && item.id==='cot-rug') sz = Math.round(sz * 1.2);
  return Math.max(36, Math.min(240, sz));
}
/** Soft zone check for placement ghost validity. */
function cotPlacementValid(item, fracY){
  if(!item) return false;
  const y = fracY;
  if(item.kind==='wall') return y >= 0.14 && y <= 0.48;
  // AR — usable floor is the lower photo-board band (feet grounded)
  return y >= 0.72 && y <= 0.97;
}
/** Clamp saved/placed floor coords so feet sit on photo floorboards (not mid-air). */
function cotClampFloorY(item, y){
  let yy = y;
  if(!item || item.kind==='wall') return Math.max(0.14, Math.min(0.48, yy));
  // Clicks on wall band for floor items → seat deep on boards (not float mid-frame)
  if(yy < 0.66) yy = 0.88;
  const isTabletop = item.surface==='tabletop' || item.fit < 0.55 || /pie|bread|candle|kettle|pot|typewriter/i.test(item.id||'');
  if(item.id==='cot-rug' || item.kind==='rug') return Math.max(0.78, Math.min(0.95, yy));
  if(isTabletop) return Math.max(0.76, Math.min(0.92, yy));
  // AR freestanding: feet further into foreground boards (higher y = lower on screen)
  return Math.max(0.82, Math.min(0.97, yy));
}
/** Owned stock (purchases). Styles use ownedItems only. */
function cottageOwnedStock(id){
  const inn = ensureInterior();
  const item = cotItem(id);
  if(!item) return 0;
  if(item.kind==='wallpaper' || item.kind==='flooring') return isCottageOwned(id) ? 1 : 0;
  if(inn.ownedCounts && (inn.ownedCounts[id]|0) > 0) return inn.ownedCounts[id]|0;
  if(inn.owned && (inn.owned[id]|0) > 0) return inn.owned[id]|0;

  const inn = camp.homestead.interior;
  if(!inn.rooms || typeof inn.rooms!=='object') inn.rooms = {};

  if(!inn.rooms.living && (Array.isArray(inn.placedItems) || inn.wallpaper || inn.flooring)){
    inn.rooms.living = {

      flooring: inn.flooring || 'fl-wood',

  }
  COT_ROOMS.forEach(R=>{
    if(!inn.rooms[R.id]) inn.rooms[R.id] = emptyRoomState(R.id);
    const rm = inn.rooms[R.id];
    if(!rm.wallpaper) rm.wallpaper = R.defaultWp;
    if(!rm.flooring) rm.flooring = R.defaultFl;
    if(!Array.isArray(rm.placedItems)) rm.placedItems = [];
    if(typeof rm.conditionTier!=='number') rm.conditionTier = 0;

  if(!inn.owned || typeof inn.owned!=='object' || Array.isArray(inn.owned)) inn.owned = {};

  if(!inn.ownedItems.includes('wp-cream')) inn.ownedItems.push('wp-cream');
  if(!inn.ownedItems.includes('fl-wood')) inn.ownedItems.push('fl-wood');
  const wpMap = { 'wp-sky':'wp-linen', 'wp-sunset':'wp-wheat', 'wp-night':'wp-barn' };

function renderCottageRoom(){

  const tintOnly = cotWallpaperFilter(rm.wallpaper);
  const emergencyFilter = cotConditionFilter(tier, rm.wallpaper);
  const fall = {tier, triedBase:false};
  const basePlate = COT_ROOM_PLATES[roomId] || COT_ROOM_PLATES[inn.currentRoom];
  const showSvg = ()=>{
    host.innerHTML = buildCottageRoomSVG(rm.wallpaper, rm.flooring, R.style);

    if(svgEl){
      svgEl.classList.add('cot-svg');

    }
  };

      // Step down finish ladder → BASE plate → SVG
      if(fall.tier > 0){
        fall.tier--;
        mountPlate(roomFinishPlateUrl(roomId, fall.tier), true);
        return;
      }
      if(!fall.triedBase && basePlate){
        fall.triedBase = true;
        mountPlate(basePlate, false);

      }

function renderCottageItems(){
  const layer = document.getElementById('cotItems');
  const room = document.getElementById('cotRoom');
  if(!layer || !room) return;
  layer.innerHTML = '';
  const rect = room.getBoundingClientRect();
  const W = rect.width || 900, H = rect.height || 500;
  const rm = currentRoomState();
  const sorted = (rm.placedItems||[]).slice().sort((a,b)=>(a.z||0)-(b.z||0));
  sorted.forEach((p)=>{
    const item = cotItem(p.id);
    if(!item || (!item.svg && !item.img)) return;
    const origIdx = rm.placedItems.indexOf(p);
    // Catalog is source of truth (e.g. grandfather clock was wrongly saved as wall)
    if(p.kind !== item.kind) p.kind = item.kind;
    const isWall = item.kind==='wall';
    const isRug = item.id==='cot-rug' || item.kind==='rug';
    const size = cotPlaceSize(item, p, W);
    const el = document.createElement('div');
    const popCls = (origIdx === cottageLastPlaceIdx) ? ' pop' : '';
    const rot = (p.rot|0) % 360;
    const rotCls = rot===90?' rot-90':rot===180?' rot-180':rot===270?' rot-270':'';
    el.className = 'cot-item'+(isWall?' wall':'')+(isRug?' rug':'')+popCls+rotCls;
    // Re-seat floor items onto photo floor band (legacy mid-air placements)
    const seatY = isWall ? Math.max(0.14, Math.min(0.48, p.y||0.3)) : cotClampFloorY(item, p.y||0.8);
    if(!isWall && Math.abs(seatY - (p.y||0)) > 0.015){ p.y = seatY; }
    el.style.left = (p.x*W)+'px';
    el.style.top = (seatY*H)+'px';
    // Front objects (higher y) cover back; walls sit above plate, below furniture stack
    // Rugs under furniture (C2 layer)
    el.style.zIndex = isRug ? 8
      : isWall ? (5 + Math.floor((p.y||0.3)*10))
      : (20 + Math.floor((p.y||0)*1000));
    el.dataset.idx = origIdx;
    const selected = cottageEdit && cottageSelectedIdx === origIdx;
    const dragging = cottageEdit && cottageDrag && cottageDrag.idx === origIdx;
    if(selected) el.classList.add('selected');
    if(dragging) el.classList.add('dragging');
    const shadow = (!isWall && !isRug) ? `<div class="ci-shadow"></div>` : '';
    // Rotate/remove only while dragging — selected rest is a quiet gold outline
    el.innerHTML = shadow + `<div class="ci-card">${cotItemArt(item, size)}</div>` +
      ((selected || dragging) ? `<button type="button" class="ci-rm" data-rm="${origIdx}" title="Remove">×</button>
        <button type="button" class="ci-rm" data-rot="${origIdx}" title="Rotate" style="right:auto;left:-6px;background:#4a7a30">↻</button>` : '');
    if(cottageEdit){
      el.addEventListener('pointerdown', (e)=>{
        if(e.target.closest('.ci-rm')) return;
        e.preventDefault(); e.stopPropagation();
        const needChrome = cottageSelectedIdx !== origIdx;
        cottageSelectedIdx = origIdx;
        cottageDrag = {idx:origIdx, ox:e.clientX, oy:e.clientY, px:p.x, py:p.y};
        el.classList.add('dragging');
        if(needChrome){
          renderCottageItems();
        }else{
          try{ el.setPointerCapture(e.pointerId); }catch(_){}
        }
      });
    }
    layer.appendChild(el);
  });
  if(cottageLastPlaceIdx >= 0){
    // pop class is one-shot
    const last = cottageLastPlaceIdx;
    cottageLastPlaceIdx = -1;
    setTimeout(()=>{
      const el = layer.querySelector(`[data-idx="${last}"]`);
      if(el) el.classList.remove('pop');
    }, 140);
  }
}
function isCottageOwned(id){
  const inn = ensureInterior();
  if(inn.ownedItems && inn.ownedItems.includes(id)) return true;
  if(inn.owned && (inn.owned[id]|0) > 0) return true;
  if(inn.ownedCounts && (inn.ownedCounts[id]|0) > 0) return true;
  return false;
}
/** Grant ownership (array + count map). Safe for bulk inject / multi-buy tests. */
function grantCottageOwned(id, n){
  const inn = ensureInterior();
  const add = Math.max(1, n|0);
  if(!inn.ownedItems.includes(id)) inn.ownedItems.push(id);
  if(!inn.ownedCounts) inn.ownedCounts = {};
  inn.ownedCounts[id] = (inn.ownedCounts[id]|0) + add;
  // Keep legacy inject map in sync for any external readers
  if(!inn.owned || typeof inn.owned!=='object') inn.owned = {};
  inn.owned[id] = Math.max(inn.owned[id]|0, inn.ownedCounts[id]);
}
function renderCottageTray(){

    (i.kind==='floor'||i.kind==='wall') && cottageTrayStock(i.id) > 0);
  const placeables = withStock.filter(i=>cotItemFitsRoom(i, roomId));

      : `<div class="cot-tray-item" style="width:auto;padding:8px 14px;opacity:.7">Buy goods in Homestead Goods, then place them here.</div>`;
    return;
  }
  const mk = (i, dim)=>{

function applyCottageStyle(id){
  const item = cotItem(id);
  const inn = ensureInterior();
  const rm = currentRoomState();
  if(!item || !isCottageOwned(id)) return;
  if(item.kind==='wallpaper') rm.wallpaper = id;
  if(item.kind==='flooring') rm.flooring = id;
  syncInteriorLegacy(inn);
  renderCottageRoom(); save(); openCottageShop('style'); SND.pop();
}
function cotSnap(v, steps){
  const s = steps || 12;
  return Math.round(v * s) / s;
}
function placeCottageAt(fracX, fracY){
  if(!cottagePending) return;
  const inn = ensureInterior();
  const rm = currentRoomState();
  const item = cotItem(cottagePending.id);
  if(!item) return;
  // Stock gate: cannot place more copies than bought
  if(cottageTrayStock(item.id) < 1){
    toast('No more in your tray — buy another, or remove one.');
    SND.uhoh();
    cottagePending = null;
    clearCotGhost();
    document.getElementById('cotRoom').classList.remove('cot-placing');
    renderCottageTray();
    return;
  }
  let x = Math.max(0.05, Math.min(0.95, fracX));
  let y = Math.max(0.08, Math.min(0.94, fracY));
  // Floor snap grid
  x = cotSnap(x, 12);
  y = cotSnap(y, 10);
  // Floor goods: reject pure wall-band clicks with a soft snap-to-floor instead of float
  if(item.kind!=='wall' && y < 0.64) y = 0.84;
  y = cotClampFloorY(item, y);
  // Wall items must stay wall-kind from catalog (never re-seat as floor)
  const placeKind = item.kind==='wall' ? 'wall' : 'floor';
  const rot = (cottagePending.rot|0) % 360;
  const z = 1 + rm.placedItems.length;
  rm.placedItems.push({id:item.id, kind:placeKind, x, y, z, rot});
  cottageLastPlaceIdx = rm.placedItems.length - 1;
  cottageSelectedIdx = cottageLastPlaceIdx;
  cottagePending = null;
  clearCotGhost();
  syncInteriorLegacy(inn);
  document.getElementById('cotRoom').classList.remove('cot-placing');
  renderCottageTray(); renderCottageItems(); save(); SND.place();
  // CJ — first furniture place this save gets a toast; later places stay quiet (visual is enough)
  if(camp){
    if(!camp.tipsShown) camp.tipsShown = {};
    if(!camp.tipsShown.cot_place_once){
      camp.tipsShown.cot_place_once = true;
      const nm = (item && item.name) ? String(item.name).trim() : 'Piece';
      if(nm) toast(`${nm} placed!`, {throttleMs:2000});
    }
  }
  maybeCottageBonesCoach();
  maybeGuestVisit();
  scrapbookAdd('place', item.name, 'Placed in ' + (cotRoomDef(inn.currentRoom).name||'room'));
}
function removeCottageItem(idx){
  const inn = ensureInterior();
  const rm = currentRoomState();
  if(idx<0 || idx>=rm.placedItems.length) return;
  const p = rm.placedItems[idx];
  const item = cotItem(p.id);
  // Small bank refund for un-placing (ownership / tray stock returns automatically)
  if(item && item.cost>0){
    camp.bank += Math.floor(item.cost*0.25);
  }
  rm.placedItems.splice(idx,1);
  if(cottageSelectedIdx === idx) cottageSelectedIdx = -1;
  else if(cottageSelectedIdx > idx) cottageSelectedIdx--;
  syncInteriorLegacy(inn);
  document.getElementById('cotBank').textContent = '🪙 '+(camp.bank|0);
  renderCottageTray();
  renderCottageItems(); save(); SND.pop();
}
function rotateCottageItem(idx){
  const rm = currentRoomState();
  if(!rm || !rm.placedItems[idx]) return;
  rm.placedItems[idx].rot = ((rm.placedItems[idx].rot|0) + 90) % 360;
  cottageSelectedIdx = idx;
  syncInteriorLegacy(ensureInterior());
  renderCottageItems(); save(); SND.pop();
}
function undoLastCottagePlace(){
  const rm = currentRoomState();
  if(!rm || !(rm.placedItems||[]).length){ toast('Nothing to undo in this room.'); SND.uhoh(); return; }
  rm.placedItems.pop();
  cottageSelectedIdx = -1;
  cottageLastPlaceIdx = -1;
  syncInteriorLegacy(ensureInterior());
  renderCottageTray();
  renderCottageItems(); save(); SND.pop();
  toast('↩ Last place undone — back in tray.');
}
function maybeCottageBonesCoach(){
  if(!camp.tipsShown) camp.tipsShown = {};
  if(camp.tipsShown.bones_first) return;
  const rm = currentRoomState();
  if(!rm) return;
  const plain = (rm.wallpaper==='wp-cream' || !rm.wallpaper) && (rm.flooring==='fl-wood' || !rm.flooring);
  if(plain && (rm.conditionTier|0)===0 && (rm.placedItems||[]).length>=2){
    camp.tipsShown.bones_first = true;
    toast('🛋️ Make the room sound first — Finish paint/floor, then clutter.');
  }
}
function initCottageUI(){

  document.getElementById('cotEditBtn').addEventListener('click', ()=>{ setCottageEdit(true); SND.pop(); });
  document.getElementById('cotDoneBtn').addEventListener('click', ()=>{ setCottageEdit(false); SND.pop(); });
  document.getElementById('cotShopBtn').addEventListener('click', ()=>{ openCottageShop('furniture'); SND.pop(); });
  const fin = document.getElementById('cotFinishBtn');

  const und = document.getElementById('cotUndoBtn');

  document.getElementById('cotRoomTabs').addEventListener('click', e=>{

  document.getElementById('cotTray').addEventListener('click', e=>{

      toast('None left in tray — buy another.');
      SND.uhoh(); return;
    }
    cottagePending = {id:b.dataset.cotplace, rot:0};
    cottageSelectedIdx = -1;
    document.getElementById('cotRoom').classList.add('cot-placing');
    renderCottageTray();
    renderCottageItems();
    toast('Tap the floor boards to place · click a piece for ↻ / ×.');
    SND.pop();
  });
  document.getElementById('cotItems').addEventListener('click', e=>{
    const rm = e.target.closest('[data-rm]');
    if(rm){ removeCottageItem(+rm.dataset.rm); e.stopPropagation(); }
  });
  const room = document.getElementById('cotRoom');
  room.addEventListener('pointerdown', e=>{
    if(!cottageEdit || !cottagePending) return;
    if(e.target.closest('.cot-item')) return;
    const rect = room.getBoundingClientRect();
    placeCottageAt((e.clientX-rect.left)/rect.width, (e.clientY-rect.top)/rect.height);
  });
  room.addEventListener('pointermove', e=>{
    if(!cottageEdit || !cottagePending || cottageDrag) return;
    updateCotGhost(e.clientX, e.clientY);
  });
  room.addEventListener('pointerleave', ()=>{
    if(cottagePending) clearCotGhost();
  });
  window.addEventListener('pointermove', e=>{
    if(cottageDrag){
      const rm = currentRoomState();
      const p = rm.placedItems[cottageDrag.idx];
      if(!p) return;
      const roomEl = document.getElementById('cotRoom');
      const rect = roomEl.getBoundingClientRect();
      const dx = (e.clientX - cottageDrag.ox) / rect.width;
      const dy = (e.clientY - cottageDrag.oy) / rect.height;
      p.x = Math.max(0.05, Math.min(0.95, cottageDrag.px + dx));
      let ny = Math.max(0.08, Math.min(0.94, cottageDrag.py + dy));
      const it = cotItem(p.id);
      if(it) ny = cotClampFloorY(it, ny);
      p.y = ny;
      renderCottageItems();
      return;
    }
    if(cottageEdit && cottagePending && cottageOpen){
      const roomEl = document.getElementById('cotRoom');
      if(!roomEl) return;
      const rect = roomEl.getBoundingClientRect();
      if(e.clientX>=rect.left && e.clientX<=rect.right && e.clientY>=rect.top && e.clientY<=rect.bottom){
        updateCotGhost(e.clientX, e.clientY);
      }
    }
  });
  window.addEventListener('pointerup', ()=>{
    if(cottageDrag){ cottageDrag = null; save(); if(typeof renderCottageItems==='function') renderCottageItems(); }
  });
}

// ---------------------------------------------------------------- tools
function toolDef(id){ return TOOLS.find(t=>t.id===id); }
// Homestead catalog tools are NOT in TOOLS — pointer path must still place them.
function isYardTool(id){
  if(!homesteadMode) return false;
  if(id==='select' || id==='bulldoze') return true;
  return HS_CATALOG.some(h=>h.id===id);
}
function toolPaints(id){
  if(homesteadMode){
    if(id==='select') return false;
    if(id==='bulldoze') return true;

function spend(cost){
  if(homesteadMode){
    if((camp.bank|0) < cost){ toast(`Not enough banked coins! Need 🪙${cost}.`); SND.uhoh(); return false; }
    camp.bank -= cost;
    state.coins = camp.bank;
    return true;
  }
  if(state.coins < cost){
    toast(typeof neighborStandUnlocked==='function' && neighborStandUnlocked()
      ? `Not enough coins! Need 🪙${cost}. Harvest, then sell at the neighbor stand.`
      : `Not enough coins! Need 🪙${cost}. Harvest crops to earn more.`);
    SND.uhoh(); return false;
  }
  state.coins -= cost;
  return true;
}
const AGENT_SPEED = {cow:0.045, chicken:0.12, sheep:0.05, goat:0.08, pig:0.055, duckT:0.09, horse:0.038};
/** Min UV separation on a tile so livestock don't stack into one blob. */
const AGENT_MIN_SEP = {cow:0.34, chicken:0.16, sheep:0.26, goat:0.26, pig:0.22, duckT:0.16, horse:0.30};
function clampUV(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
/** O2 — hard agent budget so 14×14 valley stays click-responsive. */
const AGENT_CAP = 48;
const WORLD_PART_CAP = 44;
const SCREEN_PART_CAP = 36;
function spawnAnimals(i, kind, n){
  // Slot ring so the first frame is a herd, not a trophy pile. 1 sprite per head.
  const existing = agents.filter(a=>a.tile===i && a.kind===kind);
  const start = existing.length;
  const total = start + n;
  const rad0 = kind==='cow' ? 0.38 : (kind==='sheep'||kind==='goat'||kind==='horse') ? 0.34 : 0.30;
  const rad = total >= 5 ? rad0 * 0.86 : rad0;
  for(let k=0;k<n;k++){
    const slot = start + k;
    const ang = (slot/Math.max(1,total))*6.283185 + slot*0.21;
    const u = clampUV(0.5 + Math.cos(ang)*rad, 0.10, 0.90);
    const v = clampUV(0.5 + Math.sin(ang)*rad*0.82, 0.14, 0.86);
    const tu = clampUV(0.5 + Math.cos(ang)*(rad*0.78), 0.10, 0.90);
    const tv = clampUV(0.5 + Math.sin(ang)*(rad*0.78)*0.82, 0.14, 0.86);
    agents.push({
      tile:i, kind,
      u, v, tu, tv,
      slot, slotAng: ang, slotN: total,
      speed:(AGENT_SPEED[kind]||0.08)+Math.random()*0.025,
      phase:Math.random()*6.28,
      facing: Math.random()<0.5 ? 1 : -1,
      walkPhase: Math.random(),
      moving: false,
      idleT: Math.random()*2,
      grazeT: 0,
      peckT: 0,
    });
  }
  existing.forEach(a=>{ a.slotN = total; });
  // Drop oldest agents when over budget (graze still sim-runs without sprites)
  while(agents.length > AGENT_CAP) agents.shift();
}
function spawnGrazeAgents(i, g){
  if(!g) return;
  const cap = (k)=> Math.min(HERD_MAX[k]||6, grazeKindHeads(g,k) || 1);
  if(g.kind==='cattle' || g.kind==='team') spawnAnimals(i, 'cow', cap('cattle'));
  if(g.kind==='chicken' || g.kind==='team') spawnAnimals(i, 'chicken', cap('chicken'));
  if(g.kind==='sheep' || g.kind==='goat' || g.kind==='pig') spawnAnimals(i, g.kind, cap(g.kind));
  if(g.kind==='duckT') spawnAnimals(i, 'duckT', cap('duckT'));
}
function findHerdTiles(kind){
  const out = [];
  if(!state || !state.grid) return out;
  state.grid.forEach((t,i)=>{ if(t.graze && grazeHasKind(t.graze, kind)) out.push(i); });
  return out;
}
function herdKindPlaced(kind){ return findHerdTiles(kind).length > 0; }
function leaveGrazeKind(i, kind){
  const t = state.grid[i];
  if(!t || !t.graze) return;
  const g = t.graze;
  const stay = g.stay||0;
  const wasTeam = g.kind==='team';
  const hadCattle = g.kind==='cattle' || wasTeam;
  const nCh = Math.max(1, g.nChicken||1);
  const nCa = Math.max(1, g.nCattle||g.n||1);
  if(wasTeam && kind==='cattle'){
    t.graze = newGraze('chicken', {synergy:true, stay:0, n:nCh});
    t.sinceCattle = 0;
  }else if(wasTeam && kind==='chicken'){
    t.graze = newGraze('cattle', {stay:0, n:nCa});
  }else{
    t.graze = null;
    if(stay>=2){
      t.sinceGraze = 0;
      if(hadCattle) t.sinceCattle = 0;
      if(typeof earnNote==='function') earnNote('rest');
      floater(i, '💚 resting', '#c8f0a0');
    }
  }
}
function occupyGraze(kind, i, isMove){
  const t = state.grid[i];
  const heads = Math.max(1, (camp && camp.herd && (camp.herd[kind]|0)) || 1);
  if(kind==='chicken' && t.graze && t.graze.kind==='cattle'){
    t.graze.kind = 'team';
    t.graze.synergy = true;
    t.graze.nChicken = heads;
    t.graze.nCattle = Math.max(1, t.graze.nCattle||t.graze.n||1);
    t.graze.n = t.graze.nCattle + t.graze.nChicken;
    t.graze.total = grazeRestDays(t.graze);
    t.graze.days = Math.max(0, t.graze.total - (t.graze.stay||0));
    state.stats.synergy = (state.stats.synergy|0) + 1;
    celebrateTeamGraze(i);
    tutEvent('synergy');
    return;
  }
  if(kind==='cattle' && t.graze && t.graze.kind==='chicken'){
    t.graze.kind = 'team';
    t.graze.synergy = true;
    t.graze.nCattle = heads;
    t.graze.nChicken = Math.max(1, t.graze.nChicken||t.graze.n||1);
    t.graze.n = t.graze.nCattle + t.graze.nChicken;
    t.graze.total = grazeRestDays(t.graze);
    t.graze.days = Math.max(0, t.graze.total - (t.graze.stay||0));
    state.stats.synergy = (state.stats.synergy|0) + 1;
    celebrateTeamGraze(i);
    tutEvent('synergy');
    return;
  }
  if(kind==='chicken'){
    const syn = (t.sinceCattle||999) <= 8;
    t.graze = newGraze('chicken', {synergy:syn, n:heads});
    if(syn){
      state.stats.synergy = (state.stats.synergy|0) + 1;
      celebrateTeamGraze(i, true);
      tutEvent('synergy');
    }else if(!isMove){
      floater(i, '🐔 scratching!', '#ffe0b0');
    }
    return;
  }
  t.graze = newGraze(kind, {n:heads});
  if(!isMove){
    const words = {cattle:'🐄 mob grazing!', sheep:'🐑 mowing!', goat:'🐐 browsing!', pig:'🐖 tilling!', duckT:'🦆 on patrol!'};
    floater(i, words[kind], '#ffe0b0');
  }
}
function moveHerd(kind, toIdx){
  const dest = state.grid[toIdx];
  if(!dest || grazeHasKind(dest.graze, kind)) return false;
  if(dest.graze && !canTeamJoin(kind, dest.graze)) return false;
  const olds = findHerdTiles(kind);
  olds.forEach(oi=>{ if(oi!==toIdx) leaveGrazeKind(oi, kind); });
  const ak = GRAZE_TOOLS[kind];
  let n = 0;
  agents.forEach(a=>{
    if(a.kind!==ak) return;
    if(olds.length && olds.indexOf(a.tile)<0 && a.tile!==toIdx) return;
    a.tile = toIdx;
    n++;
  });
  if(n===0) spawnAnimals(toIdx, ak, herdSpawnCount(kind));
  occupyGraze(kind, toIdx, true);
  state.stats.grazes = (state.stats.grazes|0) + 1;
  burst(toIdx, '#c8f0a0', 12);
  floater(toIdx, 'herd moved', '#c8f0a0');
  if(kind==='cattle') SND.moo();
  else if(kind==='chicken') SND.cluck();
  else SND.place();
  afterBuild();
  return true;
}
function placeHerd(kind, i){
  occupyGraze(kind, i, false);
  spawnAnimals(i, GRAZE_TOOLS[kind], herdSpawnCount(kind));
  if(kind==='cattle') state.stats.cattle = (state.stats.cattle|0) + 1;
  if(kind==='chicken') state.stats.chickens = (state.stats.chickens|0) + 1;
  state.stats.grazes = (state.stats.grazes|0) + 1;
  if(kind==='cattle'){ SND.moo(); tutEvent('graze_cattle'); }
  else if(kind==='chicken'){ SND.cluck(); }
  else SND.place();
  if(kind==='goat') tutEvent('graze_goat');
  if(kind==='cattle' && (state.stats.cattle|0)===1){
    toast('🐄 First cow is cheap — tap this pad again to grow the herd. Move them so the land can rest.', {once:'first_cattle_place', throttleMs:4000});
  }else if(kind==='chicken' && (state.stats.chickens|0)===1 && (state.stats.cattle|0) >= 1 && !(state.stats.synergy|0)){
    toast('🐔 Chickens scratch after cattle — place them on recently grazed soil for ✨ team graze.', {once:'first_chicken_place', throttleMs:4000});
  }else if(kind==='sheep'){
    toast('🐑 Sheep mow gently — they thicken cover without strip-grazing. Two tiles hit the market goal.', {once:'first_sheep_place', throttleMs:4000});
  }else if(kind==='pig'){
    toast('🐖 Pigs till as they root — good for tough ground, not for finished beds.', {once:'first_pig_place', throttleMs:4000});
  }
  afterBuild();
  return true;
}
function addHerdHead(kind, i){
  ensureHerd(camp);
  const max = HERD_MAX[kind] || 6;
  if((camp.herd[kind]|0) >= max){
    toast('Herd is full — '+max+' '+(HERD_LABEL[kind]||kind)+'. Move them so the land can rest.');
    SND.uhoh();
    return false;
  }
  const cost = HERD_BUY[kind] || 0;
  if(cost>0 && !spend(cost)) return false;
  camp.herd[kind] = (camp.herd[kind]|0) + 1;
  const t = state.grid[i];
  const g = hydrateGraze(t.graze);
  if(g.kind==='team'){
    if(kind==='cattle') g.nCattle = grazeKindHeads(g,'cattle') + 1;
    else if(kind==='chicken') g.nChicken = grazeKindHeads(g,'chicken') + 1;
    g.n = (g.nCattle|0) + (g.nChicken|0);
  }else{
    g.n = Math.max(1, g.n|0) + 1;
    if(kind==='cattle') g.nCattle = g.n;
    if(kind==='chicken') g.nChicken = g.n;
  }
  g.total = grazeRestDays(g);
  g.days = Math.max(0, g.total - (g.stay||0));
  spawnAnimals(i, GRAZE_TOOLS[kind], 1);
  toast('Herd is '+camp.herd[kind]+' '+(HERD_LABEL[kind]||kind)+' — bigger impact, hungrier pad.');
  if(kind==='cattle') SND.moo();
  else if(kind==='chicken') SND.cluck();
  else SND.place();
  if(typeof buildPalette==='function') buildPalette();
  afterBuild();
  return true;
}
function trimParticles(){
  if(worldParts.length > WORLD_PART_CAP) worldParts.splice(0, worldParts.length - WORLD_PART_CAP);
  if(screenParts.length > SCREEN_PART_CAP) screenParts.splice(0, screenParts.length - SCREEN_PART_CAP);

// returns true if the tool did something (used for paint-drag)
const DECO_CYCLE = ['deco_haybales','deco_flowerbed','deco_scarecrow','deco_cart','deco_signpost','deco_stonewall','deco_lamp','deco_gate'];
let decoIdx = 0;
/** Human-readable name for whatever is blocking a placement (toast copy). */
function tileBlockerName(t){
  if(!t) return 'that tile';
  if(t.crop){
    const c = CROPS && CROPS[t.crop.type];
    return (c && c.name) ? c.name : 'crop';
  }
  if(t.graze){
    const g = {cattle:'cattle', chicken:'chickens', sheep:'sheep', goat:'goats', pig:'pigs', duckT:'ducks', team:'herd'};
    return g[t.graze.kind] || 'grazing animals';
  }
  if(t.deco){
    const D = typeof HS_CATALOG!=='undefined' && HS_CATALOG.find(h=>h.id===t.deco);
    if(D && D.name) return D.name;
    const em = DECO_EMOJI[t.deco];
    return em ? em+' decoration' : 'decoration';
  }
  if(t.terrain==='trees') return 'trees';
  if(t.terrain==='house' || t.terrain==='barn') return 'the house';
  if(t.terrain==='nstand') return 'the neighbor stand';
  if(t.terrain==='coop') return 'the chicken coop';
  if(BUILD_SET.has(t.terrain)){
    const td = toolDef(t.terrain);
    if(td && td.name) return td.name;
    return t.terrain;
  }
  if(t.terrain==='pond' || t.terrain==='water') return 'water';
  if(t.terrain==='dead') return 'dead ground';
  if(t.compost>0) return 'compost pile';
  return 'what\'s on this tile';
}
function toastNeedClear(t){
  if(t && t.graze){
    toast('Move the herd — they live here. Use the animal tool to relocate them.');
    return;
  }
  const name = tileBlockerName(t);
  // Always name the blocker + next action (RW-083 / ship A1)
  toast(`Can\'t build here — ${name} is in the way. Use 🚜 Clear, then try again.`);
}
/** F3 — first team graze (cattle→chickens) is a mini combo moment. */
function celebrateTeamGraze(i, followOn){
  floater(i, followOn ? '✨ following the herd!' : '✨ Team graze!', '#ffe89a', 17);
  burst(i, '#ffd45e', followOn ? 10 : 20);
  ringAt(i, '#ffe89a', followOn ? 1.05 : 1.45);

  if(!camp.tipsShown) camp.tipsShown = {};
  if(!camp.tipsShown.team_graze_first){
    camp.tipsShown.team_graze_first = true;
    confetti(36);
    SND.teamGraze();
    toast('✨ Soil magic! Chickens after cattle supercharge the ground — that\'s team graze.');
  }else{

  }

}
/** Field notes — earned by doing. Player voice, scrapbook loot. */
const FIELD_NOTES = [
  {id:'wake', em:'💀', title:'Sleeping soil', body:'Dead crust is soil that lost its living community. Food and living roots wake it.'},
  {id:'first_light', em:'🌅', title:'First light', body:'Gray becomes brown when life returns. Nothing green starts until the ground is alive.'},
  {id:'guild', em:'🌽', title:'The guild', body:'Corn is the pole. Beans feed nitrogen. Squash shades weeds. A team feeds the soil; a lonely crop bills it.'},
  {id:'lonely', em:'🌾', title:'The lonely crop', body:'One species, one appetite. Fast coins, thinner soil. Diversity is the opposite bet.'},
  {id:'herd', em:'🐄', title:'Follow the herd', body:'Hooves open the sod. Birds and chickens follow. That\'s how prairie stayed fertile.'},
  {id:'rest', em:'🕯️', title:'Sabbath', body:'Rest is a practice. Roots and microbes work when you aren\'t extracting.'},
  {id:'buffer', em:'🌳', title:'The filter', body:'Trees on the bank hold soil and drink the runoff. Clean water is a crop you grow.'},
  {id:'bloom', em:'🌼', title:'Flowers are infrastructure', body:'Blooms feed pollinators; pollinators feed harvests. Wildness is not decoration.'},
  {id:'salt', em:'🧂', title:'Salt memory', body:'Salt is leftover irrigation and drought. Extra life and time are the only rinse.'}
];
function fieldNoteDef(id){
  for(let i=0;i<FIELD_NOTES.length;i++) if(FIELD_NOTES[i].id===id) return FIELD_NOTES[i];
  return null;
}
function fieldNoteCount(){
  if(!camp || !camp.fieldNotes) return 0;
  let n = 0;
  for(const k in camp.fieldNotes) if(camp.fieldNotes[k]) n++;
  return n;
}
function syncNotesBtn(){
  const btn = document.getElementById('btnNotes');
  if(!btn) return;
  const n = fieldNoteCount();
  btn.title = n ? 'Field notes — '+n+' earned' : 'Field notes — earn them by doing';
  const dot = document.getElementById('notesDot');
  if(dot){
    dot.hidden = n===0;
    dot.textContent = n>0 ? String(n) : '';
  }
}
function pulseNotesBtn(){
  const btn = document.getElementById('btnNotes');
  if(btn){
    btn.classList.add('has-new');
    try{ btn.animate([{transform:'scale(1)'},{transform:'scale(1.1)'},{transform:'scale(1)'}], {duration:420}); }catch(e){}
  }
  syncNotesBtn();
}
function earnNote(id, opts){
  opts = opts || {};
  if(!camp) return false;
  camp.fieldNotes = camp.fieldNotes || {};
  if(camp.fieldNotes[id]) return false;
  const note = fieldNoteDef(id);
  if(!note) return false;
  camp.fieldNotes[id] = true;
  if(!opts.silentChime){
    if(SND && typeof SND.note==='function') SND.note();
    else if(SND && typeof SND.badge==='function') SND.badge();
  }
  pulseNotesBtn();
  if(typeof scrapbookAdd==='function') scrapbookAdd('note', '📓 '+note.title, note.body);
  const fire = ()=>{
    const ban = document.getElementById('badgeBanner');
    if(ban && ban.classList.contains('show')){
      setTimeout(fire, 700);
      return;
    }
    if(typeof toast==='function')
      toast('📓 Field note — '+note.title, {once:'fieldnote_'+id, throttleMs:400, _coachBypass:true});
  };
  let delay = opts.delay|0;
  if(!delay && typeof celebrationBusy==='function' && celebrationBusy()) delay = 1600;
  if(delay>0) setTimeout(fire, delay);
  else fire();
  return true;
}
function openFieldNotes(){
  if(!camp) return;
  camp.fieldNotes = camp.fieldNotes || {};
  const btn = document.getElementById('btnNotes');
  if(btn) btn.classList.remove('has-new');
  if(typeof hideBadgeBanner==='function') hideBadgeBanner();
  if(!camp.tipsShown) camp.tipsShown = {};
  const first = !camp.tipsShown.fieldnotes_open;
  if(first) camp.tipsShown.fieldnotes_open = true;
  const n = fieldNoteCount();
  const total = FIELD_NOTES.length;
  const head = first
    ? `<div class="lesson">Earned by doing. Locked pages stay ? until the land teaches you.</div>`
    : '';
  const rows = FIELD_NOTES.map(note=>{
    const unlocked = !!camp.fieldNotes[note.id];
    if(!unlocked){
      return `<div class="fn-page locked"><div class="fn-em">?</div><div><div class="fn-title">?</div><div class="fn-body">Still waiting to be earned.</div></div></div>`;
    }
    return `<div class="fn-page"><div class="fn-em">${note.em}</div><div><div class="fn-title">${note.title}</div><div class="fn-body">${note.body}</div></div></div>`;
  }).join('');
  showModal(`
    <h2>📓 Field Notes</h2>
    <div class="sub">${n? n+' of '+total+' notes — a scrapbook of what your hands learned.':'Empty pages. Plant, graze, feed — the book fills as you do.'}</div>
    ${head}
    <div class="fn-book">${rows}</div>
    <div class="modalbtns"><button class="mbtn" data-act="close">Close</button></div>
  `);
}
/** F6 / X4 / AJ / RG — inspect names the practice, then a health vibe. */
function soilStoryLine(t){
  if(!t) return '';
  if(t.terrain==='dead'){
    if(t.compost>0 || t.crop) return '🌅 Waking — food and living roots are calling the community back.';
    if(t.feature==='saltflat') return '🧂 Salt memory — leftover irrigation and drought. Extra life and time are the only rinse.';
    return '💀 Sleeping soil — the living community is gone until you feed it.';
  }
  if(t.terrain==='water'){
    return '💧 The filter — trees on the bank hold soil and drink the runoff. Clean water is a crop you grow.';
  }
  if(t.terrain==='pond'){
    if(typeof isMarshPondT==='function' && isMarshPondT(t))
      return '🌾 Marsh pond — runoff settles here before it reaches the main river.';
    return '💧 Water held on the land — a pond keeps neighbors moist.';
  }
  if(t.terrain==='trees'){
    if(typeof waterAdj==='function' && waterAdj(t))
      return '🌳 The filter — roots hold the bank and drink the runoff.';
    return '🌳 Living hedge — windbreak, shade, and a home for bees.';
  }
  if(t.terrain!=='soil') return '';
  const h = t.health|0;
  const tier = h >= 80 ? '🌟 Rich living soil — keep diversity and rest; it pays you back.'
    : h >= 70 ? '💚 Healthy ground — thriving roots and life underneath.'
    : h >= 55 ? '🙂 Workable soil — plant a mix or rest it to push toward restored.'
    : h >= 40 ? '😐 Thin but alive — compost, cover, or graze carefully to rebuild.'
    : t.compost>0 ? '🪣 Feeding hard — keep it moist and let the days work.'
    : '😟 Hungry soil — try compost, pioneers, or rest after grazing.';
  if(t.graze){
    const g = t.graze;
    if((g.stay||0) >= grazeRestDays(g))
      return '⚠️ This pad is tired — move the herd. '+tier;
    if(g.kind==='team' || g.synergy) return '🐄🐔 Follow the herd — hooves open the sod; chickens follow. That\'s how prairie stayed fertile. '+tier;
    if(g.kind==='cattle' || g.kind==='cow') return '🐄 Cattle remaking this pad — send 🐔 chickens next. '+tier;
    if(g.kind==='chicken') return '🐔 Chickens working the surface. '+tier;
    return '🐾 Grazers on this tile. '+tier;
  }
  if(t.crop && CROPS[t.crop.type]){
    const c = CROPS[t.crop.type];
    if(t.crop.type==='sisters')
      return '🌽 The guild — corn is the pole, beans feed nitrogen, squash shades weeds. A team feeds the soil. '+tier;
    if(t.crop.type==='wheat' || (!c.diverse && !c.cover)){
      const days = t.crop.days||0;
      if(days >= 1)
        return '🌾 The lonely crop — this stand is charging the soil a fee. Fast coins, thinner ground. '+tier;
      return '🌾 The lonely crop — one species, one appetite. Fast coins if it pays. '+tier;
    }
    if(c.cover || c.pioneer) return (c.em||'🌿')+' Living roots pump carbon down and crack the crust. '+tier;
    if(c.diverse) return (c.em||'🌽')+' Diverse crop growing. '+tier;
    return (c.em||'🌾')+' Crop in the ground. '+tier;
  }
  if(!t.crop && !t.graze && ((t.sinceGraze||999) < 8 || (t.sinceCattle||999) < 8))
    return '🕯️ Sabbath — rest after the herd. Roots and microbes work when you aren\'t extracting. '+tier;
  if(t.revivedOnce && h < 60){
    if(t.compost>0)
      return '🌅 Woke from dead ground — compost is still rebuilding it. '+tier;
    return '🌅 Woke from dead ground — plant cover or rest so it doesn\'t slip back.';
  }
  return tier;
}
function tileDist2(a, b){
  const ta = state.grid[a], tb = state.grid[b];
  if(!ta || !tb) return 1e9;
  return (ta.c-tb.c)*(ta.c-tb.c) + (ta.r-tb.r)*(ta.r-tb.r);
}
function nearestMatchingTile(fromI, pred){
  let best = -1, bd = 1e9;
  state.grid.forEach((t,i)=>{
    if(!pred(t,i)) return;
    const d = tileDist2(fromI, i);
    if(d < bd){ bd = d; best = i; }
  });
  return best;
}
function redirectPaintTarget(i){
  if(i<0 || !state || !state.grid || homesteadMode) return i;
  const t = state.grid[i];
  if(!t) return i;
  const L = typeof LV==='function' ? LV() : null;
  const home = !!(L && L.id==='home');
  if((tool==='compost' || tool==='covercrop') && home && (t.terrain==='soil' || (typeof isSwaleT==='function' && isSwaleT(t))) && !t.crop){
    const dead = nearestMatchingTile(i, (tt,ii)=>{
      if(tt.terrain!=='dead') return false;
      if(typeof isSwaleT==='function' && isSwaleT(tt)) return false;
      if(paintSet && paintSet.has(ii)) return false;
      if(tool==='compost' && (tt.compost||0)>5) return false;
      if(tool==='covercrop' && tt.crop) return false;
      return true;
    });
    if(dead>=0){
      if(!state._grayWakeToast){
        state._grayWakeToast = true;
        toast('Gray cracked tiles are the ones that wake — paint those first.');
      }
      if(paintSet) paintSet.add(dead);
      return dead;
    }
  }
  if(tool==='sisters' && t.terrain==='soil' && (t.crop || t.graze)){
    // 3 paints on the same heart tile should land on 3 soils — never swallow a dead-tile lesson
    const nxt = nearestMatchingTile(i, (tt,ii)=>{
      if(paintSet && paintSet.has(ii)) return false;
      return tt.terrain==='soil' && !tt.crop && !tt.graze
        && !(typeof swaleBlocksCrop==='function' && swaleBlocksCrop(tt))
        && !(typeof pathBlocksCrop==='function' && pathBlocksCrop(tt));
    });
    if(nxt>=0){
      if(paintSet) paintSet.add(nxt);
      return nxt;
    }
  }
  return i;
}
function applyTool(i){
  if(homesteadMode) return applyHomesteadTool(i);
  // Compost: judge the tile the player actually clicked, before any neighbor redirect.
  if(tool==='compost' && state && state.grid && state.grid[i]){
    const src = state.grid[i];
    recalc(src);
    const winter = !!(SEASONS[state.season] && SEASONS[state.season].canPlant===false);
    if(src.terrain==='soil' && LV() && LV().id==='home'){
      toast('🌱 Already awake — compost gray cracked tiles. No coins taken.');
      SND.uhoh(); return false;
    }
    if(src.terrain==='dead' && deadWakeShown(src).full){
      if(maybeWakeDeadTile(src, i)){ afterBuild(); return true; }
      toast('🌅 Wake bar is already full — press ▶️ so this tile can become Field. No coins taken.');
      SND.uhoh(); return false;
    }
    if(winter && src.terrain==='dead' && (src.compost||0)>0){
      toast('❄️ Needs spring — compost is already on this tile. Press ▶️ or wait for thaw. No coins taken.');
      SND.uhoh(); return false;
    }
  }
  i = redirectPaintTarget(i);
  const t = state.grid[i];
  const td = toolDef(tool);
  if(!t || !td) return false;

    selected = i;

      inspectLeftoverPile();
      ringAt(i, '#ffe89a'); SND.pop();
      return true;
    }
    openInfo();
    ringAt(i, '#ffe89a'); SND.pop();
    return true;
  }
  if(t.terrain==='barn' || t.terrain==='coop'){ toast('That\'s the farmstead — pick open soil tiles around it.'); SND.uhoh(); return false; }
  if(t.terrain==='riverbed'){ toast(isValleyLevel(state.lv) ? '🏜️ Dry creekbed — revive Dry Wash soil first, then water returns.' : '🏜️ Dry creekbed — heal the banks first; water once ran here.'); SND.uhoh(); return false; }
  if(t.terrain==='water'){
    if(tool==='bridge'){
      if(t.bridge) return false;
      if(!spend(td.cost)) return false;
      t.bridge = true;
      state.stats.buildings++;
      floater(i, '🌉 bridge!', '#e8dcc0'); SND.place();
      afterBuild(); return true;
    }
    if(tool==='bulldoze' && t.bridge){
      if(!spend(td.cost)) return false;
      t.bridge = false;
      floater(i, '🚜 cleared', '#e8dcc0'); SND.place();
      afterBuild(); return true;
    }
    toast('The river flows here! 🌊 Plant 🌳 trees BESIDE it to filter the runoff.');
    return false;
  }
  if(tool==='bridge'){ toast('🌉 Bridges go ON the river!'); return false; }
  if(tool==='bulldoze'){
    let did = null;
    if(isLandT(t) && t.crop) did = ()=>{ t.crop = null; };
    else if(isLandT(t) && t.graze){
      toast('Move the herd — they live here.');
      SND.uhoh(); return false;
    }
    else if(isLandT(t) && t.deco) did = ()=>{ t.deco = null; t.decoRot = 0; };
    else if(isLandT(t) && hasFence(t)) did = ()=>{ t.fence = false; };
    else if(isLandT(t) && t.feature==='path') did = ()=>{ t.feature = null; };
    else if(t.terrain==='pond' || t.terrain==='trees') did = ()=>{ t.terrain = 'soil'; };
    else if(BUILD_SET.has(t.terrain)) did = ()=>{ t.terrain = 'soil'; agents = agents.filter(a=>a.tile!==i); };
    if(!did){ toast('Nothing to clear here.'); return false; }
    if(!spend(td.cost)) return false;
    did();
    floater(i, '🚜 cleared', '#e8dcc0'); burst(i, '#c9b896', 8); SND.place();
    afterBuild(); return true;
  }
  if(!isLandT(t)){ toast(isWaterT(t) ? 'That\'s water! 💧' : t.terrain==='trees' ? 'Trees live here! 🌳' : 'Something is already built here! 🏗️'); return false; }

      // H3 — name the next action (compost/pioneers), not just "dead"

  }
  if(tool==='trees'){
    if(dead){ toast('💀 Saplings can\'t root in dead ground — feed it first with 🪣 or 🌿!'); SND.uhoh(); return false; }
    if(t.crop || t.graze){ toastNeedClear(t); return false; }
    if(!spend(td.cost)) return false;
    t.terrain = 'trees'; t.flowers = Math.min(1, t.flowers+0.3); t.deco = null;
    state.stats.trees++;
    floater(i, '🌳 hedgerow!', '#c8f0a0'); burst(i, '#6fae5f', 12); SND.place();
    if(waterAdj(t)){
      // riparian buffer! the key clean-water move — make cause→effect obvious
      if(typeof atlasWaterAdjLocal==='function' && state && atlasWaterAdjLocal(state, t.c, t.r)){
        t.farmEdge = t.farmEdge || 'riparian';
      }
      state.waterQuality = clamp(state.waterQuality + 4);
      state.stats.buffers++;
      tutEvent('buffer');
      setTimeout(()=>floater(i, '💧 riparian buffer!', '#bfe3ff', 16), 350);
      ringAt(i, '#7fd4f0');
      if(!state.riparianTip){
        state.riparianTip = true;
        const lid = (LV() && LV().id) || '';
        const creeky = lid==='creek' || lid==='valley' || lid==='marsh';
        setTimeout(()=>toast(creeky
          ? '🏞️ First tree by the water — river quality rises as roots filter runoff. Line the bank for a bigger lift!'
          : '🌳 Buffer roots filter runoff before it reaches the river — water quality rising!'
        , {once:'first_tree_by_water', throttleMs:3500}), 600);
      }
      if(typeof earnNote==='function') earnNote('buffer', {delay:1800});
    }
    afterBuild(); return true;
  }
  if(tool==='compost'){
    recalc(t);
    const barFull = dead && deadWakeShown(t).full;
    const winter = !!(SEASONS[state.season] && SEASONS[state.season].canPlant===false);
    if(dead && barFull){
      if(maybeWakeDeadTile(t, i)){ afterBuild(); return true; }
      toast('🌅 Wake bar is already full — press ▶️ so this tile can become Field. No coins taken.');
      SND.uhoh(); return false;
    }
    if(dead && maybeWakeDeadTile(t, i)){ afterBuild(); return true; }
    if(!dead && t.terrain==='soil' && (t.compost||0) > 0){
      toast('🌱 Already awake — compost is working here. No coins taken.');
      SND.uhoh(); return false;
    }
    if(winter && dead && (t.compost||0) > 0){
      toast('❄️ Needs spring — compost is already on this gray tile. Press ▶️ or wait for thaw. No coins taken.');
      SND.uhoh(); return false;
    }
    if((t.compost||0) > 0){
      toast(dead ? '🪣 Compost is already on this tile — press ▶️ so days can wake it. No coins taken.' : '🪣 Already composted — the soil is still digesting. No coins taken.');
      SND.uhoh(); return false;
    }
    const fromPile = typeof compostUsesPile==='function' && compostUsesPile();
    if(fromPile){
      spendLeftoverCompost();
    }else{
      const cost = state.unlocks.upg_compost ? 2 : td.cost;
      if(!spend(cost)) return false;
    }
    applyCompostSoil(t, fromPile);
    state.stats.composts++;
    floater(i, fromPile ? '🪣 leftover pile · richer wake' : '🪣 +compost', '#d8c8a0'); burst(i, '#9a7d54', 10); SND.place();
    if(fromPile){
      toast('🪣 Leftover pile compost feeds the soil harder than a bought bag.', {once:'leftover_compost_use', throttleMs:4000});
      if(typeof buildPalette==='function') buildPalette();
    }
    if(dead){
      markPlayerFedDead(t); tutEvent('feed_dead');
      if(typeof earnNote==='function') earnNote('wake', {delay:700});
    }
    recalc(t);
    if(dead && maybeWakeDeadTile(t, i)){ afterBuild(); return true; }
    if(dead && !state.deadTip2){
      state.deadTip2 = true;
      if(!tutCoachActive()) toast('🪣 Food for the dead ground — keep feeding and it will wake!');
    }
    if(t.feature==='saltflat'){
      if(typeof ringAt==='function') ringAt(i, '#c9a050');
      toast('🧂 Salt pan — needs extra feed (wakes at 30❤️). Ring compost + pioneers; goats can browse dead scrub.', {once:'salt_first_touch', throttleMs:4000});
      if(typeof earnNote==='function') earnNote('salt', {delay:1100});
    }
    afterBuild(); return true;
  }
  if(tool==='fence'){
    if(hasFence(t)){
      // free re-orient in campaign too
      t.fence = fenceFacing(t) === 0 ? 2 : 1;
      if(camp){ if(!camp.tipsShown) camp.tipsShown = {}; camp.tipsShown.fence_rotated = true; }
      floater(i, '↻ fence '+yardOrientLabel(fenceFacing(t)), '#e8dcc0'); SND.pop();
      afterBuild(); return true;
    }
    if(!spend(td.cost)) return false;
    t.fence = (yardPlaceRot & 1) + 1;
    floater(i, '🚧 paddock '+yardOrientLabel(fenceFacing(t)), '#e8dcc0'); SND.place();
    // BX — soft R tip after first place if they never rotated
    if(camp){
      if(!camp.tipsShown) camp.tipsShown = {};
      if(!camp.tipsShown.fence_rotated && !camp.tipsShown.keys_r_place){
        setTimeout(()=>{
          if(!camp || camp.tipsShown.fence_rotated) return;
          toast('↻ Press R (or re-tap the fence) to flip facing.', {once:'keys_r_place', throttleMs:4000});
        }, 800);
      }
    }
    afterBuild(); return true;
  }
  if(tool==='decor'){
    if(t.crop || t.graze){ toastNeedClear(t); return false; }
    if(!spend(td.cost)) return false;
    t.deco = DECO_CYCLE[decoIdx % DECO_CYCLE.length];
    decoIdx++;
    state.stats.decos++;
    floater(i, '🎀 cozy!', '#ffd9e8'); SND.place();
    afterBuild(); return true;
  }
  if(BUILD_SET.has(tool)){
    // L5 — build/orchard tools never use graze copy; name the blocker + Clear
    if(t.crop || t.graze){
      toast('Can\'t place '+ (td.name||tool) +' — '+tileBlockerName(t)+' is here. 🚜 Clear first.');
      ringAt(i, '#e06666'); SND.uhoh(); return false;
    }
    if(tool==='wetland' && dead){ toast('💀 Wetland plants need living ground — revive this tile first!'); SND.uhoh(); return false; }
    if((tool==='orchard' || tool==='berrybush' || tool==='beehive') && dead){
      toast('💀 '+ (td.em||'') +' needs living ground — feed with 🪣 or 🌿 first!');
      ringAt(i, '#c98a3d'); SND.uhoh(); return false;
    }
    if(!spend(td.cost)) return false;
    t.terrain = tool; t.deco = null; t.feature = null; t.crop = null;
    state.stats.buildings++;
    // AH/BJ — first orchard / market / power / berry tips
    if(tool==='orchard'){
      if(typeof ringAt==='function') ringAt(i, '#8fce6e');
      toast('🍎 Orchard planted — fruit coins each season (not winter). Add 🫐 berries and a 🐝 hive nearby.', {once:'first_orchard', throttleMs:4000});
    }
    if(tool==='berrybush'){
      toast('🫐 Berry hedge — seasonal coins + blossoms for pollinators. Pair with orchards and a beehive.', {once:'first_berrybush', throttleMs:4000});
    }
    if(tool==='beehive'){
      toast('🐝 Beehive placed — pollinators boost nearby orchards and berries.', {once:'first_beehive', throttleMs:4000});
    }
    if(tool==='market'){
      toast('🏪 Market open — a few coins trickle in every day. Pair with a silo for harvest punch.', {once:'first_market', throttleMs:4000});
    }
    if(tool==='silo'){
      toast('🌾 Silo up — harvests pay better with storage nearby.', {once:'first_silo', throttleMs:4000});
    }
    // BJ — Wind Ridge power / water builds
    if(tool==='windmill' || tool==='solar'){
      toast((tool==='windmill'?'🌬️ Windmill':'☀️ Solar')+' — clean power pays +2🪙 a day. Rain tanks and a well steady droughts.', {once:'first_power_build', throttleMs:4000});
    }
    if(tool==='raintank'){
      toast('🛢️ Rain tank — keeps nearby soil moist through dry spells. Stack a few on the ridge.', {once:'first_raintank', throttleMs:4000});
    }
    if(tool==='well'){
      toast('⛲ Well — groundwater for neighboring soil. Nice companion to rain tanks.', {once:'first_well', throttleMs:4000});
    }
    const bWords = {market:'🏪 open for business!', silo:'🌾 grain store!', greenhouse:'🪴 warm glass!', beehive:'🐝 buzzing!',
      orchard:'🍎 orchard planted!', raintank:'🛢️ catching rain!', wetland:'🌾 wetland born!', stable:'🐴 neigh!',
      wormfarm:'🪱 worm army!', birdhouse:'🐦 new tenants!', well:'⛲ sweet water!', windmill:'🌬️ spinning!',
      solar:'☀️ plugged in!', mushroom:'🍄 mycelium!', berrybush:'🫐 berries!'};
    floater(i, bWords[tool]||'built!', '#ffe0b0'); burst(i, '#e8c87a', 12); SND.place();
    if(tool==='stable') spawnAnimals(i, 'horse', 1);
    if(tool==='wetland' && waterAdj(t)){
      state.waterQuality = clamp(state.waterQuality + 5);
      setTimeout(()=>floater(i, '💧 filtering the river!', '#bfe3ff', 15), 350);
    }
    afterBuild(); return true;
  }
  return false;
}
function afterBuild(){
  checkBadges();
  updateQuests();
  save();
  updateHUD();
  if(typeof tutSyncSim==='function') tutSyncSim();
  if(selected>=0) openInfo(true);
  // K5 — after first meaningful action, keep goals strip honest
  if(state && state.lv===0 && !state.levelDone){
    const st = state.stats||{};
    if((st.planted|0)+(st.composts|0)+(st.coverPlanted|0)+(st.revived|0) >= 1)
      pulseGoalsForFirstMinute();
    // BA/BB — first 5 min play nudge (delayed so it never fights intro/tut toasts)
    if(state.paused && ((st.composts|0)+(st.coverPlanted|0)+(st.planted|0) >= 1)){
      setTimeout(maybeNudgePlayAfterFirstPaint, 900);
    }
  }
  // BJ — School Garden first meaningful place (teach-back: basics only)
  if(state && !state.levelDone && !homesteadMode){
    const L = LV();
    if(L && L.id==='school'){
      const st = state.stats||{};
      if(((st.composts|0)+(st.coverPlanted|0)+(st.planted|0)+(st.revived|0)) >= 1){
        toast('📚 School Garden — just compost, pioneers, and sisters. Leave it greener than you found it.', {once:'first_school_place', throttleMs:4000});
      }
    }
  }
}
/** CH — true while Home tutorial coach is visible and not finished. */
function tutCoachActive(){
  try{
    if(!state || state.tutDone) return false;
    const tutEl = document.getElementById('tut');
    return !!(tutEl && tutEl.classList.contains('show'));
  }catch(e){ return false; }
}
function pickCampaignTool(id){
  if(!id) return;
  if(typeof toolAllowed==='function' && !toolAllowed(id)) return;
  tool = id;
  if(canvas) canvas.classList.toggle('tooling', id!=='select');
  document.querySelectorAll('.tool').forEach(el=>el.classList.toggle('active', el.id==='tool_'+id));
}
function clearCoachMarks(){
  document.querySelectorAll('.tool.coach').forEach(el=>el.classList.remove('coach'));
  const pause = document.getElementById('btnPause');
  if(pause) pause.classList.remove('coach');
}
function markCoach(id){
  clearCoachMarks();
  if(id==='pause'){
    if(typeof pulsePlayButtonNudge==='function') pulsePlayButtonNudge();
    return;
  }
  if(id) document.getElementById('tool_'+id)?.classList.add('coach');
}
function syncTutOpenClass(){
  const tut = document.getElementById('tut');
  const on = !!(tut && tut.classList.contains('show'));
  document.body.classList.toggle('tut-open', on);
  if(!on) clearCoachMarks();
}
/** BB — once tip + soft ▶️ highlight; skip while intro/tut/modal/journey own the screen. */
function maybeNudgePlayAfterFirstPaint(){
  if(!state || state.lv!==0 || state.levelDone || !state.paused) return;
  if(!camp.tipsShown) camp.tipsShown = {};
  if(camp.tipsShown.first_paint_play) return;
  const st = state.stats||{};
  if(((st.composts|0)+(st.coverPlanted|0)+(st.planted|0)) < 1) return;
  if(modalOpen || journeyOpen) return;
  if(document.getElementById('modalWrap') && document.getElementById('modalWrap').classList.contains('show')) return;
  // Wait until intro is dismissed (don't fight Look around / Start modal)
  if(!state.introSeen) return;
  // Don't clobber an active tutorial coach
  const tutEl = document.getElementById('tut');
  if(tutEl && tutEl.classList.contains('show') && !state.tutDone) return;
  // Don't fire if toast lane is busy with another tip — retry next paint/build
  if(toastBusyUntil && performance.now() < toastBusyUntil) return;
  toast('▶️ Press play so days pass — dead ground needs time to wake.', {once:'first_paint_play', throttleMs:4000});
  // toast reserves once-key only when it commits; pulse when that succeeded
  if(camp.tipsShown.first_paint_play) pulsePlayButtonNudge();
}
function pulsePlayButtonNudge(){
  try{
    const btn = document.getElementById('btnPause');
    if(!btn || !state || !state.paused) return;
    if(typeof updateClockUI==='function') updateClockUI(); // ensure ▶️ glyph while paused
    btn.classList.add('play-nudge');
    btn.setAttribute('aria-label', 'Play — press to let days pass');
    btn.title = 'Play — let days pass so the ground can wake';
    clearTimeout(btn._nudgeT);
    btn._nudgeT = setTimeout(()=>{
      btn.classList.remove('play-nudge');
      btn.setAttribute('aria-label', 'Pause or play');
      btn.title = 'Pause / play';
    }, 3400);
  }catch(e){}
}
// ---------------------------------------------------------------- events
function rollEvent(){
  if(!LV().events) return null;          // gentle early plots: no surprise weather
  if(state.seasonCount < 2) return null;
  if(Math.random() > 0.45) return null;
  const anyCrop = state.grid.some(t=>t.crop);
  const anyMono = state.grid.some(t=>t.crop && !CROPS[t.crop.type].diverse);
  const deadCount = state.grid.filter(t=>t.terrain==='dead').length;
  const s = state.season;
  const pool = [];
  if(s===1){ pool.push('drought','drought','sunny','beeVisit','gift'); }
  if(s===0){ pool.push('downpour','gentleRain','beeVisit','gift'); if(anyCrop) pool.push('pests'); }
  if(s===2){ pool.push('downpour','gentleRain','gift'); if(anyCrop) pool.push('pests'); }
  if(s===3){ pool.push('snow','gift','snow'); }
  if(anyMono && s!==3) pool.push('pests');
  if(deadCount>40 && s!==3) pool.push('duststorm','duststorm');   // the dying land bites back
  if(!pool.length) return null;
  return pool[(Math.random()*pool.length)|0];
}
function showEvent(id){
  const f = farmStats();
  let em='', title='', kid='', lines=[], lesson='', bad=false;
  const soils = soilTiles();
  if(id==='drought'){
    bad=true; em='🌵'; title='Drought!'; kid='The sun blazed for weeks and the land got thirsty!';
    let prot=0;
    soils.forEach(t=>{
      const p = Math.min(0.85, t.soil.om/100*0.55 + (pondNear(t)?0.3:0) + ((t.crop&&CROPS[t.crop.type].diverse)?0.12:0) + t.flowers*0.05 + ((typeof farmEdgeAdj==='function' && farmEdgeAdj(t))?0.08:0) + ((typeof swaleDownhillAdj==='function' && swaleDownhillAdj(t))?0.12:0) + ((typeof highPondDownhillAdj==='function' && highPondDownhillAdj(t))?0.12:0) + ((typeof washAdj==='function' && washAdj(t) && (t.washBankPulse||0)>6)?0.10:0) + ((typeof dustAwayFromWash==='function' && dustAwayFromWash(t))?-0.08:0));
      t.soil.water = clamp(t.soil.water - 13*(1-p));
      if(t.crop) t.crop.growth = Math.max(0.05, t.crop.growth - 0.06*(1-p));
      if(p>0.4) prot++;
      recalc(t);
    });
    if(prot>0) lines.push(`💪 ${prot} tile${prot>1?'s':''} with spongy soil or a pond nearby held onto water!`);
    else lines.push('😟 The dry soil couldn\'t hold much water…');
    lesson='Soil full of organic matter soaks up rain like a sponge — and ponds share their water. Droughts can\'t beat a living farm.';
  }else if(id==='downpour'){
    bad=true; em='🌧️'; title='Heavy Rain!'; kid='A huge storm pounded the farm all night!';
    let bare=0, safe=0;
    soils.forEach(t=>{
      if(t.crop || t.soil.erosion>55 || treeAdj(t)){
        t.soil.water = clamp(t.soil.water+7); safe++;
      }else{
        t.soil.structure = clamp(t.soil.structure-5);
        t.soil.nutrients = clamp(t.soil.nutrients-4);
        t.soil.erosion   = clamp(t.soil.erosion-4);
        if(typeof dustAwayFromWash==='function' && dustAwayFromWash(t)){
          t.soil.erosion = clamp(t.soil.erosion-6);
          t.soil.structure = clamp(t.soil.structure-6);
        }
        bare++;
      }
      recalc(t);
    });
    state.grid.forEach(t=>{
      if(!t || t.terrain!=='dead') return;
      if(typeof washAdj==='function' && washAdj(t)){
        t.soil.water = clamp((t.soil.water||0)+8);
        recalc(t);
      }else if(typeof dustAwayFromWash==='function' && dustAwayFromWash(t)){
        t.soil.erosion = clamp((t.soil.erosion||0)-5);
        recalc(t);
      }
    });
    if(typeof pulseDryWash==='function') pulseDryWash(state, 36);
    if(safe>0) lines.push(`🌿 ${safe} covered or tree-sheltered tile${safe>1?'s':''} drank the rain safely!`);
    if(bare>0) lines.push(`😟 ${bare} bare tile${bare>1?'s':''} lost some soil to the storm.`);
    // storms flush whatever the land can't hold straight into the river
    let buffers=0; state.grid.forEach(t2=>{ if(t2.terrain==='trees' && waterAdj(t2)) buffers++; });
    const wash = Math.max(0, (bare>0 ? 7 : 2) - buffers*2);
    if(wash>0){
      state.waterQuality = clamp(state.waterQuality - wash);
      lines.push('🟤 Muddy runoff washed into the river…');
    }else{
      lines.push('🌊 Your riverside buffers caught the runoff — the river stayed clean!');
    }
    lesson='Living roots, ground cover and hedgerows hold the soil tight when rain pounds down — and keep the mud out of the river.';
  }else if(id==='pests'){
    bad=true; em='🐛'; title='Pest Invasion!'; kid='Hungry bugs marched onto the farm!';
    let hit=0, safe=0;
    const guarded = f.bio>=45;
    soils.forEach(t=>{
      if(!t.crop) return;
      if(CROPS[t.crop.type].diverse || guarded) safe++;
      else{ t.crop.growth = Math.max(0.05, t.crop.growth-0.22); hit++; }
    });
    if(guarded) lines.push('🐞 Your ladybugs and birds gobbled the pests right up!');
    if(safe>0 && !guarded) lines.push(`🌽 ${safe} diverse tile${safe>1?'s':''} confused the bugs — no damage!`);
    if(hit>0) lines.push(`😟 ${hit} lonely crop${hit>1?'s':''} got munched…`);
    if(hit===0 && safe===0) lines.push('The bugs found nothing to eat and moved on!');
    lesson='A patchwork of different plants confuses pests — and wildlife eats them for free!';
  }else if(id==='duststorm'){
    bad=true; em='🌪️'; title='Dust Storm!'; kid='A wall of dust rolled off the dead flats and swallowed the sky!';
    let hit=0, safe=0;
    soils.forEach(t=>{
      const hayLee = typeof currentHayFold==='function' && currentHayFold() && typeof farmEdgeAdj==='function' && farmEdgeAdj(t);
      if(t.crop || t.soil.erosion>50 || treeAdj(t) || hayLee){ safe++; }
      else{
        t.soil.water = clamp(t.soil.water-6);
        t.soil.om = clamp(t.soil.om-3);
        t.soil.erosion = clamp(t.soil.erosion-3);
        hit++;
      }
      recalc(t);
    });
    if(safe>0) lines.push(`🌿 ${safe} covered tile${safe>1?'s':''} held tight against the wind!`);
    if(hit>0) lines.push(`😟 The storm scoured ${hit} bare tile${hit>1?'s':''}…`);
    lines.push('🏜️ Every DEAD tile you revive makes the storms weaker.');
    lesson='Bare, dead land feeds dust storms. Living roots and hedgerows pin the soil down — heal the land, calm the wind.';
  }else if(id==='gentleRain'){
    em='🌦️'; title='Gentle Rain'; kid='Soft rain fell for three cozy days.';
    soils.forEach(t=>{ t.soil.water = clamp(t.soil.water+8); recalc(t); });
    state.grid.forEach(t=>{   // rain even kisses the dead ground (it helps amendments work)
      if(t.terrain==='dead' && (t.compost>0 || t.crop)){ t.soil.water = clamp(t.soil.water+6); recalc(t); }
    });
    if(typeof pulseDryWash==='function') pulseDryWash(state, 22);
    lines.push('💧 Every tile got a lovely drink.');
    lesson='Slow, gentle water is exactly what living soil loves best.';
  }else if(id==='sunny'){
    em='🌞'; title='Sunny Spell'; kid='A stretch of perfect sunshine!';
    let n=0;
    soils.forEach(t=>{ if(t.crop){ t.crop.growth = Math.min(0.99, t.crop.growth+0.12); n++; } });
    lines.push(n>0 ? `🌱 ${n} crop${n>1?'s':''} shot up in the sunshine!` : 'The open fields soaked up the warmth.');
    lesson='Sunshine is free energy — plants turn it into food for the whole soil web.';
  }else if(id==='gift'){
    em='🎁'; title='Neighborly Gift'; kid='A neighbor loved watching the farm come back — and left a gift!';
    state.coins += 10;
    lines.push('🪙 +10 coins! How kind!');
    lesson='Healthy farms inspire whole neighborhoods.';
  }else if(id==='beeVisit'){
    em='🐝'; title='Wandering Bees'; kid='A cloud of friendly bees buzzed through!';
    soils.forEach(t=>{ if(t.health>45) t.flowers = Math.min(1, t.flowers+0.1); });
    lines.push('🌼 They left extra wildflowers on your healthiest tiles.');
    lesson='Pollinators visit where flowers bloom — and help even more grow.';
  }else if(id==='snow'){
    em='☃️'; title='Snow Blanket'; kid='Thick fluffy snow tucked the whole farm in!';
    soils.forEach(t=>{ t.soil.water = clamp(t.soil.water+6); recalc(t); });
    if(typeof pulseDryWash==='function') pulseDryWash(state, 14);
    lines.push('❄️ Melting snow means spring water for everyone.');
    lesson='Winter is not empty time — the soil rests and stores up for spring.';
  }else return;
  if(bad) SND.uhoh(); else SND.badge();
  showModal(`
    <h2>${em} ${title}</h2>
    <div class="eventbig">${em}</div>
    <div class="eventkid">${kid}</div>
    <div class="eventlines">${lines.map(l=>`<div>${l}</div>`).join('')}</div>
    <div class="lesson">🌱 ${lesson}</div>
    <div class="modalbtns"><button class="mbtn" data-act="close">OK!</button></div>
  `);
  checkBadges(); save(); updateHUD();
}

// ---------------------------------------------------------------- badges & win
function checkBadges(){
  if(homesteadMode || !state || state.homesteadView) return;
  const f = farmStats();
  const earned = [];
  BADGES.forEach(b=>{
    if(state.badges[b.id]) return;
    let ok = false;
    try{ ok = b.check(f); }catch(e){ ok = false; }
    if(!ok) return;
    state.badges[b.id] = true;
    const bonus = b.id==='cleanwater' ? 15 : 5;
    state.coins += bonus;

function campaignAllPlotsCleared(){
  if(!camp || !camp.done) return false;
  for(let i=0;i<LEVELS.length;i++){
    const L = LEVELS[i];
    if(!L || L.id==='valley' || L.leftover || L.buyable) continue; // finale + leftover / bought edge optional
    if(!camp.done[i]) return false;
  }
  return true;
}
/** Next unlocked, uncleared plot after a clear — leftovers only if their neighbor rule is already open. */
function nextUnlockedLevel(fromLv){
  let best = null;
  for(let i=0;i<LEVELS.length;i++){
    if(i===fromLv) continue;
    if(camp && camp.done && camp.done[i]) continue;
    const P = valleyParcelByLvIndex(i);
    if(P && !parcelIsUnlocked(P, camp)) continue;
    if(!P && camp && i>(camp.unlocked|0)) continue;
    if(best==null || i<best) best = i;
  }
  return best==null ? null : LEVELS[best];
}
/** AG — soft campaign progress for journey chrome (plots cleared / total). */

    for(let i=0;i<total;i++) if(camp.done[i]) cleared++;

  const pct = total ? Math.round((cleared / total) * 100) : 0;
  return { cleared, total, pct };
}

    if((b.minLv|0) <= lv) nowB.push(b);
    else laterB.push(b);
  });
  const badgeRow = (b, locked)=>{
    const done = !!state.badges[b.id];
    return `<div class="goalitem ${done?'done':(locked?'todo':'todo')}" style="${locked?'opacity:.55':''}"><div class="gm">${b.em}</div>
      <div>${b.name}${locked?' <span style="font-size:11px;color:var(--soft)">(later)</span>':''}
        <div style="font-size:11.5px;font-weight:600;opacity:.8">${b.desc}</div></div>
      <div style="margin-left:auto">${done?'⭐':(locked?'🔒':'')}</div></div>`;
  };
  const rows = `<div class="sub" style="font-weight:800;color:var(--wood2);margin:10px 0 4px">⭐ Badges you can earn now</div>` +
    nowB.map(b=>badgeRow(b,false)).join('') +
    (laterB.length ? `<div class="sub" style="font-weight:800;color:var(--soft);margin:10px 0 4px">🗺️ Unlocks on later plots</div>` + laterB.map(b=>badgeRow(b,true)).join('') : '');
  const mission = isValleyLevel(state.lv)
    ? `Restore the <b>dying valley</b> into a living ecosystem: revive every 💀 dead tile, bring <b>every tile</b> to 💚 70+ health, restore all ${REGIONS.length} regions, grow Wildness to 60 — and send <b>clean water</b> 🌊 downstream!`
    : `Plot ${state.lv+1} of ${LEVELS.length}: <b>${L.em} ${L.name}</b> — ${L.goalText}`;
  showModal(`
    <h2>⭐ Your Mission</h2>
    <div class="sub">${mission}</div>
    <div class="sub" style="margin-top:-4px">Farm Life ${Math.round(f.avgHealth)} · Wildness ${Math.round(f.bio)}${L.river?` · River 💧${Math.round(state.waterQuality)}`:''} · Healthy (55+) ${f.restored}/${f.totalSoil} ${state.won?'· 🏆 WON!':''}</div>
    ${goalsLit}
    ${plotGoals}
    ${rows}
    <div class="modalbtns">
      <button class="mbtn wood" data-act="reset">🔄 Restart Plot</button>
      <button class="mbtn" data-act="close">Back</button>
    </div>
  `);
}
function resetGame(){
  if(!confirm('Restart this plot from the beginning? (Your journey progress is safe.)')) return;
