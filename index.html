function enterLevel(lv, fresh){
  plotSessionReady = true;
  // Leaving homestead for a plot: restore parked campaign state when possible
  if(homesteadMode){
    serializeHomesteadFromState();
    homesteadMode = false;
    if(plotStateBackup && plotStateBackup.lv===lv && !fresh){
      state = plotStateBackup;
      plotStateBackup = null;
    }else{
      plotStateBackup = null;
    }
  }
  camp.cur = lv;
  // Never soft-reset a plot just because homesteadView was left true
  if(state && state.homesteadView){
    if(plotStateBackup && plotStateBackup.lv===lv && !fresh){
      state = plotStateBackup;
      plotStateBackup = null;
    }else if(!fresh && state.lv===lv){
      state.homesteadView = false;
    }
  }
  if(fresh || !state || state.lv!==lv){
    state = newGame(lv);
    agents = []; wildlife = []; birds = []; worldParts = []; screenParts = [];
    decoIdx = 0; sciOpen = false;
  }
  if(typeof applyPendingShopCoinsToState==='function') applyPendingShopCoinsToState();
  // BH — re-seed goal sparkle map each entry (no fireworks for goals already met)
  if(state){
    state._goalSparkLv = null;
    state._goalSpark = null;
    state._goalSparkReady = false;
  }
  state.homesteadView = false;
  // Apply permanent parcel unlocks into this plot's shop flags
  if(camp.featureUnlocks && state){
    Object.keys(camp.featureUnlocks).forEach(id=>{ if(camp.featureUnlocks[id]) state.unlocks[id] = true; });
  }
  // Ensure stats object always has mission counters (older saves / partial loads)
  if(!state.stats || typeof state.stats!=='object') state.stats = Object.assign({}, DEFAULT_STATS);
  else state.stats = Object.assign({}, DEFAULT_STATS, state.stats);
  inferHerdFromGrid();
  GRID = state.gridSize;
  selected = -1; hovered = -1;
  tool = 'select';
  canvas.classList.remove('tooling');
  closeModal(); closeInfo();
  layout();
  // Valley finale: frame Homestead Vale first (RW-073 / RW-080)
  if(isValleyLevel(lv)){
    state.valeBeaconT = 14;
    if(document.body.classList.contains('reduce-motion')) centerCamera();
    else focusCameraOnTile(3, 5, 1.28);
  }else{
    centerCamera();
  }
  applyLevelUI();
  setOverlay('none');
  farmCache = null;
  updateHUD(); updateClockUI(); updateQuests(); refreshAnchors();
  hideJourney();
  save();
  if(typeof scheduleZoomDiscoverTip==='function') scheduleZoomDiscoverTip();
  if(typeof scheduleSpeedDiscoverTip==='function') scheduleSpeedDiscoverTip();
  // CH — deferred mute tip after Journey/splash delayed it
  if(camp && camp._muteTipPending && !soundOn){
    camp._muteTipPending = false;
    setTimeout(()=>{
      if(soundOn || journeyOpen || modalOpen) return;
      toast('🔇 Starts quiet — first tap wakes the farm, or use 🔊 anytime.', {once:'sound_muted_boot', throttleMs:4000});
    }, 1400);
  }
  if(isValleyLevel(lv) && fresh){
    // BL — valley start-here pocket (barn green corner + shop)
    setTimeout(()=>{
      toast('🏡 Start here — the green pocket by the barn still breathes. Expand outward; 🛒 Shop is open for the rest.', {once:'vale_beacon', throttleMs:4000});
    }, 700);
  }
  // Intro once per level visit. Never after tools used / day advanced / sticky flag.
  // AD — "I've farmed before" skips coaching wall + long intro on every fresh plot
  if(camp && camp.tipsShown && camp.tipsShown.skip_coaching){
    state.tutDone = true;
    state.introSeen = true;
    state._introDismissed = true;
    state._introModalShown = true;
    document.getElementById('tut')?.classList.remove('show','slim');
    if(typeof syncTutOpenClass==='function') syncTutOpenClass();
  }
  const hasPlay = levelHasProgress() || (state.day|0) > 1 || (state.seasonCount|0) > 0;
  const Lnow = typeof LV==='function' ? LV() : null;
  const homeFresh = !!(Lnow && Lnow.id==='home') && !hasPlay && !(camp && camp.tipsShown && camp.tipsShown.skip_coaching);
  if(homeFresh){
    state.introSeen = true;
    state._introDismissed = true;
    state._introModalShown = true;
    if(!state.tutDone) setTut(state.tutStep||0);
    else document.getElementById('tut')?.classList.remove('show','slim');
  }else if(state.introSeen || hasPlay || (camp && camp.tipsShown && camp.tipsShown.skip_coaching)){
    state.introSeen = true; // sticky — never re-prompt mid-plot
    if(!state.tutDone) setTut(state.tutStep||0);
    else document.getElementById('tut').classList.remove('show');
  }else{
    state.introSeen = true; // mark before show so re-entrant paths cannot re-open
    showLevelIntro();
    save();
  }
}
function showLevelIntro(){
  if(!state) return;
  // Hard gates: once-ever this visit, never over active play, never if day already rolling
  if(state._introModalShown) return;
  if(levelHasProgress() || (state.day|0) > 1 || (state.seasonCount|0) > 0){
    state.introSeen = true;
    return;
  }
  // If introSeen was already sticky from a prior dismiss, do not re-show
  if(state.introSeen && state._introDismissed) return;

    if(pileMeat){
      e.preventDefault(); e.stopPropagation();
      compostSurplusMeat(pileMeat.dataset.nstandpile);
    }
  });
  // shop + quest panel
  document.getElementById('btnShop').addEventListener('click', ()=>{ openShop(); SND.pop(); });
  initCottageUI();
  document.getElementById('qHead').addEventListener('click', ()=>{
    const qp = document.getElementById('questPanel');
    qp.classList.toggle('min');
    document.getElementById('qCaret').textContent = qp.classList.contains('min') ? '▲' : '▼';
    SND.pop();
  });
  // keyboard (desktop ship expectations — F2)
  window.addEventListener('keydown', e=>{
    if(e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA' || e.target.isContentEditable) return;
    // Space = pause/play (not while journey/modal/cottage)
    if(e.key===' ' || e.code==='Space'){
      if(cottageOpen || modalOpen || journeyOpen) return;
      e.preventDefault();
      document.getElementById('btnPause').click();
      return;
    }
    if(e.key==='Escape'){
      e.preventDefault();
      // AN — topmost UI stack first (cottage → modal → overlay menu → info → journey → tool → map)
      if(cottageOpen){ exitCottage(); return; }
      if(modalOpen){ closeModal(); return; }
      const ovBar = document.getElementById('overlaybar');
      if(ovBar && ovBar.classList.contains('open')){
        ovBar.classList.remove('open');
        document.getElementById('btnMore')?.classList.remove('on');
        return;
      }
      const info = document.getElementById('infoPanel');
      if(info && info.classList.contains('show')){
        selected = -1;
        if(typeof closeInfo==='function') closeInfo();
        return;
      }
      if(journeyOpen){ hideJourney(); return; }
      // Progressive escape: clear tool first, second Esc → journey map
      if(tool!=='select'){
        tool='select';
        document.querySelectorAll('.tool').forEach(el=>el.classList.toggle('active', el.id==='tool_select'));
        canvas.classList.remove('tooling');
        if(typeof buildPalette==='function') buildPalette();
      }else{
        save(); showJourney();
      }
      return;
    }
    // R = cycle fence/gate/wall facing (yard + campaign fence)
    if((e.key==='r' || e.key==='R') && !modalOpen && !cottageOpen && !journeyOpen){
      if(yardToolOrientable(tool) || tool==='fence'){
        e.preventDefault();
        cycleYardOrient(false);
      }
    }
    if(e.key==='+'||e.key==='='){ cam.zoom=Math.min(CAM_ZOOM_MAX,cam.zoom*1.15); clampCam(); }
    if(e.key==='-'){ cam.zoom=Math.max(fitZoom*0.55,cam.zoom*0.87); clampCam(); }
    // 1–9 select tools from the *visible palette* (campaign TOOLS or homestead catalog)
    const n = parseInt(e.key,10);
    if(n>=1 && n<=9 && !modalOpen && !cottageOpen && !journeyOpen){
      const tools = [...document.querySelectorAll('#palette .tool[data-tool], #palette .tool[id^="tool_"]')]
        .filter(el => el.offsetParent !== null && !el.classList.contains('cant') && el.id !== 'tool_shop');
      // Prefer data-tool order; fall back to TOOLS index
      const byData = tools.map(el => el.dataset.tool || (el.id||'').replace(/^tool_/,''));
      const pick = byData[n-1] || (TOOLS[n-1] && TOOLS[n-1].id);
      if(pick){
        const el = document.getElementById('tool_'+pick) || document.querySelector('[data-tool="'+pick+'"]');
        if(el) el.click();
      }
    }
  });
  // journey button — autosaves, then back to the level map
  document.getElementById('btnJourney').addEventListener('click', ()=>{ save(); SND.pop(); showJourney(); });
  updateHUD();
  updateClockUI();
  updateQuests();
  refreshAnchors();
  if(!bundle) showSplash();     // brand new: title first, then the journey map
  else showJourney();           // returning: straight to the journey (▶ continue)
  if(location.hash==='#journey'){ try{ closeModal(); }catch(e){} showJourney(); }
  if(bundle && resumed && state && !state.homesteadView && !state.levelDone){
    plotSessionReady = true;
  }
  maybeGrantCoinPack();
  applyPendingShopCoinsToState();
  if(plotSessionReady){
    try{ save(); }catch(e){}
    if(typeof updateHUD==='function') updateHUD();
  }
  maybeThankSupporter();
  // N4 — reveal canvas after first layout paint (boot splash fades)
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      document.body.classList.add('booted');
      const boot = document.getElementById('bootSplash');
      if(boot){
        boot.classList.add('hide');
        setTimeout(()=>{ try{ boot.remove(); }catch(e){} }, 450);
      }
      registerPlayShellSW();
    });
  });
  // AL/AN — pause sim when tab hidden (battery); restore only if we auto-paused
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden){ if(typeof fadeAmbientOut==='function') fadeAmbientOut(); }
    else if(soundOn && typeof setAmbientTarget==='function'){ startAmbientBed(); setAmbientTarget(); }
    if(!state || homesteadMode) return;
    if(document.hidden){
      if(!state.paused){
        state._autoPausedByHide = true;
        state.paused = true;
        if(typeof updateClockUI==='function') updateClockUI();
      }
    }else if(state._autoPausedByHide){
      state._autoPausedByHide = false;
      state.paused = false;
      if(typeof updateClockUI==='function') updateClockUI();
      // AN — first return: soft explain (not every tab switch)
      toast('⏸️ Auto-paused while you were away — time is running again.', {once:'auto_pause_away'});
    }
  });
  requestAnimationFrame(frame);
}
function showSplash(){
  // RW-079 / AS: lush title art = hope plate; caption anchors future vs present
  showModal(`
    <h2>🌱 Rootweave</h2>
    <img src="sprites/title_farm.webp" alt="A living valley — the future you're fighting for" style="width:100%; border-radius:14px; border:2px solid var(--line); display:block" onerror="this.style.display='none'">
    <div class="sub" style="text-align:center;margin-top:6px;opacity:.9;font-weight:800">↑ Hope plate — the valley as it can be again</div>
    <div class="eventkid"><b>Right now, the valley is dying.</b> Dust where wheat stood. This is what you're growing back.</div>
    <div class="lesson">🌱 Heal land, field by field. Life returns when you tend it.</div>
    <div class="modalbtns" style="flex-direction:column;gap:8px">
      <button class="mbtn big" data-act="splashgo">Wake the Home Patch 🌱</button>
      <button class="mbtn wood" data-act="splashskip" style="font-size:13.5px">I've farmed before — skip coaching ⏩</button>
      <button type="button" class="mbtn" data-act="about" style="font-size:12.5px;opacity:.9">About &amp; credits</button>
    </div>
    <div class="legal-row" style="margin-top:6px;font-size:12px;opacity:.9">
      <a href="legal/privacy.html">Privacy</a> · <a href="legal/terms.html">Terms</a>
    </div>
  `);
}
/** G2 — experienced-player skip: mark coaching done for the first plot. */
function skipCoachingPath(){
  if(!camp.tipsShown) camp.tipsShown = {};
  camp.tipsShown.skip_coaching = true;
  camp.tipsShown.farmed_before = true;
  // AD — also mark active plot coaching done if already in a level
  if(state && !state.homesteadView){
    state.tutDone = true;
    state.introSeen = true;
    state._introDismissed = true;
    document.getElementById('tut')?.classList.remove('show','slim');
  }
  closeModal();
  showJourney();
  // If they jump straight into a plot later, tut starts done (applyLevelUI reads skip_coaching)
  toast('⏩ Coaching slimmed — tips still appear when you need them.', {once:'skip_coach_ack'});
  save();
}
/** Play PWA — register SW only on http(s). file:// local play must no-op. */
function registerPlayShellSW(){
  try{
    if(typeof navigator==='undefined' || !navigator.serviceWorker) return;
    const proto = (location && location.protocol) || '';
    if(proto!=='http:' && proto!=='https:') return;
    navigator.serviceWorker.register('./sw.js', {scope:'./'}).catch(function(){});
  }catch(e){}
}
window.addEventListener('load', init);
</script>
