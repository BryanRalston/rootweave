    a.v = clampUV(dr>0 ? 0.22 : dr<0 ? 0.78 : 0.50, 0.14, 0.86);

        if(typeof recalc==='function') recalc(t);
      }
    });
    return;
  }
  if(feel==='dry_graze'){
    tiles.forEach(t=>{
      if(typeof isRiverbedT==='function' && isRiverbedT(t)) return;
      if(!leftoverStampLand(t)) return;
      const bank = typeof washAdj==='function' && washAdj(t, s);
      if(t.terrain==='soil' && roll(t,1)<0.52) makeDead(t);
      else if(t.terrain==='dead' && roll(t,1)>0.78) seedSoil(t, 28, 8);
      if(t.terrain==='dead' && !bank && roll(t,2)<0.16) t.feature = 'saltflat';
      if(t.terrain==='dead' || t.terrain==='soil'){
        if(bank){
          t.soil.water = Math.min(t.soil.water||0, 20);
        }else{
          t.soil.erosion = Math.min(t.soil.erosion||30, 16);
          t.soil.water = Math.min(t.soil.water||30, 16);
        }
        if(typeof recalc==='function') recalc(t);

    ensureReachableStockWater(s);
    const g = (s.gridSize|0) || GRID;
    const wantCover = Math.max(4, Math.round((g*g)*0.05));
    let pasture = tiles.filter(t=>typeof leftoverIsPastureCoverT==='function' ? leftoverIsPastureCoverT(t) : false).length;
    const scoreDry = (t)=>{
      let n = 0;
      if(typeof stockDrinkAdj==='function' && stockDrinkAdj(t, s)) n += 10;
      if(t.atlasBiome==='pasture') n += 3;
      if(typeof washAdj==='function' && washAdj(t, s)) n -= 4;
      n += roll(t, 1) * 1.2;
      return n;
    };
    tiles.filter(t=>leftoverPaddockSeatOk(t, g) && t.terrain==='soil').slice().sort((a,b)=>scoreDry(b)-scoreDry(a)).forEach(t=>{
      if(pasture>=wantCover) return;
      if(typeof farmCoverWouldBreakStock==='function' && farmCoverWouldBreakStock(s, t)) return;
      const type = roll(t,3)<0.55 ? 'clover' : 'covercrop';
      t.crop = {type, growth:0.24 + roll(t,4)*0.16, days:2};
      t.deco = null;
      pasture++;

    ensureReachableStockWater(s);
    return;
  }
  if(feel==='river'){
    tiles.forEach(t=>{
      if(!leftoverStampLand(t)) return;
      if(leftoverWetNear(s,t)){

        if(t.terrain==='soil'){

}
function leftoverPlayBox(P){

  // Tall river leftover: sit the square on the south so the wash still meets the stem.
  // The map hotspot stays the full parcel; only the play crop shifts.
  if((P.leftover || P.buyable) && leftoverStampFeelFor(P)==='river' && (P.size.h|0)>g){
    r = (P.origin.r|0) + (P.size.h|0) - g;

}
/** Local (0,0) → atlas cell for this crop. Leftover / deed stamps use leftoverPlayBox. */
function parcelStampBox(P){

    const box = leftoverPlayBox(P);
    if(box) return box;
  }
  if(!P || !P.origin || !P.size) return null;
  return {c:P.origin.c|0, r:P.origin.r|0, w:P.size.w|0, h:P.size.h|0};

function atlasIsHedgeWood(A){

/** Atlas trees / brush already painted just outside (or on) a play-grid edge. */
function leftoverEdgeAtlasTrees(box, side){

  let n = 0;

    for(let c=box.c;c<box.c+box.w;c++){
      if(atlasIsHedgeWood(atlasGet(c, box.r-1)) || atlasIsHedgeWood(atlasGet(c, box.r))) n++;
    }
  }else if(side==='w'){
    for(let r=box.r;r<box.r+box.h;r++){

}
/** Prefer N or NW when the painting already has trees there; else the ridge-facing (north) edge. */
function leftoverWeatherSide(P){

function leftoverWantsWindbreak(P){
  if(!P || P.kind!=='plot') return false;

  if(P.id==='home_garden' || P.lvIndex===0) return false;

function farmEdgeSeatOk(t){

  if(t.feature==='path' || t.feature==='swale' || t.feature==='saltflat') return false;

}
function farmEdgeWouldBreakStock(s, t){

  if(!stockStandOk(t) || !stockDrinkReachable(s)) return false;

  const ok = stockDrinkReachable(s);
  t.terrain = old;

/** Cover by the drink may hold the bank — not the last stand the herd can use. */
function farmCoverWouldBreakStock(s, t){

  if(!stockStandOk(t) || !stockDrinkReachable(s)) return false;

function seatFarmEdgeTile(s, t, kind){

  if(t.terrain==='trees'){
    t.farmEdge = t.farmEdge || kind;
    return true;
  }
  if(!farmEdgeSeatOk(t)) return false;

/** Thin weather-side tree strip on leftover open fields. Existing atlas trees stay. */
function seatLeftoverWindbreak(s, P){

  const g = leftoverPlayGrid(P.size && P.size.w, P.size && P.size.h);
  const side = leftoverWeatherSide(P);
  if(side==='n' || side==='nw'){
    for(let c=0;c<g;c++) leftoverMarkPlayEdge(s, c, 0, 'windbreak');
  }
  if(side==='nw'){
    const tongue = Math.max(2, Math.min(3, (g/4)|0 || 2));

/** Shared atlas edge direction from A toward B, or null if they do not touch. */
function parcelsShareDir(A, B){
  const a = typeof parcelAtlasBox==='function' ? parcelAtlasBox(A) : null;
  const b = typeof parcelAtlasBox==='function' ? parcelAtlasBox(B) : null;
  if(!a || !b) return null;
  const overlapX = Math.min(a.c+a.w, b.c+b.w) - Math.max(a.c, b.c);
  const overlapY = Math.min(a.r+a.h, b.r+b.h) - Math.max(a.r, b.r);
  if(b.r+b.h === a.r && overlapX>0) return 'n';
  if(a.r+a.h === b.r && overlapX>0) return 's';
  if(b.c+b.w === a.c && overlapY>0) return 'w';
  if(a.c+a.w === b.c && overlapY>0) return 'e';
  return null;
}
function leftoverPlayEdgeCells(g, side){
  const out = [];
  if(side==='n'){ for(let c=0;c<g;c++) out.push({c, r:0, dc:0, dr:-1}); }
  else if(side==='s'){ for(let c=0;c<g;c++) out.push({c, r:g-1, dc:0, dr:1}); }
  else if(side==='w'){ for(let r=0;r<g;r++) out.push({c:0, r, dc:-1, dr:0}); }
  else if(side==='e'){ for(let r=0;r<g;r++) out.push({c:g-1, r, dc:1, dr:0}); }
  return out;
}
function leftoverAtlasHedgeToward(P, cell){
  if(!P || !P.origin || !cell) return false;
  const box = typeof leftoverPlayBox==='function' ? leftoverPlayBox(P) : null;
  const oc = box ? box.c : (P.origin.c|0), or = box ? box.r : (P.origin.r|0);
  const ac = oc+cell.c, ar = or+cell.r;
  if(atlasIsHedgeWood(atlasGet(ac, ar))) return true;
  for(let k=1;k<=4;k++){
    if(atlasIsHedgeWood(atlasGet(ac+cell.dc*k, ar+cell.dr*k))) return true;
  }
  return false;
}
/** 1-tile hedgerow on shared field edges only where the atlas already paints hedge / woodlot. */
function seatLeftoverHedgerowSeams(s, P){
  if(!s || !s.grid || !P || P.kind!=='plot') return;
  if(!P.leftover && !P.buyable) return;
  if(P.id==='home_garden' || P.lvIndex===0) return;
  const g = leftoverPlayGrid(P.size && P.size.w, P.size && P.size.h);
  if(typeof VALLEY_PARCELS==='undefined') return;
  VALLEY_PARCELS.forEach(N=>{
    if(!N || N.id===P.id || N.kind!=='plot') return;
    const side = parcelsShareDir(P, N);
    if(!side) return;
    leftoverPlayEdgeCells(g, side).forEach(cell=>{
      if(!leftoverAtlasHedgeToward(P, cell)) return;
      leftoverMarkPlayEdge(s, cell.c, cell.r, 'hedgerow');

function seatLeftoverFarmEdges(s, P){

/** Keep atlas woodlot / ridge high pond on leftover stamps that already have them. */
function ensureRidgeWoodlotKeep(s, P){
  if(!s || !s.grid || !P) return;

  if(typeof leftoverIsWoodlotRidge==='function' ? !leftoverIsWoodlotRidge(P) : (leftoverStampFeelFor(P)!=='woodlot')) return;
  s.grid.forEach(t=>{
    if(!t) return;
    const A = (typeof atlasGet==='function' && t.atlasC!=null) ? atlasGet(t.atlasC, t.atlasR) : null;
    if(A && A.water==='pond_site'){
      t.terrain = 'pond';

      t.terrain = 'trees';

/** Keep painted atlas marsh ponds on marsh / wet crops. Do not invent a river. Home Patch stays off. */
function ensureMarshPondKeep(s, P){

    if(A && A.water==='pond_site' && A.biome==='marsh'){

      if(typeof carveClear==='function') carveClear(t);

/** Leftover / bought-edge land: atlas crop, then a thin land-tied dress, then farm edges. */
function genLeftoverStamp(s){

    if(typeof ensureMarshPondKeep==='function') ensureMarshPondKeep(s, P);

  }

function soilTiles(){ return state.grid.filter(t=>t.terrain==='soil'); }
function isWaterT(t){ return t.terrain==='pond' || t.terrain==='water'; }
function isWetT(t){ return t.terrain==='pond' || t.terrain==='water' || t.terrain==='wetland'; }

const BUILDINGS = ['market','silo','greenhouse','beehive','orchard','raintank','wetland','stable',

const BUILD_SET = new Set(BUILDINGS);
/** Live mission counters — never trust only a one-shot stat if the grid disagrees. */

  const live = state.grid.filter(t=>t.crop && t.crop.type==='sisters').length;

function farmStats(){
  if(!state || !state.grid){
    return {avgHealth:0, restored:0, thriving:0, totalSoil:0, dead:0, bio:0, maxMicrobial:0, ponds:0, trees:0, b:{}};
  }
  let h=0, restored=0, thriving=0, micro=0, flowers=0, diverse=0, maxMicrobial=0, n=0, ponds=0, trees=0, dead=0;
  const bcounts = {};
  state.grid.forEach(t=>{
    if(t.terrain==='pond'){ ponds++; return; }
    if(t.terrain==='trees'){ trees++; return; }
    if(BUILD_SET.has(t.terrain)){ bcounts[t.terrain] = (bcounts[t.terrain]||0)+1; return; }
    if(t.terrain==='dead'){ dead++; n++; h += t.health; return; }
    if(t.terrain!=='soil') return;
    n++;
    h += t.health;
    micro += t.soil.microbial;
    flowers += t.flowers;
    // "Healthy / Restored" = soil the player can feel (matches plot goals at 55+)
    if(t.health>=55) restored++;
    if(t.health>=70) thriving++;
    if(t.crop && CROPS[t.crop.type].diverse) diverse++;
    if(t.soil.microbial>maxMicrobial) maxMicrobial = t.soil.microbial;
  });
  const nAlive = Math.max(1, n-dead);
  const avgH = n? h/n : 0, avgMicro = micro/nAlive;

          + (restored/Math.max(1,n))*30 + trees*2.6 + ponds*2.2
          + (bcounts.beehive||0)*3 + (bcounts.wetland||0)*2.5 + (bcounts.orchard||0)*2.2
          + (bcounts.berrybush||0)*1.2 + (bcounts.birdhouse||0)*1.5 + (bcounts.mushroom||0)*1
          + (bcounts.stable||0)*1;
  if(state && state.waterQuality>=70) bio += 5;      // a clean river hums with life
  bio = Math.max(0, Math.min(100, bio));
  return {avgHealth:avgH, restored, thriving, totalSoil:n, dead, bio, maxMicrobial, ponds, trees, b:bcounts};
}

// AP — soft boot progress for splash (pending sprite requests)
let _spritePend = 0, _spriteDone = 0;
function _spriteProgressTick(){
  const el = document.querySelector('#bootSplash .boot-sub');
  if(!el || _spritePend <= 0) return;
  const pct = Math.min(99, Math.round((_spriteDone / _spritePend) * 100));
  el.textContent = pct >= 96 ? 'ready…' : ('loading art ' + pct + '%');
}
/** Register sprite; later successful loads with higher gen win (avoids webp/png race). */
function registerSprite(name, src, gen){
  const g = gen|0;
  const img = new Image();
  _spritePend++;
  img.onload = ()=>{
    _spriteDone++;
    _spriteProgressTick();
    if((SPRITES._gen && SPRITES._gen[name]|0) > g) return; // newer registration already applied
    if(!SPRITES._gen) SPRITES._gen = {};
    SPRITES._gen[name] = g;
    SPRITES[name] = img;
    if(name===VALLEY_ATLAS_SKIN || name==='bg_hills_1' || name==='bg_hills' || String(name).indexOf('house_')===0){
      if(typeof nudgeJourneyAtlasPaint==='function') nudgeJourneyAtlasPaint();
    }
  };
  // AB — soft-fail missing assets: log once per path (no console spam on every paint)
  img.onerror = ()=>{
    _spriteDone++;
    _spriteProgressTick();
    if(!window.__rwSpriteMiss) window.__rwSpriteMiss = Object.create(null);
    const key = String(src||'').split('?')[0];
    if(key && !window.__rwSpriteMiss[key]){
      window.__rwSpriteMiss[key] = true;
      try{ console.warn('[Rootweave] sprite miss (once):', key, '→', name); }catch(e){}
    }
    /* leave previous gen if any */
  };
  img.src = src;
}

function drawFootShadow(x, y, rx, ry){
  ctx.save();

  ctx.globalAlpha = 0.10;
  ctx.fillStyle = '#1a1008';
  ctx.beginPath();
  ctx.ellipse(x, y + 0.6, (rx||8) * 1.12, (ry || rx * 0.36) * 1.15, 0, 0, 6.29);
  ctx.fill();
  ctx.globalAlpha = 0.16;
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry || rx * 0.36, 0, 0, 6.29);
  ctx.fill();
  ctx.restore();

  const pad = 0.55; // seal seams; clip keeps this from stacking as double rims
  ctx.save();
  // Exact iso block: top diamond + SW/SE skirts (matches TILE_W/H/TDEPTH)
  const N = {x:o.x, y:o.y};
  const E = {x:o.x + TW2, y:o.y + TH2};
  const S = {x:o.x, y:o.y + TILE_H};
  const W = {x:o.x - TW2, y:o.y + TH2};
  ctx.beginPath();
  ctx.moveTo(N.x, N.y - pad * 0.25);
  ctx.lineTo(E.x + pad, E.y);
  ctx.lineTo(E.x + pad, E.y + TDEPTH + pad);
  ctx.lineTo(S.x, S.y + TDEPTH + pad);
  ctx.lineTo(W.x - pad, W.y + TDEPTH + pad);
  ctx.lineTo(W.x - pad, W.y);
  ctx.closePath();
  ctx.clip();
  const prevSmooth = ctx.imageSmoothingEnabled;
  const prevQual = ctx.imageSmoothingQuality;
  ctx.imageSmoothingEnabled = true;
  if(prevQual !== undefined) ctx.imageSmoothingQuality = 'high';
  // Draw locked to N tip; tiny pad matches clip expand
  ctx.drawImage(gimg, o.x - w/2 - pad * 0.2, o.y - pad * 0.2, w + pad * 0.4, h + pad * 0.4);
  ctx.imageSmoothingEnabled = prevSmooth;
  if(prevQual !== undefined) ctx.imageSmoothingQuality = prevQual;
  ctx.restore();
}
/** Floor decos: same plane, slight inset so they sit in the cell not over seams. */
function drawFloorDecoArt(img, o, widthScale){
  if(!img) return;
  const scale = widthScale == null ? 0.92 : widthScale;
  const w = TILE_W * scale;
  const h = (TILE_H + TDEPTH) * scale;
  // Keep top face locked to diamond: N tip slightly inset
  const iy = o.y + TILE_H * (1 - scale) * 0.35;
  ctx.drawImage(img, o.x - w/2, iy, w, h);
}

function play(notes, opts){
  if(!soundOn) return;
  ensureAudio();
  if(!actx) return;
  opts = opts || {};
  try{
    if(actx.state==='suspended') actx.resume();
    const t0 = actx.currentTime;
    const vol = Math.min(SFX_MASTER + 0.004, opts.vol != null ? opts.vol : SFX_MASTER);
    const typ = opts.type || 'triangle';
    notes.forEach(([f,off,dur])=>{
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = typ; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0+off);
      g.gain.linearRampToValueAtTime(vol, t0+off+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+off+Math.max(0.04, dur));
      let node = o;
      if(opts.filter==='lowpass'){
        const ftr = actx.createBiquadFilter();
        ftr.type = 'lowpass';
        ftr.frequency.value = opts.cutoff != null ? opts.cutoff : 420;
        ftr.Q.value = 0.7;
        o.connect(ftr); node = ftr;
      }
      node.connect(g).connect(actx.destination);
      o.start(t0+off); o.stop(t0+off+dur+0.05);
    });
    if(opts.noise) playNoiseTick(opts.noise);
  }catch(e){}
}
function playNoiseTick(spec){
  if(!soundOn || !actx) return;
  try{
    const s = spec===true ? {} : (spec||{});
    const dur = s.dur != null ? s.dur : 0.042;
    const vol = Math.min(0.04, s.vol != null ? s.vol : 0.028);
    const n = Math.max(32, (actx.sampleRate * dur)|0);
    const buf = actx.createBuffer(1, n, actx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    const src = actx.createBufferSource();
    src.buffer = buf;
    const hp = actx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = s.hp != null ? s.hp : 1700;
    const g = actx.createGain();
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    src.connect(hp).connect(g).connect(actx.destination);
    src.start();
  }catch(e){}
}

function startAmbientBed(){
  if(!soundOn || prefersQuietMotion()) return;
  ensureAudio();
  if(!actx || amb.started) return;
  try{
    if(actx.state==='suspended') actx.resume();
    const master = actx.createGain();
    master.gain.value = 0.0001;
    master.connect(actx.destination);
    amb.gain = master;
    amb.started = true;
    const nLen = Math.max(actx.sampleRate, (actx.sampleRate*2)|0);
    const nBuf = actx.createBuffer(1, nLen, actx.sampleRate);
    const nd = nBuf.getChannelData(0);
    let last = 0;
    for(let i=0;i<nLen;i++){
      last = last*0.97 + (Math.random()*2-1)*0.03;
      nd[i] = last;
    }
    const wind = actx.createBufferSource();
    wind.buffer = nBuf; wind.loop = true;
    const wf = actx.createBiquadFilter();
    wf.type = 'lowpass'; wf.frequency.value = 360;
    const wg = actx.createGain(); wg.gain.value = 0.20;
    wind.connect(wf).connect(wg).connect(master);
    wind.start();
    [98, 147, 196.2].forEach((f,i)=>{
      const o = actx.createOscillator();
      o.type = 'sine';
      o.frequency.value = f * (i===1 ? 1.004 : 1);
      const lp = actx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 400;
      const g = actx.createGain();
      g.gain.value = i===0 ? 0.16 : 0.09;
      o.connect(lp).connect(g).connect(master);
      o.start();
    });
  }catch(e){ amb.started = false; amb.gain = null; }
}
function fadeAmbientOut(){
  if(!amb.gain || !actx) return;
  try{
    const t = actx.currentTime;
    amb.gain.gain.cancelScheduledValues(t);
    amb.gain.gain.linearRampToValueAtTime(0.0001, t+0.28);
  }catch(e){}
}
function setAmbientTarget(){
  if(!amb.started || !amb.gain || !actx) return;
  const heavy = !!(typeof modalOpen!=='undefined' && modalOpen)
    || !!(typeof journeyOpen!=='undefined' && journeyOpen)
    || !!(typeof cottageOpen!=='undefined' && cottageOpen);
  const hidden = typeof document!=='undefined' && document.hidden;
  let want = 0;
  if(soundOn && !prefersQuietMotion() && !hidden && !heavy){
    const f = (typeof farmCache!=='undefined' && farmCache) || (typeof farmStats==='function' && state ? farmStats() : null) || {bio:18, avgHealth:38};
    const wild = Math.max(0, Math.min(1, (f.bio||0)/80));
    const hlth = Math.max(0, Math.min(1, ((f.avgHealth||38)-18)/70));
    want = 0.016 + (wild*0.55 + hlth*0.45)*0.028; // still very quiet, under SFX_MASTER
  }

    const t = actx.currentTime;

  }catch(e){}
}
function tickAmbientBirds(){
  if(!soundOn || !actx || !amb.gain || prefersQuietMotion()) return;
  if(document.hidden) return;

    o.frequency.exponentialRampToValueAtTime(Math.max(900, f0*0.72), t0+0.11);

    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(0.011, t0+0.018);

function tileWorld(i){

function floater(i, text, color, size){
  // H4 — hard floater budget (never more than 2 labels)
  const FLOAT_CAP = 2;
  let floatCount = 0;
  for(let k=0;k<worldParts.length;k++) if(worldParts[k].kind==='float') floatCount++;
  if(floatCount >= FLOAT_CAP){
    for(let k=0;k<worldParts.length;k++){
      if(worldParts[k].kind==='float'){ worldParts.splice(k,1); break; }
    }
  }
  // Merge identical spam into one louder line (match base text without ×N)
  const baseText = String(text).replace(/\s*×\d+$/,'').trim();
  for(let k=worldParts.length-1;k>=0;k--){
    const p0 = worldParts[k];
    if(p0.kind!=='float' || p0.age>=0.45) continue;
    const pBase = String(p0._base || p0.text || '').replace(/\s*×\d+$/,'').trim();
    if(pBase === baseText){
      p0.age = 0; p0.life = 1.15;
      p0._base = baseText;
      p0._n = (p0._n||1)+1;
      p0.text = baseText + ' ×' + p0._n;
      return;
    }
  }
  const p = tileWorld(i);
  worldParts.push({kind:'float', x:p.x, y:p.y-10, vy:-30, age:0, life:1.15, text, color:color||'#fff', size:size||15, _n:1, _base:baseText});
}

const revivePopAt = Object.create(null);
const REVIVE_POP_MS = 420;
function startRevivePop(i){
  if(typeof prefersQuietMotion==='function' && prefersQuietMotion()) return;
  revivePopAt[i] = (typeof performance!=='undefined' && performance.now) ? performance.now() : Date.now();
}
function revivePopAmt(i){
  const t0 = revivePopAt[i];
  if(t0==null) return 0;
  const now = (typeof performance!=='undefined' && performance.now) ? performance.now() : Date.now();
  const u = (now - t0) / REVIVE_POP_MS;
  if(u >= 1){ delete revivePopAt[i]; return 0; }
  return Math.sin(Math.max(0, Math.min(1, u)) * Math.PI);
}
function withRevivePop(t, i, drawFn, glow){
  const pop = revivePopAmt(i);
  if(pop <= 0.01){ drawFn(); return; }
  const o = tileOrigin(t);

  ctx.translate(cx, cy);
  ctx.scale(1 + pop * 0.18, 1 + pop * 0.18);

    ctx.globalAlpha = pop * 0.40;
    diamondPath(o.x, o.y);

function updateParts(list, dt){
  for(let i=list.length-1;i>=0;i--){
    const p = list[i];
    p.age += dt;
    if(p.age >= p.life){ list.splice(i,1); continue; }
    if(p.kind==='float'){ p.y += p.vy*dt; }
    else if(p.kind==='dot' || p.kind==='conf' || p.kind==='dust'){
      p.vy += p.g*dt; p.x += p.vx*dt; p.y += p.vy*dt;
      if(p.kind==='conf') p.rot += p.vr*dt;
    }
  }

function drawParts(list){
  list.forEach(p=>{
    const k = 1 - p.age/p.life;
    if(p.kind==='float'){
      ctx.globalAlpha = Math.min(1, k*1.6);
      ctx.font = `800 ${p.size}px "Segoe UI",sans-serif`;
      ctx.textAlign = 'center';
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(40,30,10,.55)';
      ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x, p.y);
      ctx.textAlign = 'left';
    }else if(p.kind==='dot'){
      ctx.globalAlpha = k;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.29); ctx.fill();
    }else if(p.kind==='dust'){
      ctx.globalAlpha = k*0.5;
      ctx.fillStyle = p.color || 'rgba(190,168,128,.7)';
      ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r||1.4, (p.r||1.4)*0.55, 0, 0, 6.29); ctx.fill();
    }else if(p.kind==='ring'){
      const sc = p.scale||1;
      ctx.globalAlpha = k*0.9;
      ctx.strokeStyle = p.color; ctx.lineWidth = sc>1 ? 3.2 : 2.5;
      ctx.beginPath(); ctx.ellipse(p.x, p.y, (6+(p.age/p.life)*34)*sc, (3+(p.age/p.life)*17)*sc, 0, 0, 6.29); ctx.stroke();
    }else if(p.kind==='conf'){
      ctx.globalAlpha = Math.min(1, k*2);
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  });
}

// ---------------------------------------------------------------- live sim
// WATER QUALITY — what the farm's practices deserve, 0..100. The river drifts
// toward this target. Bare soil, monocrops and riverside grazing muddy it;
// cover crops, healthy soil, ponds and ESPECIALLY riparian buffers clean it.
function computeWaterTarget(){
  let score = 50, buffers = 0, risk = 0;
  state.grid.forEach(t=>{
    if(t.terrain==='trees' || t.terrain==='orchard'){ if(waterAdj(t)) buffers++; return; }
    if(t.terrain==='pond'){
      score += (typeof isMarshPondT==='function' && isMarshPondT(t)) ? 3 : 2; // marsh ponds filter a little before the stem
      return;
    }
    if(t.terrain==='wetland'){ score += waterAdj(t) ? 8 : 4; return; }   // nature's kidney
    if(t.terrain==='raintank'){ score += 1; return; }
    if(t.terrain==='dead'){
      if(waterAdj(t)) risk += 0.15;                         // dust & crust sliding in
      score -= 0.08;
      return;
    }
    if(t.terrain!=='soil') return;
    if(t.crop){
      const c = CROPS[t.crop.type];
      score += c.cover ? 0.5 : c.diverse ? 0.3 : -0.5;      // clover & sisters vs lonely wheat

    if(t.soil.erosion<30) score -= 0.15;
    if(typeof riparianAdj==='function' && riparianAdj(t)) score += 0.4; // beds behind the buffer filter a little
    const marshFeed = typeof marshPondFeedAdj==='function' && marshPondFeedAdj(t);
    const marshShed = typeof shedsTowardMarshPond==='function' && shedsTowardMarshPond(t);
    if(marshFeed || marshShed) score += marshFeed ? 0.22 : 0.10; // catchment settles in the pond first

      if(t.graze && t.graze.kind!=='duckT') risk += marshFeed ? 0.45 : 1;      // hooves on the bank (ducks belong)
      if(t.graze && t.graze.kind==='duckT') score += 1;
      if(t.crop && !CROPS[t.crop.type].diverse) risk += marshFeed ? 0.25 : 0.5;
      if(!t.crop && !t.graze && t.health<40) risk += marshFeed ? 0.28 : 0.6;   // mud sliding straight in
      if(liveBank && !t.crop && !t.graze){

function wakeDeadTile(t, i){

  t.terrain = 'soil';

  const isFirstEver = !t.revivedOnce && !(state.stats && state.stats.revived);
  if(!t.revivedOnce){
    t.revivedOnce = true;
    state.stats.revived = (state.stats.revived|0) + 1;
  }
  if(wasSalt) state.stats.saltRevived = (state.stats.saltRevived||0)+1;
  floater(i, '🌅 REVIVED!', '#ffe89a', 17);
  burst(i, '#c8f0a0', 14); ringAt(i, '#c8f0a0');

  if(typeof haptic==='function') haptic('revive');

function maybeHomeReviveMercy(){
  if(!state || homesteadMode || state.levelDone || state.paused) return false;
  const L = typeof LV==='function' ? LV() : null;
  if(!L || L.id!=='home') return false;
  if(typeof countRevived==='function' ? countRevived()>0 : (state.stats.revived|0)>0) return false;
  if(state._homeFedAt==null) return false;
  if(state._homeReviveMercy) return false;
  const now = (state.day|0) + (state.dayFrac||0);
  if(now - state._homeFedAt < 1) return false;
  let best = -1, bestS = -1;
  state.grid.forEach((t,i)=>{
    if(t.terrain!=='dead') return;
    const treated = (t.playerFed|0)>0 || (t.compost||0)>0 || !!(t.crop);
    if(!treated) return;
    const s = (t.playerFedAmt||0) + (t.compost||0)*2 + (t.crop?12:0) + (t.playerFed||0)*4;
    if(s > bestS){ bestS = s; best = i; }
  });
  if(best<0) return false;
  state._homeReviveMercy = true;
  const t = state.grid[best];
  SOIL_ATTRS.forEach(k=>{ t.soil[k] = Math.max(t.soil[k]||0, 36); });
  if(typeof recalc==='function') recalc(t);
  return wakeDeadTile(t, best);
}
/** After the taught Home loop (revive + Sisters), the last healthy tiles should catch up. */
function maybeHomeHealthMercy(){
  if(!state || homesteadMode || state.levelDone || state.paused) return false;
  const L = typeof LV==='function' ? LV() : null;
  if(!L || L.id!=='home') return false;
  if(state._homeHealthMercy) return false;
  const rev = typeof countRevived==='function' ? countRevived() : (state.stats.revived|0);
  const sis = typeof countSistersPlanted==='function' ? countSistersPlanted() : (state.stats.sistersPlanted|0);
  if(rev < 4 || sis < 3) return false;
  const have = typeof countHealthyTiles==='function' ? countHealthyTiles(55) : 0;
  if(have >= 10) return false;
  const now = (state.day|0) + (state.dayFrac||0) + ((state.seasonCount|0)*DAYS_PER_SEASON);
  if(now < 8) return false;

  const almost = [];
  state.grid.forEach(t=>{
    if(t.terrain==='soil' && (t.health|0) >= 48 && (t.health|0) < 55) almost.push(t);
  });
  if(!almost.length) return false;
  almost.sort((a,b)=>(b.health||0)-(a.health||0));
  const t = almost[0];
  SOIL_ATTRS.forEach(k=>{ t.soil[k] = Math.max(t.soil[k]||0, 56); });
  if(typeof recalc==='function') recalc(t);
  state._homeHealthMercy = true;
  toast('💚 A neighboring bed caught the heart.', {once:'home_health_mercy', throttleMs:4000});
  if(typeof updateQuests==='function') updateQuests();
  if(typeof updateHUD==='function') updateHUD();
  return true;
}
// dd = game-days elapsed this frame (delta-time scaled; frame-rate independent)
function simStep(dt){
  const dd = dt / DAY_LEN;
  const f = farmCache || farmStats();
  const sn = SEASONS[state.season];
  const lvB = LV().regen || 1;           // early plots heal a touch faster — gentler lessons
  state.tod = (state.tod + dt/TOD_CYCLE) % 1;        // the sun wheels overhead
  state.grid.forEach((t,i)=>{
    // ---- DEAD GROUND never heals itself — only the player's care wakes it.
    // Remediation succession: compost / pioneer cover crops / goats (+ nearby
    // water helps the medicine work) raise it until it crosses into workable soil.
    if(t.terrain==='riverbed'){
      if(typeof decayWashMoisture==='function') decayWashMoisture(t, dd);
      return;
    }
    if(t.terrain==='dead'){
      let feed = 0;
      const homeWake = !!(LV() && LV().id==='home');
      if(t.compost>0){ feed += (t.feature==='saltflat'?0.55:1.05) * (homeWake?2.2:1); t.compost = Math.max(0, t.compost-dd); }
      if(t.crop){                                    // pioneer roots cracking the crust
        feed += (t.feature==='saltflat'?0.5:0.75) * (homeWake?2.0:1);
        t.crop.growth += CROPS[t.crop.type].growPerDay * Math.max(sn.growMult,0.5) * 0.8 * dd;
        if(t.crop.growth >= 1) harvestCrop(t, i);
      }
      if(t.graze){                                   // goats browsing the dead brush — they stay
        const g = hydrateGraze(t.graze);
        feed += 0.5 * herdStock(grazeStockN(g)) * (hasFence(t)?1.5:1);
        tickGrazeStay(g, dd);

        tickGrazeYield(t, i, dd);
      }
      if(feed>0){
        feed *= lvB;

        SOIL_ATTRS.forEach(k=>{
          let d = feed;
          if(t.crop && (k==='om'||k==='microbial'||k==='erosion')) d *= 1.4;
          t.soil[k] = clamp(t.soil[k] + d*dd);

      }
      if(typeof decayWashMoisture==='function') decayWashMoisture(t, dd);
      if(typeof dustAwayFromWash==='function' && dustAwayFromWash(t)){
        t.soil.erosion = clamp((t.soil.erosion||0) - 0.08*dd);
        t.soil.water = clamp((t.soil.water||0) - 0.10*dd);
      }else if(typeof washAdj==='function' && washAdj(t) && (t.washBankPulse||0)>6){
        t.soil.water = clamp((t.soil.water||0) + 0.07*dd);

    }
    if(t.terrain!=='soil') return;

      const g = hydrateGraze(t.graze);
      const fm = hasFence(t) ? 1.5 : 1;              // paddock fences: rotational magic
      const apply = (rates, mult)=>{ SOIL_ATTRS.forEach(k=>{ t.soil[k] = clamp(t.soil[k] + rates[k]*(mult||1)*fm*dd); }); };
      tickGrazeStay(g, dd);
      const overAt = grazeOverDays(g);
      const sm = herdStock(grazeStockN(g));
      if(g.stay >= overAt){
        SOIL_ATTRS.forEach(k=>{

          if(d) t.soil[k] = clamp(t.soil[k] + d*sm*dd);
        });
        if(!g.overWarned){
          g.overWarned = true;
          floater(i, 'overgrazed', '#e8a070');
        }
      }else if(g.kind==='team'){
        apply(GRAZE.cattle.rates, herdStock(grazeKindHeads(g,'cattle')));
        apply(GRAZE.chicken.rates, SYNERGY_MULT * herdStock(grazeKindHeads(g,'chicken')));
      }else if(g.kind==='chicken') apply(GRAZE.chicken.rates, (g.synergy?SYNERGY_MULT:1) * herdStock(grazeKindHeads(g,'chicken')));
      else if(GRAZE[g.kind]) apply(GRAZE[g.kind].rates, herdStock(grazeKindHeads(g, g.kind)));

      t.sinceGraze = Math.min(999, (t.sinceGraze||999)+dd);

    if(t.compost>0){ base += 0.35; t.compost = Math.max(0, t.compost-dd); }
    const nearWorm = buildNear(t,'wormfarm',1), nearMush = buildNear(t,'mushroom',1);
    SOIL_ATTRS.forEach(k=>{
      let d = base;
      if(t.crop){
        const c = CROPS[t.crop.type];
        d = c.diverse ? 0.6*sn.regenMult*lvB : -0.12;   // diversity builds; mono extracts
        if(typeof currentHayFold==='function' && currentHayFold() && t.crop.type==='wheat'){

        }
        if((k==='om'||k==='microbial') && c.diverse) d *= 1.4;
        if(c.cover && (k==='om'||k==='microbial'||k==='erosion')) d *= 1.5;
        if(t.compost>0) d += 0.35;
      }
      if(k==='water' && pondNear(t)) d += 0.09;      // ponds, wells & tanks keep ground moist
      if(k==='erosion' && treeAdj(t)) d += 0.08;     // hedgerows shelter the soil
      if(k==='microbial' && treeAdj(t)) d += 0.03;
      if(typeof farmEdgeAdj==='function' && farmEdgeAdj(t)){

      }

        const atDrink = typeof stockDrinkAdj==='function' && stockDrinkAdj(t);
        if(atDrink){
          const hold = t.crop && CROPS[t.crop.type] && CROPS[t.crop.type].cover;
          const g = t.graze;
          const over = !!(g && (g.stay||0) >= (typeof grazeOverDays==='function' ? grazeOverDays(g) : 99));
          if(k==='erosion'){
            if(hold) d += 0.08;                      // clover / cover by the drink holds the bank
            else if(over || !t.crop) d -= 0.06;      // overgraze / bare soil at the trough tears
          }
          if(k==='om'){
            if(hold) d += 0.02;
            else if(over) d -= 0.05;
          }
        }
      }
      if(typeof currentMeadowFold==='function' && currentMeadowFold()){
        const bank = typeof leftoverWetNear==='function' && leftoverWetNear(state, t);
        if(k==='water'){
          if(bank) d += 0.07;                        // wet banks hold water
          else if(typeof leftoverMeadowDryAway==='function' && leftoverMeadowDryAway(t, state)) d -= 0.05;
        }
      }
      if(typeof riparianAdj==='function' && riparianAdj(t)){
        if(k==='erosion') d += 0.05;                 // bank buffer: less soil into the river
      }
      if(typeof swaleDownhillAdj==='function' && swaleDownhillAdj(t)){
        if(k==='water') d += 0.05;                   // contour holds a little water for the beds
      }
      if(typeof highPondDownhillAdj==='function' && highPondDownhillAdj(t)){
        if(k==='water') d += 0.05;                   // ridge high pond feeds the downhill fields
      }
      if(typeof marshPondFeedAdj==='function' && marshPondFeedAdj(t)){
        if(k==='erosion') d += 0.04;                 // pond bank holds a little dirt out of the river
      }
      if(k==='water' && typeof washAdj==='function' && washAdj(t) && (t.washBankPulse||0)>6){
        d += 0.06;                                   // wash bank holds last rain a little longer
      }
      if(typeof dustAwayFromWash==='function' && dustAwayFromWash(t)){
        if(k==='erosion') d -= 0.06;                 // bare dust away from the wash will not hold
        if(k==='water') d -= 0.04;
      }
      if(k==='microbial' && nearWorm) d += 0.12;     // the worm army
      if((k==='om'||k==='microbial') && nearMush) d += 0.07;  // fungal threads
      t.soil[k] = clamp(t.soil[k] + d*dd);
    });
    if(typeof decayWashMoisture==='function') decayWashMoisture(t, dd);
    // ---- crops grow live
    if(t.crop){
      const c = CROPS[t.crop.type];
      t.crop.days = (t.crop.days||0) + dd;

      let gm = sn.growMult;
      if(buildNear(t,'greenhouse',2)) gm = Math.max(gm, 0.75) * 1.15;   // warmth all year
      if(state.unlocks.upg_growth) gm *= 1.2;

      if(t.crop.growth >= 1) harvestCrop(t, i);

    if(t.crop && CROPS[t.crop.type].cover && t.crop.growth>0.5) t.flowers = Math.min(1, t.flowers + 0.02*dd);

  });

  if(autosaveT > 15){ autosaveT = 0; checkBadges(); save(); }

function harvestCrop(t, i){
  const c = CROPS[t.crop.type];
  const f = farmCache || farmStats();
  let mult = 0.4 + t.health/100;
  if(c.yield>0 && buildNear(t,'beehive',2)) mult *= 1.2;   // pollination bonus

  const coins = Math.round(c.yield * mult);
  if(coins>0){
    // Home Patch first-run still pays on the tile. After that, the crate by the house holds it.
    if(typeof neighborStandUnlocked==='function' && neighborStandUnlocked()){
      bankHarvestLot({type:t.crop.type, em:c.em, name:c.name, coins});
      floater(i, '🧺 crate', '#ffd45e', 17);
      burst(i, '#e8d4a0', 8);
      SND.place();
      if(camp){
        if(!camp.tipsShown) camp.tipsShown = {};
        toast('🧺 Harvest in the crate by the house. Neighbors pay by the season — hold if the lane is cheap.', {once:'crate_first_bank', throttleMs:4000});
      }
    }else{
      state.coins += coins;
      state.stats.coinsEarned += coins;
      floater(i, '+🪙'+coins, '#ffd45e', 17);
      burst(i, '#ffd45e', 12);
      SND.coin();
    }
  }else{
    floater(i, '🌼 soil fed!', '#fff2b0');
    burst(i, '#a8d5a8', 8);
  }
  state.stats.harvests++;
  // I3/AO/CJ — first coin harvest once (not tied to harvests===1; cover crops can harvest first)
  if(coins>0 && camp && !(typeof neighborStandUnlocked==='function' && neighborStandUnlocked())){
    if(!camp.tipsShown) camp.tipsShown = {};
    if(!camp.tipsShown.first_harvest_coin){
      ringAt(i, '#ffd45e');
      burst(i, '#ffd45e', 16);
      if(!document.body.classList.contains('reduce-motion')) confetti(20);
      SND.harvestFirst();
      toast('🌾 First harvest! Coins from living soil — keep the ground diverse.', {once:'first_harvest_coin', throttleMs:4000});
    }
  }
  t.soil.om = clamp(t.soil.om + (c.cover?6:3));
  t.soil.microbial = clamp(t.soil.microbial + (c.cover?4:1.5));
  if(c.pioneer && t.terrain==='dead'){   // a finished pioneer stand is a feast for dead ground
    t.soil.structure = clamp(t.soil.structure+5);
    t.soil.erosion = clamp(t.soil.erosion+5);
    t.soil.nutrients = clamp(t.soil.nutrients+4);
  }
  if(c.cover) t.flowers = Math.min(1, t.flowers+0.35);
  if(!c.diverse && Math.random()<0.35){
    toast(typeof neighborStandUnlocked==='function' && neighborStandUnlocked()
      ? '🌾 Quick Wheat filled the crate… but that soil feels tired.'
      : '🌾 Quick Wheat paid fast… but that soil feels tired.');
  }
  if(t.crop && t.crop.type==='wheat' && typeof earnNote==='function') earnNote('lonely');
  t.crop = null;
  recalc(t);
  checkBadges();
}
function advanceSeason(){
  state.season = (state.season+1)%4;
  if(state.season===0) state.year++;
  state.seasonCount++;
  const sn = SEASONS[state.season];
  // F5 — never toast over journey/modals (toast already gates modalOpen; also skip if journey open)
  if(!journeyOpen && !modalOpen){
    // O5/BP/CF — first winter once only (greenhouse); later winters share normal season line
    if(state.season===3){
      if(!camp.tipsShown) camp.tipsShown = {};
      if(!camp.tipsShown.winter_first){
        const gh = typeof toolAllowed==='function' && (toolAllowed('greenhouse') || !!(LV() && LV().shop));
        toast(gh
          ? `${sn.emoji} Winter settles — plant only beside a 🪴 greenhouse, or rest the soil.`
          : `${sn.emoji} Winter settles — nothing new will root until spring. Tend what's already in the ground.`, {once:'winter_first', throttleMs:4000});
      }else{
        toast(`${sn.emoji} ${sn.name} begins — Year ${state.year}`, {throttleMs:2500});
      }
    }else{
      toast(`${sn.emoji} ${sn.name} begins — Year ${state.year}`, {throttleMs:2500});
    }
  }
  // AH/CF — first season change juice once (confetti), never stacks with a second juice pass
  if(!camp.tipsShown) camp.tipsShown = {};
  if(!camp.tipsShown.season_first_juice){
    camp.tipsShown.season_first_juice = true;
    if(!document.body.classList.contains('reduce-motion')) confetti(22);
    SND.badge();
  }else{
    SND.season();
  }
  // perennials pay every season (except deep winter)
  if(state.season!==3){
    let per = 0;
    state.grid.forEach((t,i)=>{
      if(t.terrain==='orchard'){ per += 6; floater(i, '+🪙6 🍎', '#ffd45e', 13); }
      else if(t.terrain==='berrybush'){ per += 3; floater(i, '+🪙3 🫐', '#ffd45e', 12); }
    });
    if(per>0){ state.coins += per; state.stats.coinsEarned += per; SND.coin(); }
  }
  const ev = rollEvent();
  if(ev){
    // E5 event telegraph — sky/ground cue before damage resolves
    const TELEG = {
      drought:'☀️ Sky blazes white — drought brewing…',
      downpour:'🌫️ Clouds pile up — heavy rain coming…',
      duststorm:'🏜️ Horizon browns — dust storm on the wind…',
      pests:'🦗 Something buzzes the mono-crops…',
      snow:'❄️ Air goes sharp — snow moving in…',
      gentleRain:'🌦️ Soft rain on the way…',
    };
    if(TELEG[ev]) toast(TELEG[ev]);
    setTimeout(()=>showEvent(ev), 1400);
  }
  checkBadges();
  if(typeof rememberLaneClock==='function') rememberLaneClock();
  if(typeof refreshNeighborStandIfOpen==='function') refreshNeighborStandIfOpen();
  save();
}

// ---------------------------------------------------------------- regions & quests
function regionProgress(reg){
  const g = reg.goal;
  let cur = 0;
  state.grid.forEach(t=>{
    if(t.region!==reg.id) return;
    const green = t.terrain==='trees' || t.terrain==='pond' || BUILD_SET.has(t.terrain);
    if(g.type==='healthy'){ if((isLandT(t) && t.health>=g.hp) || green) cur++; }
    else if(g.type==='alive'){ if(t.terrain==='soil' || green) cur++; }
    else if(g.type==='grove'){ if(t.terrain==='trees' || t.terrain==='orchard') cur++; }
  });
  return Math.min(cur, g.n);
}
function taskDef(id){ return TASKS.find(x=>x.id===id); }
function newTask(){
  const f = farmCache || farmStats();
  const active = new Set(state.tasks.map(x=>x.id));
  const pool = TASKS.filter(td=>{
    if(active.has(td.id)) return false;
    if(td.abs && (state.tasksDone[td.id] || td.abs(f))) return false;   // one-shot goals
    if(td.id==='build2' && !Object.keys(state.unlocks).some(u=>{
      const s = SHOP.find(x=>x.id===u); return s && s.cat==='Build';
    })) return false;
    return true;
  });
  if(!pool.length) return null;
  const td = pool[(Math.random()*pool.length)|0];
  return {id:td.id, base: td.stat ? (state.stats[td.stat]||0) : 0};
}
let _questSweeping = false;
function updateQuests(){
  if(!homesteadMode && !_questSweeping && typeof sweepWakeDeadTiles==='function'){
    _questSweeping = true;
    try{ sweepWakeDeadTiles(); }
    finally{ _questSweeping = false; }
  }
  if(homesteadMode){ renderHomesteadQuests(); return; }
  if(isValleyLevel(state.lv)) updateValleyQuests();   // tasks & regions only on the finale
  checkLevelComplete();
  renderQuests();
}
function renderHomesteadQuests(){
  const regEl = document.getElementById('qRegion');
  const body = document.getElementById('qBody');
  const sumEl = document.getElementById('qSummary');
  if(!regEl || !body) return;
  const hs = camp.homestead;
  const H = HS_HOUSE[Math.min(HS_HOUSE.length-1, hs.houseTier|0)];
  regEl.textContent = 'Homestead';
  if(sumEl) sumEl.textContent = `🪙${camp.bank|0}`;
  const kits = (hs.expansions||[]).filter(id=>String(id).indexOf('kit_')===0).length;
  body.innerHTML = `
    <div class="qgoal">🏡 ${H.em} <b>${H.name}</b> · design the yard</div>
    <div class="qtask"><span class="qem">🏦</span><span>Bank</span><span class="qprog">🪙${camp.bank|0}</span></div>
    <div class="qtask"><span class="qem">🌿</span><span>Lot</span><span class="qprog">${hs.gridSize}×${hs.gridSize}</span></div>
    <div class="qtask"><span class="qem">📐</span><span>Kits unlocked</span><span class="qprog">${kits}</span></div>
    <div class="qtask"><span class="qem">🛒</span><span>Catalog: House · Expand · Yard Build</span></div>
    <div class="sub" style="margin:8px 4px 0;font-size:11.5px;opacity:.85">Plots teach regen. The yard is your long canvas — paths, plantings, places to sit. Rooms optional.</div>`;
}
function updateValleyQuests(){
  while(state.tasks.length<2){ const t = newTask(); if(!t) break; state.tasks.push(t); }
  const f = farmCache || farmStats();
  for(let k=state.tasks.length-1; k>=0; k--){
    const task = state.tasks[k], td = taskDef(task.id);
    if(!td){ state.tasks.splice(k,1); continue; }
    const done = td.abs ? td.abs(f) : ((state.stats[td.stat]||0) - task.base) >= td.n;
    if(done){
      state.tasks.splice(k,1);
      if(td.abs) state.tasksDone[td.id] = true;
      state.coins += td.reward;
      if(!celebrationBusy()){
        markCelebration(2400);
        toast(`✅ ${td.em} ${td.desc} — +${td.reward}🪙!`);
        confetti(24); SND.badge();
      }
    }
  }
  // ---- the current region's restore goal
  if(state.regionIdx < REGIONS.length){
    const reg = REGIONS[state.regionIdx];
    if(regionProgress(reg) >= reg.goal.n){
      state.regionIdx++;
      state.coins += reg.reward;
      confetti(90); SND.win();
      if(reg.id==='wash') restoreWash();
      const next = state.regionIdx < REGIONS.length ? REGIONS[state.regionIdx] : null;
      setTimeout(()=>showModal(`
        <h2>${reg.em} ${reg.name} Restored!</h2>
        <div class="eventbig">${reg.em}✨</div>
        <div class="eventkid">${reg.id==='wash' ? 'And listen… WATER! The dry creek is flowing again!' : 'Life is spreading back through '+reg.name+'.'}</div>
        <div class="eventlines"><div>🪙 +${reg.reward} restoration reward!</div></div>
        ${next ? `<div class="lesson">🎯 Next: <b>${next.name}</b> — ${next.story}</div>`
               : `<div class="lesson">🏆 Every region breathes again — now heal every last tile, clean the river, and welcome the wildlife home!</div>`}
        <div class="modalbtns"><button class="mbtn big" data-act="close">Onward! 🌱</button></div>`), 500);
      checkBadges(); save();
    }
  }
}
function restoreWash(){
  state.washRestored = true;
  state.grid.forEach((t,i)=>{
    if(t.terrain==='riverbed'){ t.terrain = 'water'; t.feature = null; burst(i, '#7fc4ee', 14); }
  });
  state.waterQuality = clamp(state.waterQuality + 5);
  SND.splash();
}
/** K5 — keep primary goal dominant in first minutes (expand once + gold pulse). */
function pulseGoalsForFirstMinute(){
  if(!state || homesteadMode) return;
  if(state.lv !== 0 || state.levelDone) return;
  if((state.day|0) > 6) return;
  if(!camp.tipsShown) camp.tipsShown = {};
  if(camp.tipsShown.goals_pulse) return;
  camp.tipsShown.goals_pulse = true;
  const qp = document.getElementById('questPanel');
  if(!qp) return;
  qp.classList.remove('min');
  const caret = document.getElementById('qCaret');
  if(caret) caret.textContent = '▼';
  // M3 — no gold pulse spam under reduced motion
  if(!document.body.classList.contains('reduce-motion')){
    qp.classList.add('goal-pulse');
    setTimeout(()=> qp.classList.remove('goal-pulse'), 2200);
  }
}
function renderQuests(){
  const regEl = document.getElementById('qRegion');
  const body = document.getElementById('qBody');
  const sumEl = document.getElementById('qSummary');
  if(!regEl || !body) return;
  // ---- campaign + leftover plots: the level's own goal checklist
  if(!isValleyLevel(state.lv)){
    const L = LV();
    regEl.textContent = L.name;
    let doneN = 0, totN = (L.goals||[]).length;
    // Highlight next incomplete goal as primary action (B3 / K5)
    let nextGoal = null, nextCur = 0, nextN = 0;
    // BF/BH — seed goals at level entry; first paint never sparkles (already-done or first snapshot)
    if(state._goalSparkLv !== state.lv || !state._goalSpark){
      state._goalSparkLv = state.lv;
      state._goalSpark = {};
      state._goalSparkReady = false; // arm only after one full pass
      (L.goals||[]).forEach((g, gi)=>{
        const p = g.prog();
        if(p[0] >= p[1]) state._goalSpark[g.id || g.desc || gi] = true;
      });
    }
    let justSparkled = null;
    (L.goals||[]).forEach((g, gi)=>{
      const p = g.prog(), cur = Math.min(p[0], p[1]), n = p[1];
      if(cur>=n){
        doneN++;
        // Soft sparkle only after entry snapshot, when a goal newly crosses done mid-play
        if(!state.levelDone && !homesteadMode && state._goalSparkReady){
          if(!state._goalSpark) state._goalSpark = {};
          const gk = (g.id || g.desc || gi);
          if(!state._goalSpark[gk]){
            state._goalSpark[gk] = true;
            justSparkled = g;
          }
        }else if(cur>=n){
          // Keep map in sync during entry seed pass
          if(!state._goalSpark) state._goalSpark = {};
          state._goalSpark[g.id || g.desc || gi] = true;
        }
      }else if(!nextGoal){ nextGoal = g; nextCur = cur; nextN = n; }
    });
    // Arm after first render of this visit — subsequent completions may sparkle
    if(!state._goalSparkReady) state._goalSparkReady = true;
    if(justSparkled && !state.levelDone){
      const qp = document.getElementById('questPanel');
      if(qp && !document.body.classList.contains('reduce-motion')){
        qp.classList.add('goal-pulse');
        setTimeout(()=> qp.classList.remove('goal-pulse'), 1600);
      }
      if(!celebrationBusy()){
        markCelebration(2200);
        if(!document.body.classList.contains('reduce-motion') && typeof confetti==='function') confetti(14);
        if(typeof SND!=='undefined' && SND.badge) SND.badge();
        toast(`✅ ${justSparkled.em||'✨'} ${justSparkled.desc} — goal met!`, {throttleMs:2200});
      }
    }
    let h = `<div class="qgoal qgoal-primary">${L.em} ${L.goalText}</div>`;
    if(nextGoal && !state.levelDone){
      h += `<div class="qtask" style="background:rgba(255,236,180,.45);border-radius:8px;padding:4px 6px;margin-bottom:4px;border:1px solid rgba(201,143,30,.35)"><span class="qem">${nextGoal.em}</span><span><b>Next:</b> ${nextGoal.desc}</span><span class="qprog">${nextCur}/${nextN}</span></div>`;
    }
    L.goals.forEach(g=>{
      const p = g.prog(), cur = Math.min(p[0], p[1]), n = p[1];
      h += `<div class="qtask ${cur>=n?'done':''}"><span class="qem">${cur>=n?'✅':g.em}</span><span>${g.desc}</span><span class="qprog">${cur}/${n}</span></div>`;
    });
    if(state.levelDone) h += `<div class="qtask done"><span class="qem">🏆</span><span>Plot complete! Keep tending, or head back to the 🗺️ Journey.</span></div>`;
    body.innerHTML = h;
    if(sumEl) sumEl.textContent = totN ? `${doneN}/${totN}` : '';
    return;
  }
  let html = '';
  if(state.regionIdx >= REGIONS.length){
    regEl.textContent = 'The Living Valley';
    html = `<div class="qgoal">🏆 Every region restored! Heal every last tile & keep the river clean.</div>`;
  }else{
    const reg = REGIONS[state.regionIdx];
    regEl.textContent = reg.name;
    const cur = regionProgress(reg);
    html = `<div class="qgoal">${reg.em} ${reg.desc} <span style="color:var(--soft)">(${cur}/${reg.goal.n})</span></div>
      <div class="qbarw"><div class="qbar" style="width:${(cur/reg.goal.n*100).toFixed(0)}%"></div></div>`;
  }
  const f = farmCache || farmStats();
  state.tasks.forEach(task=>{
    const td = taskDef(task.id);
    if(!td) return;
    const n = td.abs ? 1 : td.n;
    const cur = td.abs ? (td.abs(f)?1:0) : Math.max(0, Math.min(td.n, (state.stats[td.stat]||0) - task.base));
    html += `<div class="qtask"><span class="qem">${td.em}</span><span>${td.desc}</span><span class="qprog">${td.abs?'':cur+'/'+n} +${td.reward}🪙</span></div>`;
  });
  body.innerHTML = html;
  if(sumEl){
    if(state.regionIdx >= REGIONS.length) sumEl.textContent = '🏆';
    else{
      const reg = REGIONS[state.regionIdx];
      sumEl.textContent = reg ? `${regionProgress(reg)}/${reg.goal.n}` : '';
    }
  }
}

// ------------------------------------------------- campaign level completion
function levelGoalsMet(){
  if(!state || homesteadMode) return false;
  const L = typeof LV==='function' ? LV() : null;
  if(!L || !L.goals || !L.goals.length) return false;
  for(const g of L.goals){
    try{
      const p = g.prog();
      if(!p || (p[0]|0) < (p[1]|0)) return false;
    }catch(e){ return false; }
  }
  return true;
}
function checkLevelComplete(){
  if(!state || state.levelDone || homesteadMode) return;
  if(!levelGoalsMet()) return;
  const L = LV();
  if(!L.goals || !L.goals.length) return;
  // CF — no extra toast here: clear toast + modal already celebrate (fatigue reduction)
  if(camp){
    if(!camp.tipsShown) camp.tipsShown = {};
    camp.tipsShown.plot_goals_all = true; // consume so veterans / re-open stay quiet
  }
  const firstClear = !camp.done[state.lv];
  state.levelDone = true;
  camp.done[state.lv] = true;
  const f = farmCache || farmStats();
  const stars = 1 + (state.year<=L.parYears ? 1 : 0) + (f.avgHealth>=55 ? 1 : 0);
  camp.stars[state.lv] = Math.max(camp.stars[state.lv]||0, stars);
  if(state.lv < LEVELS.length-1) camp.unlocked = Math.max(camp.unlocked, state.lv+1);
  // Bank coins into Homestead (plots teach; homestead remembers)
  const leftover = Math.max(0, state.coins|0);
  const bonus = CLEAR_BONUS[state.lv] || 40;
  let banked = firstClear ? (leftover + bonus) : Math.floor(leftover * 0.25);
  if(firstClear) banked += hsBankBonus(); // house tier + improvements clear bonus
  camp.bank = (camp.bank|0) + banked;
  lastBanked = banked;
  if(firstClear && state.lv === 0){
    camp.homestead.unlocked = true;
    ensureHomesteadTiles();
    // Starter bank so first yard moves aren't locked behind zero coins
    if((camp.bank|0) < 25) camp.bank = Math.max(camp.bank|0, 25);
  }
  // G2 — after first plot clear, later plots stay event-driven (no full coaching wall)
  if(firstClear && state.lv === 0){
    if(!camp.tipsShown) camp.tipsShown = {};
    camp.tipsShown.skip_coaching = true;
  }
  // Valley map parcel state (Pack 0)
  syncParcelClearFromCamp();
  const clearedParcel = valleyParcelByLvIndex(state.lv);
  if(clearedParcel){
    ensureParcelState(camp);
    camp.parcels[clearedParcel.id].cleared = true;
    camp.parcels[clearedParcel.id].restorePct = 100;
    camp.parcels[clearedParcel.id].bestStars = Math.max(camp.parcels[clearedParcel.id].bestStars|0, stars);
  }
  // Permanent feature unlocks (tools free in shop + future plots)
  if(firstClear){
    if(!camp.featureUnlocks) camp.featureUnlocks = {};
    const grants = (L.grantUnlocks || clearedParcel && clearedParcel.grantUnlocks) || [];
    grants.forEach(id=>{
      camp.featureUnlocks[id] = true;
      state.unlocks[id] = true;
      if(typeof grantHerdHead==='function') grantHerdHead(id);
    });
    if(grants.length){
      toast('🔓 Unlocked forever: ' + grants.slice(0,4).join(', ') + (grants.length>4?'…':''));
    }
  }
  syncUnlockedFromParcels();
  // Neighbor parcels now open (atlas unlock graph)
  let pathOpen = '';
  if(firstClear && clearedParcel){
    const opened = VALLEY_PARCELS.filter(P=>
      P.kind==='plot' && P.id!==clearedParcel.id && parcelIsUnlocked(P, camp) && !(camp.parcels[P.id]&&camp.parcels[P.id].cleared)
    ).filter(P=>{
      const R = P.unlockRules||{};
      if(R.type==='parcel_cleared' && R.parcelId===clearedParcel.id) return true;
      if((R.type==='parcel_cleared_any'||R.type==='parcel_cleared_all') && (R.parcelIds||[]).includes(clearedParcel.id)) return true;
      if(P.leftover && (P.neighborParcels||[]).includes(clearedParcel.id)) return true;
      return false;
    });
    if(opened.length) pathOpen = opened.map(P=>`${P.em} ${P.name}`).join(', ');
    const deals = VALLEY_PARCELS.filter(P=>
      P.buyable && !parcelIsBought(P, camp) && parcelDeedOffered(P, camp) &&
      ((P.neighborParcels||[]).includes(clearedParcel.id) || ((P.unlockRules||{}).neighborParcels||[]).includes(clearedParcel.id))
    );
    if(deals.length){
      const dealLine = deals.map(P=>`${P.em} ${P.name} · 🪙${parcelDeedCost(P)}`).join(', ');
      pathOpen = pathOpen ? (pathOpen + ' · land for sale: ' + dealLine) : ('land for sale: ' + dealLine);
    }
  }
  // Unlock house-tier eligibility is checked at buy time via needDone / needParcel
  save();
  confetti(120); SND.win();
  // N2 — immediate clear moment (not silent during 700ms modal delay / reduce-motion)
  toast(`${L.em} ${L.name} restored! ⭐×${stars}` + (firstClear ? ` · banked 🪙${banked}` : ''), {throttleMs:2800});
  // AL — first 3★ mastery of any parcel (once per save)
  if(stars >= 3){
    if(!camp.tipsShown) camp.tipsShown = {};
    if(!camp.tipsShown.mastered_first){
      camp.tipsShown.mastered_first = true;
      setTimeout(()=>{
        toast(`★ Mastered ${L.name} — three stars! Fast + healthy ground.`);
        if(!document.body.classList.contains('reduce-motion')) confetti(36);
        SND.badge();
      }, 900);
    }else if(firstClear){
      setTimeout(()=>toast(`★ ${L.name} mastered — three stars.`), 900);
    }
  }
  if(typeof scrapbookAdd==='function')
    scrapbookAdd('goal', `${L.em} ${L.name} cleared`, firstClear ? `First clear · 🪙${banked} banked` : `Replay · 🪙${banked} banked`);
  const next = nextUnlockedLevel(state.lv);
  const hsOpen = !!camp.homestead.unlocked;
  // CV/CX — at most one plot-system recap lesson (first clear only; mutually exclusive by L.id)
  let plotRecap = '';
  if(firstClear){
    if(L.id==='home') plotRecap = `<div class="lesson">🏡 <b>Homestead unlocked!</b> A blank yard to design — paths, plantings, places to sit. Bank starts with a little seed money.</div>`;
    else if(L.id==='field') plotRecap = `<div class="lesson">🐄 <b>Grazing dance learned</b> — cattle then chickens on the same tile. Carry that team-graze habit to every paddock ahead.</div>`;
    else if(L.id==='creek') plotRecap = `<div class="lesson">🏞️ <b>Buffers filter runoff</b> — trees and living banks clean water. Carry that to every stream ahead.</div>`;
    else if(L.id==='flats') plotRecap = `<div class="lesson">🏜️ <b>Hard land learned</b> — salt pans need extra feed, goats browse dead scrub, and every revived tile weakens the dust. Patience + compost wins.</div>`;
    else if(L.id==='orchard') plotRecap = `<div class="lesson">🍎 <b>Perennials pay seasons</b> — orchards and berries fruit again and again; beehives boost nearby yields. Plant for the long haul.</div>`;
    else if(L.id==='marsh') plotRecap = `<div class="lesson">🦩 <b>Living filters</b> — wetlands and ducks clean water at the edge of the stem. Keep wet ground connected to the main river.</div>`;
    else if(L.id==='wind') plotRecap = `<div class="lesson">🌬️ <b>Weather harnessed</b> — windmills and solar pay daily; rain tanks and wells steady droughts. Stack clean power on high ground.</div>`;
    else if(L.id==='market') plotRecap = `<div class="lesson">🏪 <b>Trade corner built</b> — market stands trickle coins, silos punch harvests, sheep and pigs join the toolkit. Economy meets the herd.</div>`;
    else if(L.id==='school') plotRecap = `<div class="lesson">📚 <b>Teach-back complete</b> — basics still heal: compost, pioneers, sisters. Leave every plot greener than you found it.</div>`;
    else if(L.id==='valley') plotRecap = `<div class="lesson">🌄 <b>Whole valley woven</b> — every lesson at once: feed ground, graze teams, buffer water, perennials, power, and trade. Freeplay and Homestead stay open forever.</div>`;
  }
  setTimeout(()=>showModal(`
    <h2>${L.em} ${L.name} — Complete!</h2>
    <div class="eventbig">${'⭐'.repeat(stars)}</div>
    <div class="eventkid">${L.doneText}</div>
    <div class="winstats">Finished in <b>${state.year} year${state.year>1?'s':''}</b> · Farm Life ${Math.round(f.avgHealth)} · ${f.restored}/${f.totalSoil} tiles restored</div>
    <div class="lesson">🏦 Banked <b>🪙${banked}</b> to the Homestead${firstClear?' (leftover + clear bonus)':' (replay: 25% leftover)'}. Bank: <b>🪙${camp.bank}</b></div>
    ${plotRecap}
    ${pathOpen ? `<div class="lesson">🗺️ Path open on the valley map: <b>${pathOpen}</b></div>` : ''}
    ${next ? `<div class="lesson">🔓 Unlocked: <b>${next.em} ${next.name}</b> — ${next.teaser}</div>`
           : `<div class="lesson">🏆 You walked the whole journey — the land remembers you now.</div>`}
    <div class="modalbtns">
      ${next ? `<button class="mbtn big" data-act="nextlevel">Next: ${next.name} ▶</button>` : ''}
      ${hsOpen ? `<button class="mbtn wood" data-act="gohomestead">🏡 Visit Homestead</button>` : ''}
      <button class="mbtn wood" data-act="gojourney">🗺️ Journey</button>

function ensureHomesteadTiles(){
  if(!camp.homestead) camp.homestead = defaultHomestead();
  const hs = camp.homestead;
  if(!Array.isArray(hs.improvements)) hs.improvements = [];
  if(!Array.isArray(hs.expansions)) hs.expansions = [];
  const size = hs.gridSize || 8;
  if(!(Array.isArray(hs.tiles) && hs.tiles.length === size*size)){
    hs.tiles = buildHomesteadTiles(size, hs.houseTier|0);
    hs.grassCanvasV3 = true; // all-grass yard (no farm dirt patches)
  }
  migrateHomesteadGrassCanvas(hs);
  if(typeof ensureNeighborStandOnTiles==='function') ensureNeighborStandOnTiles(hs.tiles, hs.gridSize||8);
  if(typeof ensureHomesteadBarnOnTiles==='function') ensureHomesteadBarnOnTiles(hs.tiles, hs.gridSize||8);
  if(typeof ensureHomesteadCoopOnTiles==='function') ensureHomesteadCoopOnTiles(hs.tiles, hs.gridSize||8);
}
/** Force uniform lawn: no plow dirt / soil patches — yard is not a farm field. */
function migrateHomesteadGrassCanvas(hs){
  if(!hs || hs.grassCanvasV3) return;
  if(!Array.isArray(hs.tiles)){ hs.grassCanvasV3 = true; return; }
  hs.tiles.forEach(t=>{
    if(!t) return;
    // Keep house, buildings, water, paths, player decos — only fix open ground look
    if(t.terrain==='house' || t.terrain==='barn' || t.terrain==='nstand' || t.terrain==='coop') return;
    if(t.terrain==='dead') t.terrain = 'soil';
    if(t.terrain!=='soil' && t.terrain!=='trees') return;
    // Lush grass band always (draw path also forces grass in homesteadMode)
    SOIL_ATTRS.forEach(k=>{ t.soil[k] = 82 + Math.random()*10; });
    if(t.feature==='path'){
      t.flowers = Math.min(t.flowers||0, 0.04);
    }else if(!(t.flowers > 0.04)){
      t.flowers = 0.06 + Math.random()*0.08;
    }
    t.crop = null; t.graze = null; t.compost = 0;
    if(typeof recalc==='function') recalc(t);
  });
  hs.grassCanvasV3 = true;
  hs.grassCanvasV2 = true;
}
function buildHomesteadTiles(size, houseTier){
  const prevGRID = GRID;
  GRID = size;
  const tiles = [];
  for(let r=0;r<size;r++) for(let c=0;c<size;c++){
    const t = newTile(c,r);
    // Uniform lawn — not a regenerative farm field
    SOIL_ATTRS.forEach((k,ki)=>{ t.soil[k] = 84 + sr((r*size+c)*5+ki)*10; });
    t.terrain = 'soil'; t.crop = null; t.graze = null; t.deco = null; t.feature = null;
    t.fence = false; t.bridge = false; t.compost = 0;
    t.flowers = 0.02 + sr(r*3+c)*0.04; // sparse meadow fleck — blank canvas feel (RW-081)
    recalc(t);
    tiles.push(t);
  }
  // always seat the home place (camp tent → estate)
  placeHouseOnTiles(tiles, size, houseTier);
  // RW-081: Camp (tier 0) = blank canvas — only house. Path stub from Farmhouse+
  const tier = Math.min(HS_HOUSE.length-1, Math.max(0, houseTier|0));
  if(tier >= 1 && size > 3){
    const pathCells = [[1,2],[1,3]];
    pathCells.forEach(([c,r])=>{
      if(!inHS(c,r,size)) return;
      const n = tiles[r*size+c];
      if(n && n.terrain==='soil'){ n.feature = 'path'; n.deco = null; n.flowers = 0.02; }
    });
  }
  GRID = prevGRID;
  return tiles;
}
function placeHouseOnTiles(tiles, size, houseTier){
  const tier = Math.min(HS_HOUSE.length-1, Math.max(0, houseTier|0));
  const H = HS_HOUSE[tier];
  const hc = 1, hr = 1;
  if(hc>=size || hr>=size) return;
  const t = tiles[hr*size+hc];
  t.terrain = 'house'; t.deco = null; t.crop = null; t.feature = null; t.fence = false; t.flowers = 0;
  // Prestige: one calm accent only at high tiers — not a flower dump
  if(tier>=2 && inHS(2,1,size)){
    const n = tiles[1*size+2];
    if(n && n.terrain==='soil' && !n.deco){ n.deco = 'deco_bench'; n.flowers = 0.05; }
  }
  if(tier>=3 && inHS(1,2,size)){
    const n = tiles[2*size+1];
    if(n && n.terrain==='soil' && !n.deco){ n.terrain = 'windmill'; n.deco = null; }
  }
  // Manor: soft flower border / path edge near the house (never overwrite player work)
  if(tier>=4 && inHS(0,1,size)){
    const n = tiles[1*size+0];
    if(n && n.terrain==='soil' && !n.deco && !hasFence(n)){
      if(!n.feature) n.feature = 'path';
      n.flowers = Math.max(n.flowers||0, 0.12);
    }
  }
  if(tier>=4 && inHS(2,2,size)){
    const n = tiles[2*size+2];
    if(n && n.terrain==='soil' && !n.deco && !n.feature){ n.deco = 'deco_flowerbed'; n.flowers = 0.14; }
  }
  // Heritage: landmark statue near the gate line if still empty
  if(tier>=5 && inHS(0,2,size)){
    const n = tiles[2*size+0];
    if(n && n.terrain==='soil' && !n.deco){ n.deco = 'deco_statue'; n.flowers = Math.max(n.flowers||0, 0.06); }
  }
  if(typeof stampHomesteadAtlasLane==='function') stampHomesteadAtlasLane(tiles, size);
  if(typeof ensureNeighborStandOnTiles==='function') ensureNeighborStandOnTiles(tiles, size);
  if(typeof ensureHomesteadBarnOnTiles==='function') ensureHomesteadBarnOnTiles(tiles, size);
  if(typeof ensureHomesteadCoopOnTiles==='function') ensureHomesteadCoopOnTiles(tiles, size);
}
function neighborStandSpotOk(t){

  if(t.terrain!=='soil') return false;
  if(t.deco || t.crop || t.graze) return false;
  if(typeof hasFence==='function' && hasFence(t)) return false;
  if(t.feature==='path') return false;
  if(typeof isSwaleT==='function' && isSwaleT(t)) return false;

function seatNeighborStand(t){

/** Table beside the house — only after Home Patch. Never stomps the house or player work if another grass cell is free. */
function ensureNeighborStandOnTiles(tiles, size){
  if(!tiles || !size) return;
  if(typeof neighborStandUnlocked==='function' && !neighborStandUnlocked()) return;
  if(tiles.some(t=>t && t.terrain==='nstand')) return;
  const prefer = [[1,0],[0,0],[2,0],[0,1],[2,1],[0,2],[2,2]];
  for(let i=0;i<prefer.length;i++){
    const c = prefer[i][0], r = prefer[i][1];
    if(!inHS(c,r,size)) continue;
    const t = tiles[r*size+c];
    if(neighborStandSpotOk(t)){ seatNeighborStand(t); return; }
  }
  for(let i=0;i<tiles.length;i++){
    const t = tiles[i];
    if(!t || t.terrain==='house' || t.terrain==='barn' || t.terrain==='coop') continue;
    const dc = Math.abs((t.c|0)-1), dr = Math.abs((t.r|0)-1);
    if(dc+dr===0 || dc>2 || dr>2) continue;
    if(neighborStandSpotOk(t)){ seatNeighborStand(t); return; }
  }
}
function homesteadBarnSpotOk(t){

function seatHomesteadBarn(t){

/** Barn east of the house — compost yard sits beside it, next to the garden. Never stomps house, stand, or player work. */
function ensureHomesteadBarnOnTiles(tiles, size){

/** Same seat leftoverPileTile uses — barn offset allowed, house fallback when the barn is missing. Never the coop. */
function homesteadPileSeatOnTiles(tiles, size){

  if(typeof leftoverCompostStock!=='function' || leftoverCompostStock()<=0) return null;

  if(!barn) return null;
  const dirs = [[-1,0],[0,1],[-1,1],[0,-1],[-1,-1],[1,1],[1,0],[1,-1]];
  let fallback = null;
  for(let i=0;i<dirs.length;i++){
    const c = (barn.c|0)+dirs[i][0], r = (barn.r|0)+dirs[i][1];
    if(!inHS(c,r,size)) continue;

    if(typeof leftoverPileSpotOpen==='function' && leftoverPileSpotOpen(t)) return t;

/** Coop between the garden and the barn / orchard side. Only when you own hens. Never stomps house, stand, barn, pile, or player deco. */
function ensureHomesteadCoopOnTiles(tiles, size){
  if(!tiles || !size) return;
  if(typeof ensureHerd==='function') ensureHerd(camp);
  if(!((camp && camp.herd && (camp.herd.chicken|0)) > 0)) return;
  if(tiles.some(t=>t && t.terrain==='coop')) return;
  const garden = homesteadGardenOnTiles(tiles);
  const barn = (typeof findGridBarn==='function') ? findGridBarn(tiles) : null;
  const pile = homesteadPileSeatOnTiles(tiles, size);
  const prefer = [];
  const seen = {};
  const push = (c,r)=>{
    if(!inHS(c,r,size)) return;
    const k = c+','+r;
    if(seen[k]) return;
    seen[k] = 1;
    prefer.push([c,r]);
  };
  if(garden){
    const gc = garden.c|0, gr = garden.r|0;
    const bc = barn ? (barn.c|0) : 3;
    const br = barn ? (barn.r|0) : 1;
    const dc = Math.sign(bc-gc) || 1;
    const dr = Math.sign(br-gr);
    push(gc+dc, gr); push(gc, gr+dr); push(gc+dc, gr+dr);
    push(gc+dc*2, gr); push(gc+1, gr+1); push(gc-1, gr+1);
    push(((gc+bc)>>1), ((gr+br)>>1));
    push(((gc+bc)>>1), gr); push(gc+1, ((gr+br)>>1));
  }
  // Garden south of the house; barn / orchard sits east. Seat between them.
  [[2,3],[3,3],[2,4],[3,4],[4,3],[1,3],[4,2],[2,2],[4,4],[5,3],[1,4],[3,2],[5,2],[2,5],[3,5]].forEach(p=>push(p[0],p[1]));
  const trySeat = (t)=>{
    if(!t || t.terrain==='house' || t.terrain==='nstand' || t.terrain==='barn') return false;
    if(t.terrain==='coop') return false;
    if(pile && pile.terrain!=='barn' && (pile.c|0)===(t.c|0) && (pile.r|0)===(t.r|0)) return false;
    if(!homesteadCoopSpotOk(t)) return false;
    seatHomesteadCoop(t);
    return true;
  };
  for(let i=0;i<prefer.length;i++){
    const t = tiles[prefer[i][1]*size + prefer[i][0]];
    if(trySeat(t)) return;
  }
  const origin = garden || barn;
  if(origin){
    for(let dr=-2; dr<=3; dr++) for(let dc=-2; dc<=3; dc++){
      if(!dc && !dr) continue;
      const c = (origin.c|0)+dc, r = (origin.r|0)+dr;
      if(!inHS(c,r,size)) continue;
      if(trySeat(tiles[r*size+c])) return;
    }
  }
}
/** Living stock sits on grass only — never the house, stand, barn door, or leftover pile. */
function homesteadYardSeatOk(t){

function homesteadYardPlan(){

  };

function homesteadYardSeatsNear(grid, origin, dirs){

  let fallback = [];

    if(c<0 || r<0 || c>=size || r>=size) continue;
    const t = grid[r*size + c];

/** Homestead only. Campaign plots keep their own graze agents. Fresh Home Patch has no herd → none. */
function spawnHomesteadYardWalkers(){

function enterHomestead(){
  if(!camp.homestead || !camp.homestead.unlocked){
    toast('🏡 Finish Home Garden to unlock your Homestead!'); SND.uhoh(); return;
  }
  if(homesteadMode){ hideJourney(); return; }
  // park the active plot (if any)
  if(state && !state.homesteadView){
    plotStateBackup = state;
    if(typeof rememberLaneClock==='function') rememberLaneClock(state);
  }
  ensureHomesteadTiles();
  migrateHomesteadGrassCanvas(camp.homestead);
  state = hydrateHomesteadState();
  homesteadMode = true;
  document.body.classList.remove('home-plot','tut-open');
  if(typeof clearCoachMarks==='function') clearCoachMarks();
  // Fresh visit → allow one "placed" toast again (A2)
  if(camp.tipsShown) delete camp.tipsShown.hs_first_place_visit;
  agents = []; wildlife = []; birds = []; worldParts = []; screenParts = [];
  GRID = state.gridSize;
  if(typeof spawnHomesteadYardWalkers==='function') spawnHomesteadYardWalkers();
  selected = -1; hovered = -1; tool = 'select';
  canvas.classList.remove('tooling');
  closeModal(); closeInfo();
  hideJourney();
  layout(); centerCamera();
  applyHomesteadUI();
  setOverlay('none');
  updateHUD(); updateClockUI(); updateQuests(); refreshAnchors();
  save();
  // BL — quieter enter; catalog tip carries the design loop once
  toast('🏡 Homestead — spend banked coins to build and decorate. No rush.', {once:'hs_enter_once', throttleMs:3500});
  // BN — near-zero bank + sparse yard: free path/bench literacy
  const bankNow = camp.bank|0;
  const sparse = (()=>{
    try{
      const tiles = (state && state.grid) || (camp.homestead && camp.homestead.tiles) || [];
      let paths = 0, decos = 0;
      tiles.forEach(t=>{ if(!t) return; if(t.feature==='path') paths++; if(t.deco) decos++; });
      return paths + decos < 2;
    }catch(e){ return true; }
  })();
  if(bankNow < 10 && sparse){
    setTimeout(()=>{
      if(!homesteadMode) return;
      toast('🪨 Stone Path and 🪑 Garden Bench are free — start the yard even with an empty bank.', {once:'hs_bank0_free', throttleMs:4000});
    }, 900);
  }
  SND.pop();
}
function exitHomestead(){
  if(!homesteadMode) return;
  serializeHomesteadFromState();
  homesteadMode = false;
  if(plotStateBackup){
    state = plotStateBackup;
    plotStateBackup = null;
  }else{
    state = newGame(camp.cur);
  }
  GRID = state.gridSize;
  agents = []; wildlife = []; birds = [];
  // respawn plot animals if needed
  if(state.grid){
    state.grid.forEach((t,i)=>{
      if(t.terrain==='stable') spawnAnimals(i, 'horse', 1);
      if(t.graze) spawnGrazeAgents(i, t.graze);
    });
  }
  selected = -1; hovered = -1; tool = 'select';
  canvas.classList.remove('tooling');
  closeModal(); closeInfo();
  layout(); centerCamera();
  applyLevelUI();
  setOverlay('none');
  updateHUD(); updateClockUI(); updateQuests(); refreshAnchors();
  save();
}

function openPropertyMap(){

  const bank = camp.bank|0;
  const tier = hs.houseTier|0;
  const H = HS_HOUSE[Math.min(HS_HOUSE.length-1, tier)];
  const size = hs.gridSize || 8;
  const doneN = camp.done.filter(Boolean).length;
  // mini yard grid (prefer live homestead grid)
  let yardHtml = '';
  const tiles = (homesteadMode && state && state.grid) ? state.grid : hs.tiles;
  if(Array.isArray(tiles) && tiles.length){
    const cells = tiles.map(t=>{
      let bg = '#8fbc6a', ch = '';
      if(t.terrain==='house' || t.terrain==='barn'){ bg='#c4a06a'; ch=H.em; }
      else if(t.terrain==='coop'){ bg='#d4a06a'; ch='🐔'; }
      else if(t.terrain==='nstand'){ bg='#d4b56a'; ch='🧺'; }
      else if(t.terrain==='trees'){ bg='#4f9147'; ch='🌳'; }
      else if(t.terrain==='water' || t.terrain==='pond'){ bg='#6db3e0'; ch='💧'; }
      else if(BUILD_SET.has(t.terrain)){ bg='#a8c070'; ch='🏠'; }
      else if(t.deco){ bg='#9dce72'; ch='🌸'; }
      else if(hasFence(t)){ bg='#b8a070'; ch='·'; }
      else if(t.feature==='path'){ bg='#c8b890'; ch='·'; }
      return `<div class="pmap-cell" style="background:${bg}">${ch}</div>`;
    }).join('');
    yardHtml = `<div class="pmap-yard" style="grid-template-columns:repeat(${size},1fr)">${cells}</div>`;
  }else{
    yardHtml = `<div class="sub">Visit Homestead once to map the yard.</div>`;
  }
  ensureParcelState(camp);
  const STATE_ICON = {locked:'🔒', available:'○', in_progress:'▶', restored:'✅', mastered:'⭐', hub:'🏡'};
  const plots = VALLEY_PARCELS.filter(P=>P.kind==='plot').map(P=>{
    const ms = parcelMapState(P, camp);
    const unlocked = ms !== 'locked';

    const stars = (camp.parcels[P.id] && camp.parcels[P.id].bestStars) || (P.lvIndex!=null ? camp.stars[P.lvIndex]|0 : 0);
    const st = (P.buyable && ms==='locked')
      ? (parcelDeedOffered(P, camp) ? ('🪙'+parcelDeedCost(P)) : '·')
      : (STATE_ICON[ms] || '○');
    const star = done ? '⭐'.repeat(Math.max(1, stars||1)) : '';
    const systems = (P.systemsTaught||[]).slice(0,3).join(' · ');
    return `<div class="pmap-plot ${done?'done':''} ${!unlocked?'lock':''}" title="${P.desc||''}">
      <span class="pmap-st">${st}</span>
      <span class="pmap-em">${P.em||'🌱'}</span>

      <span class="pmap-stars">${star}</span>

  showModal(`
    <h2>📋 Property summary</h2>
    <div class="sub">Yard schematic + valley parcels · Land ★${landPrestigeScore()} · Home ★${homePrestigeScore()}</div>
    <div class="pmap-head">${H.em} <b>${H.name}</b> · yard ${size}×${size} · bank 🪙${bank} · plots cleared ${doneN}/${LEVELS.length}</div>
    <div class="pmap-label">🏡 Homestead yard (schematic)</div>
    ${yardHtml}
    <div class="pmap-label">🌾 Valley parcels</div>
    <div class="pmap-plots">${plots}</div>

      ${hs.unlocked?`<button class="mbtn wood" data-act="gohomestead">🏡 Homestead</button>`:''}
      <button class="mbtn wood" data-act="gojourney">Journey</button>
      <button class="mbtn wood" data-act="sharevalley">📋 Share valley score</button>
      <button class="mbtn" data-act="close">Close</button>

  `);

function buyHomestead(key){
  if(!key) return;
  const [kind, id] = key.split(':');
  const bank = camp.bank|0;
  const hs = camp.homestead;
  if(!Array.isArray(hs.improvements)) hs.improvements = [];
  const doneN = camp.done.filter(Boolean).length;
  if(kind==='house'){
    const tier = +id;
    const H = HS_HOUSE[tier];
    if(!H || tier!==(hs.houseTier|0)+1) return;
    if(doneN < H.needDone){ toast('🔒 Clear more campaign plots first.'); SND.uhoh(); return; }
    if(!parcelGateOk(H.needParcel, H.needParcels)){
      toast(`🔒 Restore ${parcelGateLabel(H.needParcel, H.needParcels)} first.`); SND.uhoh(); return;
    }
    if(bank < H.cost){ toast(`Need 🪙${H.cost} in the bank.`); SND.uhoh(); return; }
    camp.bank -= H.cost;
    hs.houseTier = tier;
    // update live grid
    if(homesteadMode && state && state.grid){
      placeHouseOnTiles(state.grid, state.gridSize, tier);
      serializeHomesteadFromState();
    }else{
      ensureHomesteadTiles();
      placeHouseOnTiles(hs.tiles, hs.gridSize, tier);
    }
    houseUpgradeCeremony(H);
    save(); updateHUD(); openHomesteadCatalog('house');
    return;
  }
  if(kind==='imp'){
    const Imp = HS_IMPROVEMENTS.find(x=>x.id===id);
    if(!Imp) return;
    if(hsImpOwned(Imp.id)){ toast('Already owned!'); return; }
    if((hs.houseTier|0) < (Imp.needTier|0)){ toast(`🔒 Needs house tier ${Imp.needTier}+.`); SND.uhoh(); return; }
    if(doneN < (Imp.needDone|0)){ toast('🔒 Clear more campaign plots first.'); SND.uhoh(); return; }
    if(!parcelGateOk(Imp.needParcel, Imp.needParcels)){
      toast(`🔒 Restore ${parcelGateLabel(Imp.needParcel, Imp.needParcels)} first.`); SND.uhoh(); return;
    }
    if(bank < Imp.cost){ toast(`Need 🪙${Imp.cost} in the bank.`); SND.uhoh(); return; }
    camp.bank -= Imp.cost;
    hs.improvements.push(Imp.id);
    if(Imp.id==='imp_gardenwing'){
      hs.expansions = hs.expansions || [];
      if(hs.expansions.indexOf('kit_garden') < 0) hs.expansions.push('kit_garden');
    }
    toast(`${Imp.em} ${Imp.name} added!`); confetti(28); SND.badge();
    save(); updateHUD(); openHomesteadCatalog('house');
    buildPalette();
    return;
  }
  if(kind==='exp'){
    const E = HS_EXPANSIONS.find(x=>x.id===id);
    if(!E) return;
    const isSize = !!E.size;
    const owned = isSize
      ? ((hs.expansions||[]).indexOf(E.id)>=0 || (hs.gridSize|0)>=E.size)
      : ((hs.expansions||[]).indexOf(E.id)>=0);
    if(owned){ toast('Already unlocked!'); return; }
    if(doneN < (E.needDone|0)){ toast('🔒 Clear more campaign plots first.'); SND.uhoh(); return; }
    if(!parcelGateOk(E.needParcel, E.needParcels)){
      toast(`🔒 Restore ${parcelGateLabel(E.needParcel, E.needParcels)} first.`); SND.uhoh(); return;
    }
    if(bank < E.cost){ toast(`Need 🪙${E.cost} in the bank.`); SND.uhoh(); return; }
    camp.bank -= E.cost;
    hs.expansions = (hs.expansions||[]).concat([E.id]);
    if(isSize){
      // resize yard keeping existing tiles
      const oldSize = hs.gridSize|0;
      const oldTiles = (homesteadMode && state) ? state.grid : (hs.tiles||[]);
      const neu = buildHomesteadTiles(E.size, hs.houseTier|0);
      for(let r=0;r<oldSize;r++) for(let c=0;c<oldSize;c++){
        const o = oldTiles[r*oldSize+c];
        if(!o) continue;
        const n = neu[r*E.size+c];
        if(n){
          Object.assign(n, {terrain:o.terrain, deco:o.deco, feature:o.feature, fence:o.fence, decoRot:o.decoRot|0, flowers:o.flowers, soil:o.soil, health:o.health});
          // Keep lawn under open ground when pasting old tiles
          if(n.terrain==='soil' && n.feature!=='path'){
            SOIL_ATTRS.forEach(k=>{ if((n.soil[k]|0) < 80) n.soil[k] = 84; });
            if(typeof recalc==='function') recalc(n);
          }
        }
      }
      placeHouseOnTiles(neu, E.size, hs.houseTier|0);
      hs.gridSize = E.size;
      hs.tiles = neu;
      hs.grassCanvasV3 = true;
      if(homesteadMode){
        state.grid = neu;
        state.gridSize = E.size;
        GRID = E.size;
        layout(); centerCamera();
      }
    }
    toast(`${E.em} ${E.name} unlocked!`); confetti(30); SND.badge();
    save(); updateHUD(); openHomesteadCatalog('expand');
    buildPalette();
    return;
  }
  if(kind==='tool'){
    const D = HS_CATALOG.find(x=>x.id===id);
    if(!D) return;
    if(!hsItemUnlocked(D)){ toast('🔒 Buy the matching kit under Expand first.'); SND.uhoh(); openHomesteadCatalog('expand'); return; }
    if(bank < D.cost){ toast(`Need 🪙${D.cost} in the bank.`); SND.uhoh(); return; }
    tool = D.id;
    if(D.cat) hsPalCat = D.cat;
    closeModal();
    document.querySelectorAll('.tool').forEach(el=>el.classList.toggle('active', el.id==='tool_'+D.id));
    canvas.classList.toggle('tooling', true);
    // CK/CL — first catalog pick always shows; later picks throttled (yard place uses hsPlaceQuietToast)
    if(!camp.tipsShown) camp.tipsShown = {};
    const em = String(D.em||'').replace(/\s+/g,' ').trim();
    const nm = String(D.name||D.id||'').replace(/\s+/g,' ').trim();
    const pickLab = nm
      ? (D.cost===0 ? `${em?em+' ':''}${nm} — free place` : `${em?em+' ':''}${nm} ready · 🪙${D.cost} each`)
      : '';
    if(pickLab){
      if(!camp.tipsShown.hs_catalog_pick){
        camp.tipsShown.hs_catalog_pick = true;
        toast(pickLab); // first pick never throttled away
      }else{
        toast(pickLab, {throttleMs:1800});
      }

}
function houseUpgradeCeremony(H){

/** Homestead place toasts: one "Placed!" energy per visit, then quiet (A2). */
function hsPlaceQuietToast(label){
  if(!camp.tipsShown) camp.tipsShown = {};
  if(!camp.tipsShown.hs_first_place_visit){
    camp.tipsShown.hs_first_place_visit = true;

  // subsequent places: floater only (no toast spam)
